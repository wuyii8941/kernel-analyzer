id: F2_MX
title: OCP MX block quantization (32 elements, E8M0 shared scale)
kind: K11
survey_class: F
status_of_contract: draft-for-review
sources:
  S1: {identity: standard, doc: "OCP Microscaling Formats (MX) v1.0, section 6.3 conversion", version: "1.0"}
  S2: {identity: standard, doc: "NVIDIA TensorRT, MX-compliant dynamic quantization (round_up_to_e8m0 of amax / qmax)", version: "latest"}
dimensions:
  D1: {status: n/a}
  D2: {status: n/a}
  D3: {status: defined, clauses: [F2.C4]}
  D4: {status: n/a}
  D5: {status: defined, clauses: [F2.C1, F2.C2]}
  D6: {status: n/a}
  D7: {status: n/a}
  D8: {status: n/a}
  D9: {status: open, reason: "stochastic rounding of MX elements in training recipes must be declared per tensor; F1.C3 applies once the kernel's uniforms are captured"}
  D10: {status: n/a}
  D11: {status: defined, clauses: [F2.C3]}
  D12: {status: n/a}
clauses:
  F2.C1: {statement: "X = 2^(floor(log2 amax) - emax_elem), exponent clamped to [-127, 127]", basis: [S1], guarantee: exact}
  F2.C2: {statement: "element = round_ties_even(v / X) saturated to the element maximum", basis: [S1], guarantee: exact}
  F2.C3: {statement: "all-zero block: elements are 0, scale unconstrained", basis: [S1], guarantee: allowed_set}
  F2.C4: {statement: "blocks run along the axis the kernel declares; the quantized tensor and its transpose are different functions", basis: [S1], guarantee: exact}
readings:
  F2-A1: {main: ocp_floor, alternatives: [ceil_pow2], note: "TensorRT rounds amax/qmax up to a power of two; a kernel must declare which rule it implements"}
examples:
  E1: {call: mx, clauses: [F2.C1, F2.C2], input: {block: [500, 1, "-3/4"], fmt: e4m3}, expected: [1, [448, 1, "-3/4"]], readings: {ceil_pow2: [2, [256, "1/2", "-3/8"]]}}
  E2: {call: mx, clauses: [F2.C1, F2.C2], input: {block: [6, "1/3"], fmt: e2m1}, expected: [1, [6, "1/2"]]}
  E3: {call: mx, clauses: [F2.C1, F2.C4], input: {block: [12, 1], fmt: e2m1}, expected: [2, [6, "1/2"]]}
  E4: {call: mx, clauses: [F2.C3], input: {block: [0, 0], fmt: e4m3}, expected: [none, [0, 0]]}
mutants:
  M1: {clauses: [F2.C1], misreading: "ceil(log2 amax) instead of floor"}
  M2: {clauses: [F2.C2], misreading: "no saturation of elements (overflow to NaN)"}
  M3: {clauses: [F2.C1], misreading: "scale amax / max without restricting it to a power of two"}
