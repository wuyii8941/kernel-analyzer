id: A1_LINEAR
title: linear attention and state recurrences (linear, scalar decay, GLA, DeltaNet, Gated DeltaNet, KDA)
kind: K7
survey_class: A
status_of_contract: draft-for-review
sources:
  S1: {identity: paper, doc: "Katharopoulos 2020; RetNet; Mamba-2; GLA (Yang 2024); DeltaNet (Schlag 2021, Yang 2024); Gated DeltaNet (Yang 2025); Kimi Linear (KDA)", version: "as published"}
  S2: {identity: model_impl, doc: "flash-linear-attention naive.py recurrences (fp32), default scale K^-0.5", version: "survey 9bb8abe"}
dimensions:
  D1: {status: defined, clauses: [A1.C1]}
  D2: {status: defined, clauses: [A1.C2]}
  D3: {status: defined, clauses: [A1.C3]}
  D4: {status: n/a}
  D5: {status: n/a}
  D6: {status: n/a}
  D7: {status: defined, clauses: [A1.C1, A1.C3]}
  D8: {status: defined, clauses: [A1.C4]}
  D9: {status: n/a}
  D10: {status: n/a}
  D11: {status: open, reason: "padding slots of the state pool and partially filled chunks need each engine's convention"}
