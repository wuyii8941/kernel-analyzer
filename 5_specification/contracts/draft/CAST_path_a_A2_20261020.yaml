schema_version: '1.2'
id: CAST
role: CAST
title: Finite conversion of floating, integer and boolean values to the common binary floating dtypes
review:
  status: drafted
  author: Claude (spec v3 author), 2026-10-16; integer/boolean source extension Claude (path A closure package F), 2026-10-20
  reviewer: Codex independent source, domain, rounding and implementation review
  date: '2026-10-18'
  scope: Dense finite f16/bf16/f32/f64, in-range i64/i32/i16/i8/u8 and boolean source values converted to f16/bf16/f32/f64 under the selected IEEE roundTiesToEven profile; the integer/boolean extension
    of 2026-10-20 is not yet reviewed
activation:
  implementation_status: pending
  implementation_evidence: evidence/cast_implementation.md; evidence/cast_integer_sources.md
  runtime_binding_status: pending
  requires:
  - source_profile_matched
  - input_contract_validated
  - all_required_outputs_bound
  - reference_semantics_and_guarantees_validated
  - no_unresolved_contradiction
  - reviewed_contract_and_adapter_match_current
covers:
- prims.convert_element_type
- aten._to_copy
profiles:
  finite_rne:
    meaning: Convert every exactly represented finite f16/bf16/f32/f64 value, every in-range i64/i32/i16/i8/u8 integer and every boolean (False as 0, True as 1) to a selected target among f16/bf16/f32/f64
      using IEEE 754 roundTiesToEven. A source value exactly representable in the target is returned unchanged under any rounding rule. The result must remain finite. Shape is preserved and every result
      is exact.
    task_choice_required: true
    basis:
    - CA.PROFILE
    - CA.SCHEMA
    - CA.RNE
    - CA.INTSRC
    - CA.SPLIT
outputs:
  out:
    shape: exactly the input shape, including every empty dimension
    guarantee: exact
comparison:
  input_binding: 'Each input record denotes an already stored value and therefore must be exactly representable in its declared source dtype: a finite floating value of f16/bf16/f32/f64, an integer inside
    the range of i64/i32/i16/i8/u8, or a boolean for b8. The binding must name the floating target dtype and select roundTiesToEven.'
  quality: Exact equality of target dtype, shape and every converted coordinate; no tolerance.
  test_evidence: Independent integer-arithmetic encoders cover all four admitted floating formats, their normal and subnormal boundaries, adjacent values and midpoint ties; integer sources are checked at
    the 2^p precision boundary of every target, at signed and unsigned range limits and at the f16 overflow threshold; retained PyTorch, C++ and Triton sources fix the call interfaces and conversion rules.
  error_handling: NaN, malformed calls and records whose values are not values of the declared source dtype (out-of-range integers, non-boolean b8 values) are invalid_input. Integer or boolean targets,
    float8 or complex dtypes, infinities, output overflow and unselected copy options are unsupported.
decisions:
- id: CA.PROFILE
  status: drafted
  statement: This contract explicitly selects IEEE 754 roundTiesToEven for finite conversion to a binary floating target. PyTorch's public Tensor.to page does not name a rounding direction for any conversion
    to a floating dtype; it cites C++ type conversion rules only for floating-to-integer truncation. Applying C++ [conv.double] and [conv.fpint] to floating-to-floating and integer-to-floating conversion
    is this contract's own reading, not a statement of the Tensor.to page; under that reading an inexact conversion is an implementation-defined choice between the two neighbouring representable values.
    A caller must therefore bind this profile to a task or kernel that selects the same rule. Other legal conversion rules are not declared wrong by this contract.
  basis:
  - IEEE754.RNE
  - T_TO.DEF
  - T_TO.TRUNC
  - CPP23_CONV_DOUBLE.BETWEEN
  - CPP23_CONV_FPINT.INEXACT
- id: CA.SCHEMA
  status: reviewed
  statement: prims.convert_element_type takes one tensor and one target dtype and creates a new tensor. The selected aten._to_copy form requires dtype and leaves layout, device, pin_memory and memory_format
    unset, with non_blocking false. Both preserve logical shape and do not modify the input.
  basis:
  - TS_PRIMS.CONVERT_ELEMENT_TYPE
  - TS_NATIVE_FUNCTIONS.TO_COPY_SCHEMA
- id: CA.RNE
  status: reviewed
  statement: Every exact finite source value is rounded to the nearest representable target value; an exact midpoint selects the neighbor whose least-significant significand bit is even. Normal and subnormal
    target values use the same rule. Same-dtype and widening conversions are exact.
  basis:
  - IEEE754.RNE
- id: CA.FINITE
  status: drafted
  statement: Source dtypes are f16, bf16, f32, f64, i64, i32, i16, i8, u8 or b8; target dtypes are f16, bf16, f32 or f64. Floating inputs must be finite point values exactly representable in the declared
    source dtype; integer inputs must lie in the range of their declared dtype; b8 inputs must be booleans. The rounded target must be finite. Integer or boolean targets, float8, complex, NaN, infinities
    and target overflow remain outside this profile.
  basis:
  - CA.PROFILE
  - CA.RNE
  - CA.INTSRC
  - CA.F2I
- id: CA.INTSRC
  status: drafted
  statement: 'An integer source value (i64, i32, i16, i8, u8) is the mathematical integer it stores; torch.uint8 is an unsigned 8-bit integer, so u8 values are 0..255 and never negative, while i8/i16/i32/i64
    are signed. When that integer is exactly representable in the target it is returned unchanged (C++ [conv.fpint]: the result is exact if possible), which holds for every rounding rule. When it lies between
    two adjacent target values, C++ allows either neighbour and this profile selects the roundTiesToEven neighbour (CA.PROFILE, CA.RNE): for example 2^24+1 -> 2^24 and 2^24+3 -> 2^24+4 in f32, 2^53+3 ->
    2^53+4 in f64, 2^63-1 -> 2^63 in f32. The integer is rounded once, directly to the target, without an intermediate format. A boolean source (torch.bool) converts False to 0 and True to 1 (C++ [conv.fpint],
    applied under the reading of CA.PROFILE). Range follows IEEE 754, not C++: the integer is first rounded by roundTiesToEven with unbounded exponent (IEEE 754 Section 4.3.1) and overflow is judged on
    that rounded result (Section 7.4). Hence integers 65505..65519, although above the largest f16 value 65504 and so outside the range that C++ [conv.fpint] covers, round to 65504 and are admitted, while
    an integer whose rounded result exceeds the target maximum (for f16, |n| >= 65520, which rounds to 2^16) overflows and is unsupported, as for floating sources; this profile makes no claim about the
    infinity IEEE 754 would deliver there. Alternatives considered: reading u8 storage as signed, mapping True to -1 (all-ones bit pattern), truncating toward zero, or converting through f32; none is supported
    by the cited sources.'
  basis:
  - CPP23_CONV_FPINT.EXACT
  - CPP23_CONV_FPINT.INEXACT
  - CPP23_CONV_FPINT.BOOL
  - IEEE754.RNE
  - IEEE754.OVERFLOW
  - T_TENSOR_ATTR.INT_DTYPES
  - CA.PROFILE
- id: CA.SPLIT
  status: drafted
  statement: 'Alternatives for integer sources: (a) a separate profile without task choice restricted to integer (or any) source values exactly representable in the target, because exactness can be established
    per value and C++ [conv.fpint]/[conv.double] then fix the result without any rounding choice; (b) a separate task-choice profile only for integer sources; (c) extend finite_rne to integer and boolean
    sources [chosen]. Reason: on exactly representable values finite_rne returns the same exact result as (a), so (a) would add a second profile that applies to the same calls with the same result; path
    A records a task choice for finite_rne on aten._to_copy, and two applicable profiles for one call make profile selection ambiguous. (b) would duplicate the same rounding choice under a second name.
    The consequence is recorded explicitly: for the recorded Qwen2.5-0.5B call aten._to_copy(int64 [1,128,1] position ids, dtype=float32) every value is a small non-negative integer, exactly representable
    in f32, so its result does not depend on the rounding choice even though the profile carries task_choice_required: true.'
  basis:
  - CPP23_CONV_FPINT.EXACT
  - CPP23_CONV_DOUBLE.EXACT
  - CA.PROFILE
- id: CA.F2I
  status: drafted
  statement: 'Floating-to-integer and any-to-boolean conversion are not part of this profile and stay unsupported. Alternative: a profile truncating toward zero, which the Tensor.to page states for floating-to-integer
    conversion, with undefined behaviour when the truncated value does not fit. Not chosen in this package: no recorded path A call needs it, and the undefined out-of-range case, signed zero and the boolean
    target rule would each need their own decision and review.'
  basis:
  - T_TO.TRUNC
  - CPP23_CONV_FPINT.TRUNC
clauses:
- id: CA.C1
  basis:
  - CA.RNE
  statement: finite narrowing uses roundTiesToEven for normal and subnormal results
  observes:
  - out
  evidence_kind: definition
- id: CA.C2
  basis:
  - CA.RNE
  statement: widening and same-dtype conversion preserve every exact input value
  observes:
  - out
  evidence_kind: definition
- id: CA.C3
  basis:
  - CA.SCHEMA
  statement: the functional call returns one complete tensor with the target dtype and the exact input shape while leaving the input unchanged
  observes:
  - out
  evidence_kind: definition
- id: CA.C4
  basis:
  - CA.FINITE
  - CA.F2I
  statement: unrepresentable or out-of-range source records, nonfinite values, target overflow and unreviewed dtypes (integer, boolean, float8 or complex targets) or options are refused before semantic
    comparison
  observes:
  - out
  evidence_kind: definition
- id: CA.C5
  basis:
  - CA.INTSRC
  statement: an integer source value exactly representable in the target is returned unchanged, including signed and unsigned range limits
  observes:
  - out
  evidence_kind: definition
- id: CA.C6
  basis:
  - CA.INTSRC
  - CA.RNE
  statement: an integer source value between two adjacent target values is rounded once, directly to the target, by roundTiesToEven
  observes:
  - out
  evidence_kind: definition
- id: CA.C7
  basis:
  - CA.INTSRC
  statement: a boolean source converts False to 0 and True to 1
  observes:
  - out
  evidence_kind: definition
