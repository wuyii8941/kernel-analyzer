signature:
  inputs:
  - 'op: prims.convert_element_type(x, dtype) or selected aten._to_copy(x, dtype=...)'
  - 'x: one dense tensor of exactly represented finite f16/bf16/f32/f64 values, in-range i64/i32/i16/i8/u8 integers or booleans'
  - 'dtype: one admitted floating target dtype (f16, bf16, f32, f64)'
  pre_state:
  - the complete input tensor
  post_state:
  - the complete converted output tensor; input unchanged
  observation_unit: target dtype, exact shape and every output coordinate
domain:
  valid:
  - dense finite exactly represented f16/bf16/f32/f64 source values, in-range i64/i32/i16/i8/u8 integers and booleans whose finite floating target conversion is selected
  domain_undefined: []
  invalid_input:
  - NaN
  - malformed calls
  - a value not exactly representable in its declared floating source dtype
  - an integer outside the range of its declared integer dtype
  - a b8 value that is not a boolean
  unsupported:
  - integer or boolean targets
  - float8 or complex dtypes
  - infinities
  - target overflow
  - device or layout movement
  - pinning
  - memory-format changes
  - non_blocking copies
  - missing _to_copy dtype
mutation_requirements:
- id: CA.M1
  misreading: narrowing truncates toward zero
  witnesses:
  - CA.E1
- id: CA.M2
  misreading: exact midpoint ties round away from zero
  witnesses:
  - CA.E2
- id: CA.M3
  misreading: subnormal target results flush to zero
  witnesses:
  - CA.E3
- id: CA.M4
  misreading: conversion keeps the source value instead of rounding to the target format
  witnesses:
  - CA.E1
- id: CA.M5
  misreading: an integer not representable in the target is truncated toward zero instead of rounded to nearest even
  witnesses:
  - CA.E14
  - CA.E17
- id: CA.M6
  misreading: boolean True converts to -1 (all-ones signed bit pattern)
  witnesses:
  - CA.E18
- id: CA.M7
  misreading: uint8 storage is read as signed int8 (values 128..255 become negative)
  witnesses:
  - CA.E19
- id: CA.M8
  misreading: integer sources are converted through an intermediate f32 before the target (double rounding)
  witnesses:
  - CA.E16
nonclaims:
- Floating-to-integer and any-to-boolean conversion (CA.F2I); float8, complex and nonfinite conversion; output overflow, including integers whose conversion C++ calls undefined; signed-zero or NaN payload
  behavior; storage layout, device transfer, aliasing and asynchronous scheduling; any concrete Triton cast whose binding has not selected finite_rne.
changes:
- date: '2026-10-18'
  change: Narrow the active contract to exactly represented finite conversions among f16/bf16/f32/f64 with explicit roundTiesToEven task selection and complete output checking.
  trigger: The broad draft treated several conversion families and PyTorch rounding choices as one universal answer without enough independent evidence.
- date: '2026-10-20'
  change: 'Extend finite_rne to in-range i64/i32/i16/i8/u8 integer and boolean sources converted to f16/bf16/f32/f64 (exact when representable, otherwise roundTiesToEven; False/True as 0/1); add decisions
    CA.INTSRC, CA.SPLIT, CA.F2I, clauses CA.C5-CA.C7, examples CA.E13-CA.E28, mutants CA.M5-CA.M8; CA.E9 (i64 -> f32) now expects a value. Draft for path A (A2); review reset to drafted and implementation
    to pending. Review fixes 2026-10-21: removed two stray CA.C4 keys left by flow-style parsing; CA.PROFILE labels applying C++ conversion rules to floating targets as the contract''s own reading; CA.INTSRC
    bases the f16 range boundary on IEEE 754 rounding before overflow (IEEE754.OVERFLOW) and cites T_TENSOR_ATTR.INT_DTYPES for u8 being unsigned.'
  trigger: 'Path A closure package F: the recorded Qwen2.5-0.5B call aten._to_copy(int64 [1,128,1] position ids, dtype=float32) had no applicable profile.'
