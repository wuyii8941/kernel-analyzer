signature:
  inputs: ['real: one selected functional layout call', 'pad autograd: public op, complete input, even integer pad, constant mode, scalar/default value and complete upstream', 'cat autograd: public op, nonempty ordered complete tensor list, integer dim and complete upstream']
  pre_state: [all inputs are unchanged]
  post_state: [the complete logical output tensor or ordered list; pad returns its complete input VJP; cat returns every ordered input VJP]
  observation_unit: every declared output coordinate together with dtype, shape and ordered result position
domain:
  valid: [exactly representable finite f16/bf16/f32/f64 values; integer literals in range for i64/i32/i16/i8/u8 (real profile); boolean literals for b8 (boolean profile); same dtype for multi-tensor calls; documented shapes, dimensions and ranges]
  invalid_input: [NaN; negative zero; unrepresentable floating value or scalar; out-of-range integer tensor literal; malformed call; incompatible shape, dimension, index, slice, split or scatter source; undocumented pad mode string; negative repeat count; output_size different from the total; slice_backward grad_output not matching the slice]
  unsupported: [float8, complex or infinite data; non-integral or out-of-range fill for an integer tensor; fill other than False/True/0/1 for b8; b8 data under the real profile and non-b8 data under the boolean profile; mixed dtypes; reflect, replicate or circular pad modes; tensor-valued repeats; creation operations; copy or fill; dtype views; named dimensions; implicit expand; nondefault memory format; out or in-place variants; storage, stride, aliasing or device effects]
mutation_requirements:
- {id: LY.M1, misreading: view reads elements in column-major order, witnesses: [LY.E1]}
- {id: LY.M2, misreading: permute applies the inverse permutation, witnesses: [LY.E5]}
- {id: LY.M3, misreading: transpose leaves axes unchanged, witnesses: [LY.E6]}
- {id: LY.M4, misreading: expand leaves singleton dimensions unchanged, witnesses: [LY.E8]}
- {id: LY.M5, misreading: squeeze with dim removes every singleton dimension, witnesses: [LY.E11]}
- {id: LY.M6, misreading: slice ignores the step, witnesses: [LY.E13]}
- {id: LY.M7, misreading: cat reverses tensor order, witnesses: [LY.E16]}
- {id: LY.M8, misreading: split drops the smaller final chunk, witnesses: [LY.E19]}
- {id: LY.M9, misreading: padding pairs apply from the first dimension forwards, witnesses: [LY.E21]}
- {id: LY.M10, misreading: scatter operations return the unchanged base, witnesses: [LY.E22, LY.E23]}
- {id: LY.M11, misreading: triu uses the opposite diagonal sign, witnesses: [LY.E26]}
- {id: LY.M12, misreading: negative pad values are ignored instead of cropping, witnesses: [LY.E34]}
- {id: LY.M13, misreading: the input VJP reads upstream without the positive-pad and crop coordinate shift, witnesses: [LY.E34, LY.E35]}
- {id: LY.M14, misreading: cropped input coordinates receive a gradient, witnesses: [LY.E34, LY.E36]}
- {id: LY.M15, misreading: the complete input gradient may be omitted, witnesses: [LY.E34]}
- {id: LY.M16, misreading: cat may reverse the ordered input sequence, witnesses: [LY.E40]}
- {id: LY.M17, misreading: every cat input gradient starts from upstream offset zero, witnesses: [LY.E40]}
- {id: LY.M18, misreading: the final cat input gradient may be omitted, witnesses: [LY.E40]}
- {id: LY.M19, misreading: aten.pad ignores the given value and fills zero, witnesses: [LY.E45, LY.E54]}
- {id: LY.M20, misreading: an integer or boolean tensor silently converts any fill (truncation toward zero or nonzero as True), witnesses: [LY.E48, LY.E55]}
- {id: LY.M21, misreading: slice_backward places grad_output at offset zero and ignores start, witnesses: [LY.E56]}
- {id: LY.M22, misreading: slice_backward ignores the step and writes a contiguous block, witnesses: [LY.E58]}
- {id: LY.M23, misreading: repeat_interleave tiles the whole axis like Tensor.repeat, witnesses: [LY.E62, LY.E64]}
- {id: LY.M24, misreading: repeat_interleave ignores dim and always flattens, witnesses: [LY.E62]}
- {id: LY.M25, misreading: tril keeps the upper triangle, witnesses: [LY.E68, LY.E69]}
nonclaims:
- Storage identity, aliasing, strides, memory format, device placement and signed zero are not certified.
- Creation, dtype conversion, copy/fill state effects, gradients other than the selected constant-pad, cat and slice_backward VJPs and unselected overloads are not certified. Integer and boolean data are certified only for the listed data-movement operations with one dtype per call.
- slice_backward rests on PyTorch 2.10's derivative table and official decomposition (reference programs) together with the documented slice; agreement means agreement with that reference semantics.
- PyTorch 2.10 eager accepts non-integral fills for integer tensors (truncating) and nonzero fills for b8 (as True); these undocumented conversions are refused, not judged.
changes:
- date: '2026-10-20'
  change: >-
    Extend the real profile to integer tensors and add a boolean profile (output bool_out) for the selected
    data-movement operations (LY.EXACT_DATA, fill conversion decision); add aten.pad (constant mode),
    aten.slice_backward and aten.repeat_interleave.self_int to covers and the ATen interface with decisions
    LY.ATEN_PAD, LY.SLICE_BACKWARD and LY.REPEAT_INTERLEAVE, examples LY.E45-E73 and mutants LY.M19-M25. Public
    functional autograd profiles now refuse ATen-call records as unsupported. Status returned to drafted/pending
    for independent review.
  trigger: >-
    Path A closure (G7): recorded aten.pad on int64 labels (value -100.0), aten.slice_backward (bf16/f32),
    aten.repeat_interleave.self_int (f32) and aten.tril on a b8 mask had no admitted profile.
- date: '2026-10-19'
  change: >-
    Add a PyTorch 2.10 public Tensor-list cat profile with complete forward and one ordered VJP per input, including
    the documented one-dimensional empty input and zero-width-axis cases.
  trigger: >-
    The retained FlagGems 5.0.2 cat implementation exposed that the existing LAYOUT.real profile could judge only
    logical forward values and could not decide a complete public training task.
- date: '2026-10-19'
  change: >-
    Add a PyTorch 2.10 public constant-pad profile with complete forward and input VJP, including mixed positive and
    negative padding, fully cropped outputs and the crop-before-fill validation order.
  trigger: >-
    A real common-operator audit found that the existing logical-value profile covered only aten.constant_pad_nd
    forward and could not judge a public training call.
- date: '2026-10-18'
  change: >-
    Replace the active broad layout-and-creation draft with a finite floating logical-value profile for common
    functional layout, slicing, joining, padding, placement and triangular operations. Preserve the former contract under contracts/draft.
  trigger: >-
    The former profile admitted arbitrary mathematical values under floating dtype labels, mixed creation rounding
    and copy/fill state effects with pure layouts, labelled numeric results discrete and had no complete output checker.
