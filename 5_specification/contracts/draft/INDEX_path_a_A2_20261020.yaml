schema_version: '1.2'
id: INDEX
role: GATHER
title: Physical read-only gather, index-select and embedding lookup
review:
  status: drafted
  author: OpenAI Codex, independent implementation review; Claude (path A integer-data and padding_idx extension), 2026-10-20
  date: '2026-10-18'
  scope: PyTorch 2.10 default functional read-only lookup schemas on physical finite floating tensors (and, in the 2026-10-20 draft, integer gather/index_select data and a valid embedding padding_idx) with int64 indices
activation:
  implementation_status: pending
  implementation_evidence: evidence/arith_mathfn_index_domains.md (2026-10-20 change)
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers: [aten.gather, aten.index_select, aten.embedding, torch.gather, torch.index_select,
  torch.nn.functional.embedding]
profiles:
  real:
    meaning: >-
      Read-only lookup for physical finite f16, bf16, f32 or f64 values and int64 indices; gather and index_select
      also move int64, int32, int16, int8 or uint8 data (IX.INTEGER_DATA). gather selects along one integer dimension
      without broadcasting; index_select selects a one-dimensional index list; embedding selects rows of a
      two-dimensional floating weight, with or without a valid padding_idx, which does not change the forward value
      (IX.PADDING_FORWARD). Only the default non-sparse forward forms are selected.
    task_choice_required: false
    basis: [IX.SCHEMA, IX.PHYSICAL, IX.LOOKUP, IX.INTEGER_DATA, IX.PADDING_FORWARD]
outputs:
  out:
    shape: the complete logical result shape fixed by the selected operation
    guarantee: exact
comparison:
  input_binding: >-
    Floating tensor records are the exact physical values received in the declared dtype. Integer data records and
    index records are literal integers of their dtype. Shape and dtype are part of both input and observed output records.
  quality: Exact logical values, dtype and shape; no tolerance and no partial output.
  test_evidence: Independent NumPy coordinate construction and PyTorch 2.10 comparisons over all selected dtypes.
  error_handling: Malformed physical records and illegal shapes or ranges are invalid_input; unselected dtypes,
    options, overloads and operations are unsupported.
decisions:
- id: IX.SCHEMA
  status: drafted
  statement: >-
    Select only the default functional gather, index_select and embedding schemas. gather's sparse_grad is fixed to
    false; embedding's scale_grad_by_freq and sparse are fixed to their defaults and padding_idx follows
    IX.PADDING_FORWARD. Out, backward,
    scatter, mutation and named-dimension forms are different tasks and are outside this profile.
    gather and index_select accept the native self/index and public Python input/index keyword names, respectively.
    These map to internal a/idx before argument validation; legacy DSL names remain accepted, but duplicate
    positional or keyword bindings are invalid even when their values agree.
  basis: [TS_NATIVE_FUNCTIONS.INDEX_SCHEMAS, T_GATHER.DEF, T_INDEX_SELECT.DEF]
- id: IX.PUBLIC_EMBEDDING
  status: drafted
  statement: >-
    Public torch.nn.functional.embedding takes input indices before weight; native aten.embedding takes weight
    before indices. The public no-padding default is null and becomes the native sentinel -1; a public padding_idx in
    [-V, V) is normalized by adding V when negative, and one outside that range is invalid. This read-only profile
    accepts public max_norm=null, norm_type=2, scale_grad_by_freq=false and sparse=false only. Frequency scaling and
    the padding gradient belong to the separate EMB task; max_norm mutates weight and is not a lookup.
  basis: [T_EMBEDDING_F.DEF, TS_FUNCTIONAL_EMB.EMB_PADDING, TS_FUNCTIONAL_EMB.EMB_RENORM]
- id: IX.PHYSICAL
  status: drafted
  statement: >-
    The executable profile is restricted to finite f16, bf16, f32 and f64 tensor records whose values are exactly
    representable in the declared dtype, integer data records for gather and index_select (IX.INTEGER_DATA), plus
    literal int64 index tensors. This is the declared usable domain; it does not claim semantics for special values,
    boolean or complex data, integer embedding weights, mixed records or other index dtypes.
  basis: [T_GATHER.DEF, T_INDEX_SELECT.DEF, T_EMBEDDING_F.DEF]
- id: IX.INTEGER_DATA
  status: drafted
  statement: >-
    gather and index_select copy input elements to output coordinates; their documented definitions involve no
    arithmetic on the copied values and place no floating restriction on input. Integer data (int64, int32, int16,
    int8, uint8) is therefore moved exactly and keeps its dtype; values must be literal integers inside the dtype
    range. Alternatives: keep integer data unsupported (refuses the recorded bert gather of an int64 buffer; rejected,
    no documented reason), or admit boolean data as well (outputs would need a boolean output kind; not selected).
    embedding is documented with a floating weight ("Embedding matrix of floating point type"), so integer weights
    stay unsupported.
  basis: [T_GATHER.DEF, T_INDEX_SELECT.DEF, T_EMBEDDING_F.DEF]
- id: IX.PADDING_FORWARD
  status: drafted
  statement: >-
    The PyTorch 2.10 embedding pages define padding_idx only through the gradient: entries at padding_idx do not
    contribute to the gradient and that row is not updated during training. The forward is the lookup of the rows of
    weight given by the indices, and the native forward is weight.index_select(0, indices) without reading
    padding_idx; the page's padding example returns zeros only because that row was zeroed beforehand. Hence the
    forward value is the same lookup for every valid padding_idx; zeroing the padding row in the forward is a
    misreading (it is nn.Embedding's construction-time initialisation, not part of the functional call). Accepted
    values: native -1 or a row index 0 <= p < V; public null or [-V, V). Other native values are unsupported (not
    documented); out-of-range public values are invalid. max_norm, scale_grad_by_freq=true and sparse=true stay
    outside this forward profile.
  basis: [T_EMBEDDING_F.DEF, T_EMBEDDING_F.PADDING, T_EMBEDDING.PADDING, TS_EMBEDDING_CPP.FORWARD, TS_FUNCTIONAL_EMB.EMB_PADDING]
- id: IX.LOOKUP
  status: reviewed
  statement: >-
    All three selected operations copy existing input values without arithmetic: gather uses the index value at each
    output coordinate on the selected axis, index_select copies the listed slices, and embedding copies the listed
    rows. Repeated indices repeat values and do not create an allowed-set result.
  basis: [T_GATHER.DEF, T_INDEX_SELECT.DEF, T_EMBEDDING_F.DEF, TS_EMBEDDING_CPP.FORWARD]
clauses:
- id: IX.C1
  basis: [IX.SCHEMA, IX.PHYSICAL]
  statement: Every selected call uses one physical source (finite floating, or integer for gather and index_select),
    literal int64 indices and the exact default functional schema; all inputs are read-only.
  observes: [out]
  evidence_kind: definition
- id: IX.C2
  basis: [T_GATHER.DEF, IX.LOOKUP]
  statement: >-
    gather returns the shape of index; input and index have the same rank, sizes outside the selected dimension do
    not exceed the input sizes, and each output coordinate reads input with only that dimension replaced by the
    corresponding nonnegative in-range index value. Empty index returns its empty shape.
  observes: [out]
  evidence_kind: definition
- id: IX.C3
  basis: [T_INDEX_SELECT.DEF, IX.LOOKUP]
  statement: >-
    index_select requires a one-dimensional index tensor and returns the input shape with the selected dimension
    replaced by the index length; output slice j is input slice index[j], including repeated indices.
  observes: [out]
  evidence_kind: definition
- id: IX.C4
  basis: [T_EMBEDDING_F.DEF, TS_EMBEDDING_CPP.FORWARD, IX.LOOKUP, IX.PUBLIC_EMBEDDING, IX.PADDING_FORWARD]
  statement: >-
    embedding requires a two-dimensional weight and returns indices.shape followed by the embedding dimension; every
    output row is the corresponding weight row, including rows at a valid padding_idx. This profile selects
    scale_grad_by_freq=false and sparse=false, so it makes no backward, renormalisation or sparse-layout claim.
  observes: [out]
  evidence_kind: definition
- id: IX.C5
  basis: [IX.SCHEMA, IX.PHYSICAL]
  statement: >-
    Scatter, mutation, backward accumulation, max_norm, frequency scaling, sparse gradients, special floating
    values, boolean or complex data, integer embedding weights, non-int64 indices and out overloads receive no
    reference answer from this profile.
  observes: [out]
  evidence_kind: definition
examples:
- {id: IX.E1, profile: real, clauses: [IX.C1, IX.C2], input: {op: aten.gather, args: [{t: f32, v: [[1, 2], [3, 4]]}, 1,
      {t: i64, v: [[0, 0], [1, 0]]}]}, expected: {outcome: value, fields: {out: [[1, 1], [4, 3]]}}}
- {id: IX.E2, profile: real, clauses: [IX.C2], input: {op: aten.gather, args: [{t: f16, v: [[1, 2], [3, 4]]}, 0,
      {t: i64, v: [[1, 0]]}]}, expected: {outcome: value, fields: {out: [[3, 2]]}}}
- {id: IX.E3, profile: real, clauses: [IX.C2], input: {op: aten.gather, args: [{t: f32, v: [[1, 2], [3, 4]]}, -1,
      {t: i64, v: [[1], [0]]}]}, expected: {outcome: value, fields: {out: [[2], [3]]}}}
- {id: IX.E4, profile: real, clauses: [IX.C2], input: {op: aten.gather, args: [{t: f32, v: [[1, 2], [3, 4]]}, 1,
      {t: i64, v: [], shape: [0, 3]}]}, expected: {outcome: value, fields: {out: []}}}
- {id: IX.E5, profile: real, clauses: [IX.C2], input: {op: aten.gather, args: [{t: f32, v: [1, 2]}, 0,
      {t: i64, v: [-1]}]}, expected: {outcome: invalid_input}}
- {id: IX.E6, profile: real, clauses: [IX.C2], input: {op: aten.gather, args: [{t: f32, v: [1, 2]}, 0,
      {t: i64, v: [2]}]}, expected: {outcome: invalid_input}}
- {id: IX.E7, profile: real, clauses: [IX.C5], input: {op: aten.gather, args: [{t: f32, v: [1, 2]}, 0,
      {t: i32, v: [0]}]}, expected: {outcome: unsupported}}
- {id: IX.E8, profile: real, clauses: [IX.C5], input: {op: aten.gather, args: [{t: f32, v: [1, 2]}, 0,
      {t: i64, v: [0]}], kwargs: {sparse_grad: true}}, expected: {outcome: unsupported}}
- {id: IX.E9, profile: real, clauses: [IX.C3], input: {op: aten.index_select, args: [{t: bf16, v: [[1, 2], [3, 4], [5, 6]]},
      0, {t: i64, v: [2, 0, 2]}]}, expected: {outcome: value, fields: {out: [[5, 6], [1, 2], [5, 6]]}}}
