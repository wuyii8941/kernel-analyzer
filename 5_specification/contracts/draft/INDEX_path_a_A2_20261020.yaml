signature:
  inputs: [selected default functional operation and exact positional or keyword arguments,
    physical finite floating source tensor (or integer gather/index_select data), literal int64 index tensor]
  pre_state: [all input tensors are unchanged]
  post_state: [one complete newly returned logical tensor]
  observation_unit: every output coordinate together with dtype and shape
domain:
  valid: [finite physical f16/bf16/f32/f64 sources, integer gather and index_select data, int64 nonnegative in-range indices,
      selected shapes and defaults, valid embedding padding_idx]
  invalid_input: [unrepresentable source value, non-integer or out-of-range integer data, malformed record, invalid dimension,
      rank or shape, out-of-range index, public padding_idx outside -V..V-1]
  unsupported: [scatter and mutation, backward operations, boolean or complex data, integer embedding weights, non-int64
      indices, special floating values, sparse gradients, max_norm, frequency scaling, native padding_idx other than -1
      or a row index, out overloads and layout or alias effects]
mutation_requirements:
- {id: IX.M1, misreading: gather indexes the next axis, witnesses: [IX.E1]}
- {id: IX.M2, misreading: gather uses index plus one, witnesses: [IX.E1]}
- {id: IX.M3, misreading: index_select removes repeated indices, witnesses: [IX.E9]}
- {id: IX.M4, misreading: index_select reverses the index list, witnesses: [IX.E10]}
- {id: IX.M5, misreading: embedding uses the following row, witnesses: [IX.E12]}
- {id: IX.M6, misreading: embedding flattens the index shape, witnesses: [IX.E12]}
- {id: IX.M7, misreading: the padding_idx row is zeroed in the forward lookup, witnesses: [IX.E16, IX.E27]}
- {id: IX.M8, misreading: integer gather data passes through float32, witnesses: [IX.E31]}
nonclaims:
- No result is certified for scatter, update, mutation, gradient accumulation, max_norm, sparse layout, aliasing,
  device placement, strides or another overload.
- Exact copied logical values do not claim that every device uses the same physical addressing for unsupported layouts.
changes:
- date: '2026-10-20'
  change: >-
    gather and index_select move integer data exactly (IX.INTEGER_DATA); embedding accepts a valid native or public
    padding_idx without changing the forward value (IX.PADDING_FORWARD). IX.E16 and IX.E25 change from unsupported
    to values. Review and implementation status reset to drafted / pending.
  trigger: >-
    Path A closure (G7): the recorded bert gather of an int64 buffer and the recorded bert embedding with
    padding_idx 0 were refused by the floating-only, default-padding profile.
- date: '2026-10-19'
  change: Give public functional embedding its documented argument order and defaults, reusing native lookup only after validation.
  trigger: A real FlagGems public call matched native PyTorch but the reference misread its indices as weight.
- date: '2026-10-19'
  change: Map official gather and index_select keyword names before strict argument validation and output checking.
  trigger: A separate FlagGems public-call batch exposed rejection of the documented index keyword; formulas unchanged.
- date: '2026-10-18'
  change: >-
    Replace the active broad indexing/scatter/embedding draft with a reviewed read-only forward lookup profile on
    physical finite floating tensors and int64 indices. Preserve the former broad contract under contracts/draft.
  trigger: >-
    The former profile mixed exact copies, floating accumulation, mutation and nondeterministic allowed sets under one
    output guarantee, so it could not safely serve as a common ground truth.
