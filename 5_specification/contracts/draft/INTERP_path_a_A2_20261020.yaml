signature:
  inputs: [complete physical rank-4 input, explicit positive output size, fixed public nearest options, complete same-dtype upstream]
  pre_state: [input and upstream are unchanged]
  post_state: [complete interpolated output and complete input VJP]
  observation_unit: every output and input-gradient coordinate with dtype and shape
domain:
  valid: [positive physical rank-4 finite f16/bf16/f32/f64 tensors, positive scalar or pair output size, complete same-dtype upstream, selected fixed options]
  invalid_input: [missing or extra field, malformed or nonpositive size, upstream shape or dtype mismatch, invalid option type, unrepresentable physical value]
  unsupported: [scale-factor tasks, nearest-exact, linear bilinear bicubic trilinear area or antialiased modes, other ranks or dtypes, special values and signed-zero distinctions]
mutation_requirements:
- {id: IN.M1, misreading: use nearest-exact half-pixel coordinates, witnesses: [IN.E2]}
- {id: IN.M2, misreading: round scaled coordinates instead of taking floor, witnesses: [IN.E2]}
- {id: IN.M3, misreading: exchange the height and width scale ratios, witnesses: [IN.E2]}
- {id: IN.M4, misreading: overwrite repeated gradient contributions instead of summing them, witnesses: [IN.E1]}
- {id: IN.M5, misreading: omit the complete input gradient, witnesses: [IN.E1]}
- {id: IN.M6, misreading: the ATen overload ignores given scales and always uses input/output size ratios, witnesses: [IN.E10, IN.E11]}
- {id: IN.M7, misreading: a given scale multiplies the output index instead of dividing it, witnesses: [IN.E10]}
- {id: IN.M8, misreading: scales_h and scales_w are exchanged, witnesses: [IN.E11]}
- {id: IN.M9, misreading: upsample_nearest2d_backward overwrites repeated contributions instead of summing them, witnesses: [IN.E15]}
- {id: IN.M10, misreading: the ATen overload uses half-pixel nearest-exact coordinates, witnesses: [IN.E10, IN.E12]}
nonclaims:
- This profile selects PyTorch 2.10 legacy nearest with explicit size; it makes no claim about a universal nearest-neighbor convention.
- Device execution rounding, a Triton binding and statistical bias remain separate from this exact task reference.
- The ATen profile rests on PyTorch 2.10's schema, derivative table and official decomposition (reference programs) plus the documented OpenCV INTER_NEAREST compatibility; agreement means agreement with that reference semantics. Without scales it uses the exact ratio isize/osize like IN.INDEX and does not model floating rounding of that index computation; with scales only exactly evaluable index arithmetic is admitted.
- PyTorch 2.10 eager behaviour for indices beyond the input (clamping, or the output==2*input shortcut that ignores scales) is not judged.
changes:
- date: '2026-10-20'
  change: >-
    Add the ATen-call profile torch210_aten_upsample_nearest2d (task_choice_required false) for
    aten.upsample_nearest2d and aten.upsample_nearest2d_backward with decisions IN.ATEN and IN.ATEN_SCALES, clauses
    IN.C5-C7, examples IN.E9-E20 and mutants IN.M6-M10. The public profile refuses ATen-call records as
    unsupported. Status returned to drafted/pending for independent review.
  trigger: >-
    Path A closure (G6): recorded trigger D18 aten.upsample_nearest2d(x [2,3,10,8] non-contiguous, [20,16], 2.0, 2.0)
    reached INTERP, but the adapter had no ATen interface.
- {date: '2026-10-19', note: Added after a real FlagGems public interpolate call exposed a common operator with no complete ground truth in the active catalog.}
