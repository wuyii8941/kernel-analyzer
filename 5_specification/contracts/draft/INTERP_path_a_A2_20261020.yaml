schema_version: '1.2'
id: INTERP
role: INTERP
title: PyTorch 2.10 two-dimensional legacy nearest interpolation with complete input VJP, and the ATen upsample_nearest2d overloads
review:
  status: drafted
  author: OpenAI Codex, source and implementation review (2026-10-19); Claude, path A closure package C ATen interface (2026-10-20)
  date: '2026-10-20'
  scope: Explicit positive output size, rank-4 physical finite floating input, legacy nearest mode, complete output and input VJP; ATen upsample_nearest2d and upsample_nearest2d_backward with output_size and optional exact-arithmetic scales
activation:
  implementation_status: pending
  implementation_evidence: evidence/interpolate_implementation.md; evidence/layout_pool_interp_aten.md
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers: [torch.nn.functional.interpolate, aten.upsample_nearest2d, aten.upsample_nearest2d_backward]
profiles:
  torch210_nearest2d_size_autograd:
    meaning: >-
      PyTorch 2.10 functional interpolate on a positive rank-4 physical finite f16/bf16/f32/f64 tensor with an
      explicit positive two-dimensional output size, mode='nearest', align_corners=None, scale_factor=None,
      recompute_scale_factor None or false and antialias=false; return the complete forward and input VJP.
    outputs: [out, grad]
    task_choice_required: true
    basis: [IN.SCHEMA, IN.INDEX, IN.GRAD]
  torch210_aten_upsample_nearest2d:
    meaning: >-
      The PyTorch 2.10 ATen overloads upsample_nearest2d(self, output_size, scales_h=None, scales_w=None) and
      upsample_nearest2d_backward(grad_output, output_size, input_size, scales_h=None, scales_w=None) on positive
      rank-4 physical finite f16/bf16/f32/f64 tensors. The overload itself selects legacy nearest; output_size fixes
      the output shape and each spatial input index is floor(o*isize/osize), or floor(o/scale) when that dimension's
      scale is given and the source index arithmetic is exact (IN.ATEN_SCALES). The forward returns the gathered
      tensor and the backward the complete input VJP for grad_output, both as the single output out.
    task_choice_required: false
    basis: [IN.ATEN, IN.ATEN_SCALES, IN.PHYSICAL]
    outputs: [out]
outputs:
  out:
    shape: '[N, C, requested output height, requested output width]; for the ATen profile the single returned tensor (forward output, or the input VJP of shape input_size for upsample_nearest2d_backward)'
    guarantee: exact
  grad:
    shape: complete input shape
    guarantee: exact
comparison:
  input_binding: Every public option, complete physical input and complete same-dtype upstream is explicit and validated.
  complete_output: Every output and input-gradient coordinate with dtype and shape; no partial tensor is accepted.
  quality: Exact coordinate selection and exact real addition; no tolerance in mathematical equality.
  test_evidence: Independent integer-coordinate loops and PyTorch 2.10 CPU comparisons over all selected dtypes and rectangular up/down sizes.
  error_handling: Malformed selected calls are invalid_input; other interpolation modes, scale-factor tasks and unsupported values are refused.
decisions:
- id: IN.SCHEMA
  status: reviewed
  statement: >-
    Select rank-4 torch.nn.functional.interpolate with explicit size, legacy mode='nearest', scale_factor=None,
    align_corners=None, recompute_scale_factor None or false and antialias=false. Size may be one positive integer,
    expanded to both spatial dimensions, or exactly two positive integers. The public call maps this task to
    upsample_nearest2d; nearest-exact, linear modes, area, one-/three-dimensional forms and out overloads are distinct.
  basis: [TORCH210_INTERPOLATE_FUNCTIONAL.PUBLIC_TASK, TORCH210_INTERPOLATE_FUNCTIONAL.OPTIONS,
    TORCH210_INTERPOLATE_FUNCTIONAL.DISPATCH, TS_NATIVE_FUNCTIONS.UPSAMPLE_SCHEMAS]
- id: IN.INDEX
  status: needs_binding
  statement: >-
    For this versioned PyTorch 2.10 legacy-nearest task with input H by W and output OH by OW, output (oh,ow)
    reads input (floor(oh*H/OH), floor(ow*W/OW)). This is the documented implementation choice matching OpenCV
    INTER_NEAREST. The half-pixel nearest-exact rule is a separate legal task and is not judged by this profile.
  basis: [TORCH210_INTERPOLATE_FUNCTIONAL.NEAREST_MODE, TORCH210_UPSAMPLE_DECOMP.INDEX,
    TORCH210_UPSAMPLE_DECOMP.SCOPE]
- id: IN.GRAD
  status: reviewed
  statement: >-
    The selected forward is a gather with fixed integer coordinates. Its ordinary input VJP sums the upstream of
    every output coordinate that reads each input coordinate, including repeated reads during upsampling; all other
    input coordinates receive zero. Input and upstream remain unchanged.
  basis: [IN.INDEX, TORCH210_UPSAMPLE_DECOMP.GATHER, TS_NATIVE_FUNCTIONS.UPSAMPLE_SCHEMAS]
- id: IN.ATEN
  status: drafted
  statement: >-
    The ATen overload upsample_nearest2d is the legacy nearest operator; the half-pixel convention is the separate
    operator _upsample_nearest_exact2d, so a call that claims upsample_nearest2d has already chosen the coordinate
    convention and no task choice remains for it (unlike the public interpolate profile, whose mode string and size
    or scale options are selected by the task). The output spatial shape is output_size (two positive integers). The
    backward is the VJP that PyTorch 2.10's derivative table assigns to the forward: grad_output must have shape
    input_size[0:2] + output_size and the forward's index rule is applied with input_size. The forward is a gather
    with fixed integer coordinates, so its VJP gives every input coordinate the sum of the grad_output coordinates
    that read it (repeated reads accumulate) and zero elsewhere. The .vec overload (optional output_size
    with a scale_factors list) and the out forms are different tasks and unsupported. This rests on the retained
    PyTorch 2.10 schema, derivative table and official decomposition together with the documented OpenCV
    INTER_NEAREST compatibility of legacy nearest; agreement is agreement with that reference semantics. The
    public interpolate profile keeps its IN.INDEX task binding; this decision does not change it.
  basis: [LPI_NATIVE_FUNCTIONS.UPSAMPLE_NEAREST2D, LPI_DERIVATIVES.UPSAMPLE_NEAREST2D, LPI_DECOMP.UPSAMPLE_NEAREST_SCALES,
    TORCH210_INTERPOLATE_FUNCTIONAL.NEAREST_MODE, TORCH210_UPSAMPLE_DECOMP.INDEX, TORCH210_UPSAMPLE_DECOMP.GATHER]
- id: IN.ATEN_SCALES
  status: drafted
  statement: >-
    How scales enter: the retained decomposition computes, per spatial dimension, scale = isize/(isize*s) when the
    scale argument s is given and isize/osize otherwise, and input_index = trunc(float32(o) * scale), i.e. floor for
    nonnegative values. Without s the profile uses the exact index floor(o*isize/osize), the same rule as the public
    profile's IN.INDEX. With s the
    exact index is floor(o/s), where s is the exact value of the received binary64 scale; output_size still fixes the
    shape and is not required to equal floor(isize*s). The exact reading is adopted only where it provably equals
    the source's floating evaluation: isize*s exactly representable in binary64, 1/s exactly representable in
    binary32, and o/s exactly representable in binary32 for every output index o. Otherwise the floating rounding of
    the index computation would decide the result, which this exact profile does not model: unsupported.
    Alternatives considered: (a) ignore the scales and always use isize/osize (contradicts the source, which uses s
    whenever it is given); (b) use floor(o/s) for every s (claims an exact rule where the source computes in floating
    point). An index that reaches isize is unsupported: the decomposition gathers with _unsafe_index and defines no
    value there (PyTorch 2.10 eager clamps or takes an output==2*input shortcut; neither is documented). Nonpositive
    or non-finite scales are unsupported. For the recorded call (10x8 to 20x16 with s=2.0) every condition holds and
    both readings give floor(o/2).
  basis: [LPI_DECOMP.UPSAMPLE_NEAREST_SCALES, LPI_NATIVE_FUNCTIONS.UPSAMPLE_NEAREST2D, TORCH210_UPSAMPLE_DECOMP.INDEX]
- id: IN.PHYSICAL
  status: reviewed
  statement: >-
    Input and upstream are positive rank-4 physical finite f16/bf16/f32/f64 tensors with values exactly representable
    in their declared dtype. Upstream has the same dtype and complete output shape. Special values, signed-zero
    distinctions and other dtypes are outside this exact-real reference range.
  basis: [TORCH210_INTERPOLATE_FUNCTIONAL.PUBLIC_TASK]
clauses:
- {id: IN.C1, basis: [IN.SCHEMA, IN.PHYSICAL], statement: Validate the complete public task and physical tensors before evaluating any coordinate., observes: [out, grad], evidence_kind: definition}
- {id: IN.C2, basis: [IN.INDEX], statement: Every output coordinate copies the input selected by the two legacy nearest floor indices., observes: [out], evidence_kind: definition}
- {id: IN.C3, basis: [IN.GRAD], statement: Every input-gradient coordinate is the sum of all upstream coordinates that selected it., observes: [grad], evidence_kind: derived}
- {id: IN.C4, basis: [IN.SCHEMA, IN.INDEX], statement: Other modes, scale-factor tasks and incomplete outputs cannot receive a value under this profile., observes: [out, grad], evidence_kind: definition}
- {id: IN.C5, basis: [IN.ATEN, IN.PHYSICAL], statement: 'The ATen forward validates the physical rank-4 input, two positive output sizes and optional scales, and returns every output coordinate of shape (N, C, output_size).', observes: [out], evidence_kind: definition}
- {id: IN.C6, basis: [IN.ATEN_SCALES], statement: 'Each ATen spatial index is floor(o*isize/osize) without a scale and floor(o/scale) with an exactly evaluable scale; inexact scale arithmetic and indices beyond the input are unsupported.', observes: [out], evidence_kind: definition}
- {id: IN.C7, basis: [IN.ATEN], statement: 'upsample_nearest2d_backward returns the complete input VJP of shape input_size, summing every grad_output coordinate into the input coordinate selected by the forward index rule.', observes: [out], evidence_kind: derived}
examples:
