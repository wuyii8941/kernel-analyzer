        out: [[3/5, 4/5], [0, 1], [3/5, 4/5]], dweight: [[0, 0], [2, 2]], dpsw: [], weight_after: [[3/5, 4/5], [0, 1]]}},
    note: the referenced padding row is renormalised too}
- {id: EM.E10, profile: renorm_doc, clauses: [EM.C7, EM.C8], input: {op: embedding_bag, padding_idx: null, max_norm: null,
