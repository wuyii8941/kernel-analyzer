signature:
  inputs:
  - 'op: embedding | embedding_bag'
  - 'weight [V][D]; indices (embedding: any rank; bag: 1-D with offsets or 2-D)'
  - padding_idx, max_norm, norm_type (1, 2, inf), scale_grad_by_freq
  - 'bag only: mode, offsets, per_sample_weights, include_last_offset'
  - 'upstream: shape of out'
  pre_state:
  - weight
  post_state:
  - weight_after
  observation_unit: out, the weight gradient, the per-sample-weight gradient and the weight after the call
domain:
  valid:
  - indices in [0, V)
  - padding_idx in [-V, V)
  - positive max_norm
  - rational weights
  domain_undefined:
  - mean or max of a non-empty bag holding only padding entries
  invalid_input:
  - indices out of range
  - padding_idx out of range
  - per_sample_weights with mode mean or max
  - scale_grad_by_freq with mode max
  - offsets[0] != 0 or decreasing offsets
  - shape mismatches
  unsupported:
  - norm_type other than 1
  - 2
  - inf
  - sparse gradients
mutation_requirements:
- {id: EM.M1, misreading: padding row receives gradient, witnesses: [EM.E2]}
- {id: EM.M2, misreading: padding entries return zeros in F.embedding (confusing nn.Embedding initialisation with the forward
      pass), witnesses: [EM.E2]}
- {id: EM.M3, misreading: scale_grad_by_freq ignored, witnesses: [EM.E4]}
- {id: EM.M4, misreading: renorm_doc computed with the 1e-7 of the ATen kernel, witnesses: [EM.E5]}
- {id: EM.M5, misreading: renorm_aten computed without the 1e-7, witnesses: [EM.E6]}
- {id: EM.M6, misreading: every row of the table renormalised, not only the referenced ones: null, witnesses: [EM.E5]}
- {id: EM.M7, misreading: gradient taken through the renormalisation, witnesses: [EM.E5]}
- {id: EM.M8, misreading: mean over a bag counts padding entries, witnesses: [EM.E16]}
- {id: EM.M9, misreading: mean of an empty bag treated as 0/0, witnesses: [EM.E14]}
- {id: EM.M10, misreading: per_sample_weights ignored, witnesses: [EM.E13]}
- {id: EM.M11, misreading: include_last_offset ignored (the last offset starts a bag), witnesses: [EM.E18]}
- {id: EM.M12, misreading: max-mode gradient split evenly between tied entries (the amax rule), witnesses: [EM.E12]}
- {id: EM.M13, misreading: renormalisation also applied when the norm equals max_norm, witnesses: [EM.E7]}
- {id: EM.M14, misreading: negative padding_idx not counted from the end, witnesses: [EM.E3]}
nonclaims:
- The renorm_aten profile states agreement with the ATen kernel, not a documented requirement.
- Rounding of the renormalisation factor and of accumulated gradients on a device is the numerical question (K - G).
