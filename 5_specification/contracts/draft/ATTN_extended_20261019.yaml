signature:
  inputs:
  - q [B][Hq][L][E] or [Hq][L][E]; k [.][Hkv][S][E]; v [.][Hkv][S][Ev]
  - 'dout: shape of out (required)'
  - 'attn_mask: null, all-boolean or all-numeric (with -inf / inf), broadcastable to (B, Hq, L, S)'
  - is_causal (bool), scale (null or rational), softcap (null, 0 or > 0), window (null or [left, right], lower_right profiles),
    enable_gqa (bool), dropout_p (0)
  pre_state: []
  post_state: []
  observation_unit: out, lse and the complete VJP of one attention call
domain:
  valid:
  - finite rational q
  - k
  - v
  - dout; Hkv divides Hq with enable_gqa; additive masks may hold -inf
  domain_undefined:
  - a row without any allowed key (profiles without _zero_rows)
  - +inf in an additive mask on an allowed key
  invalid_input:
  - attn_mask with is_causal
  - head counts outside AT.HEADS
  - shape mismatches
  - mixed boolean / numeric masks
  - negative softcap
  - window entries below -1
  unsupported:
  - dropout_p > 0
  - window in the sdpa profiles
  - score_mod / mask_mod other than softcap and boolean masks
  - ALiBi
  - attention sinks
mutation_requirements:
- {id: AT.M1, misreading: default scale 1/E instead of 1/sqrt(E), witnesses: [AT.E1]}
- {id: AT.M2, misreading: 'explicit scale replaced by the default 1/sqrt(E) (Inductor attention rewrite, bug B018 A)', witnesses: [
      AT.E2]}
- {id: AT.M3, misreading: boolean mask read as True = masked, witnesses: [AT.E3]}
- {id: AT.M4, misreading: additive mask read as a keep mask where the value equals 1 (bug B018 B), witnesses: [AT.E4]}
- {id: AT.M5, misreading: SDPA is_causal aligned to the bottom-right corner, witnesses: [AT.E6]}
- {id: AT.M6, misreading: FlashAttention causal aligned to the top-left corner, witnesses: [AT.E7]}
- {id: AT.M7, misreading: window measured from the query index without the S - L offset (the v1 specification error), witnesses: [
      AT.E14]}
- {id: AT.M8, misreading: GQA heads tiled (h % Hkv) instead of repeat_interleave, witnesses: [AT.E11]}
- {id: AT.M9, misreading: softcap applied to the unscaled dot product, witnesses: [AT.E13]}
- {id: AT.M10, misreading: 'a row without allowed key averages every key (finite fill value, bug B018 B)', witnesses: [AT.E16,
      AT.E17]}
- {id: AT.M11, misreading: causal mask excludes the diagonal (planted mask_diag of the flash attention case), witnesses: [
      AT.E6]}
- {id: AT.M12, misreading: backward computed with the causal mask while the forward is not causal (bug B011), witnesses: [
      AT.E19]}
- {id: AT.M13, misreading: dk / dv taken from one query head instead of summed over the GQA group, witnesses: [AT.E11]}
- {id: AT.M14, misreading: natural-log lse reported where the base-2 M is declared, witnesses: [AT.E18]}
- {id: AT.M15, misreading: attn_mask together with is_causal silently accepted, witnesses: [AT.E10]}
nonclaims:
- Floating-point rounding, block order of the online softmax and TF32 inputs of a kernel are the numerical question (K -
  G); this contract states the real target.
- Whatever a device returns for rows without an allowed key is not judged in the profiles without _zero_rows.
- A kernel that masks with a large finite negative bias (e.g. -1.0e6 in the Triton tutorial) instead of -inf differs from
  this target by terms of order exp(-bias); that difference belongs to the program's own semantics (G), not to f.
- Clauses resting only on reference programs (zero-row convention, softcap order, base-2 M) state agreement with those programs,
  not a documented requirement of PyTorch.

