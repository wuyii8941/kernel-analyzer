signature:
  inputs: ['real: one selected default functional op with args/kwargs (Python scalars as received)', 'masked_fill autograd: public op, complete input, Boolean mask, Python scalar value and complete upstream', 'where autograd: public op, complete Boolean condition, two complete data tensors and complete upstream', 'clamp autograd: public op, complete input, optional scalar bounds and complete upstream', 'extrema autograd: public maximum or minimum, two complete data tensors and complete upstream']
  pre_state: [all inputs are unchanged]
  post_state: [the complete output tensor; masked_fill and clamp autograd also return an input VJP; where and extrema autograd return both data VJPs]
  observation_unit: every declared output coordinate together with dtype and shape
domain:
  valid: ['real: exactly representable f16/bf16/f32/f64 values including +-inf; same data dtype; documented broadcasting; Python scalars received as binary64 values or integers from -2^63 to 2^64-1; pow with an integral scalar exponent |n| <= 64; integer tensors (int64/int32/int16/int8/uint8) for add, sub, rsub, mul, neg, abs, sign, maximum, minimum, clamp, clamp_min, clamp_max, where, masked_fill',
    'autograd profiles: exactly representable finite floating values, representable finite scalars and complete same-dtype upstream']
  domain_undefined: [zero divisor in div or floor_divide; zero input to reciprocal; inf - inf; 0 * inf; inf / inf; zero base with a negative integral exponent; integer result outside the result dtype range]
  invalid_input: [NaN; value not representable in its declared tensor dtype; non-integer or out-of-range integer tensor value; non-integer scalar that is not a binary64 value; malformed call; nonboolean condition or mask; clamp without a bound]
  unsupported: [boolean data, float8 or complex data; boolean scalars and integer scalars outside -2^63 .. 2^64-1; floor division or floor_divide with an infinite operand (AR.FLOOR_INFINITE); mixed data dtypes, including a floating scalar or alpha with an integer tensor; non-integral, infinite or |n| > 64 pow exponents, tensor exponents, scalar bases and integer pow; div, floor_divide, reciprocal, floor, ceil and fma on integers; infinite values in the autograd profiles; tensor clamp bounds; fma broadcasting; out or in-place variants; device, layout or aliasing effects]
mutation_requirements:
- {id: AR.M1, misreading: alpha is ignored in add and sub, witnesses: [AR.E1, AR.E3]}
- {id: AR.M2, misreading: rsub does not reverse its operands, witnesses: [AR.E4]}
- {id: AR.M3, misreading: floor division truncates toward zero, witnesses: [AR.E8]}
- {id: AR.M4, misreading: reciprocal returns the input, witnesses: [AR.E11]}
- {id: AR.M5, misreading: sign of zero is one, witnesses: [AR.E15]}
- {id: AR.M6, misreading: fma omits its addend, witnesses: [AR.E16]}
- {id: AR.M7, misreading: floor is implemented as ceil, witnesses: [AR.E17]}
- {id: AR.M8, misreading: clamp with min greater than max returns min, witnesses: [AR.E20]}
- {id: AR.M9, misreading: maximum and minimum are exchanged, witnesses: [AR.E23, AR.E24]}
- {id: AR.M10, misreading: where selects the opposite branch, witnesses: [AR.E25]}
- {id: AR.M11, misreading: masked_fill fills where the mask is false, witnesses: [AR.E26]}
- {id: AR.M12, misreading: the finite profile accepts arbitrary rationals labelled as f16, witnesses: [AR.E27]}
- {id: AR.M13, misreading: public masked_fill selects the fill value where the mask is false, witnesses: [AR.E35]}
- {id: AR.M14, misreading: masked output coordinates pass upstream gradient to the input, witnesses: [AR.E35]}
- {id: AR.M15, misreading: a broadcast input gradient is not summed back to the input shape, witnesses: [AR.E35]}
- {id: AR.M16, misreading: the complete input gradient may be omitted, witnesses: [AR.E35]}
- {id: AR.M17, misreading: public where exchanges its true and false data branches and their gradients, witnesses: [AR.E40]}
- {id: AR.M18, misreading: a broadcast where input gradient is not summed back to the input shape, witnesses: [AR.E40]}
- {id: AR.M19, misreading: both where data gradients use the true-condition branch, witnesses: [AR.E40]}
- {id: AR.M20, misreading: the complete other gradient may be omitted, witnesses: [AR.E40]}
- {id: AR.M21, misreading: clamp gives zero input gradient exactly at min and max, witnesses: [AR.E45]}
- {id: AR.M22, misreading: the clamp input VJP ignores the upper bound, witnesses: [AR.E45]}
- {id: AR.M23, misreading: clamp returns min when min exceeds max, witnesses: [AR.E48]}
- {id: AR.M24, misreading: the complete clamp input gradient may be omitted, witnesses: [AR.E45]}
- {id: AR.M25, misreading: equality upstream in maximum or minimum belongs entirely to the first operand, witnesses: [AR.E52, AR.E55]}
- {id: AR.M26, misreading: maximum and minimum exchange their forward and strict-gradient branches, witnesses: [AR.E52, AR.E53]}
- {id: AR.M27, misreading: an extrema input gradient is not summed back over broadcast axes, witnesses: [AR.E52]}
- {id: AR.M28, misreading: the complete other gradient may be omitted from extrema, witnesses: [AR.E52]}
- {id: AR.M29, misreading: a Python scalar is rounded to the tensor dtype (bf16 0.044715 becomes 183/4096) before the exact formula, witnesses: [AR.E59, AR.E63]}
- {id: AR.M30, misreading: a Python scalar is rounded to the float32 computation type before the exact formula, witnesses: [AR.E59]}
- {id: AR.M31, misreading: a float-typed integral exponent such as 3.0 is the principal power exp(y log x), so negative bases become undefined, witnesses: [AR.E66]}
- {id: AR.M32, misreading: a non-integral exponent is truncated and evaluated as an integer power, witnesses: [AR.E70]}
- {id: AR.M33, misreading: 0 ** 0 is 0, witnesses: [AR.E68]}
- {id: AR.M34, misreading: an infinite operand makes a sum undefined even when the other operand is finite, witnesses: [AR.E76]}
- {id: AR.M35, misreading: opposite infinities add to zero, witnesses: [AR.E77]}
- {id: AR.M36, misreading: a selected infinite value is replaced by the largest finite value of the dtype, witnesses: [AR.E87, AR.E88]}
- {id: AR.M37, misreading: integer results wrap modulo 2^bits instead of having no task value, witnesses: [AR.E92, AR.E93]}
- {id: AR.M38, misreading: integer data is converted to float32 before the arithmetic, witnesses: [AR.E91]}
nonclaims:
- Floating operation rounding, output storage rounding and device instruction choice are numerical effects in K-G.
- Mixed dtype promotion, integer division and integer pow, non-integral pow, complex values, NaN behavior, signed zero, the IEEE NaN results at undefined points, gradients other than the selected masked_fill, where, scalar-bound clamp and Tensor/Tensor extrema VJPs, in-place and out variants are not certified here.
- The diagnostic scalar readings explain a kernel's internal scalar conversion; matching one of them is not task conformance.
- Integer overflow has no task value (AR.INT_OVERFLOW); a wrapped device result is neither confirmed nor refuted.
changes:
- date: '2026-10-21'
  change: >-
    Review A2 package D fixes: floor division with an infinite operand is unsupported (new AR.FLOOR_INFINITE, examples
    AR.E105-E107); boolean scalars and integers outside [-2^63, 2^64) are unsupported and Python ints in [2^63, 2^64)
    take their exact uint64 value (AR.E108-E109); AR.SCALAR_VALUE cites T_TENSOR_ATTR.SCALAR_DTYPE, rejects the
    default-dtype reading (d) and states that eager follows the op-math reading.
  trigger: Independent review reviews/2026-10-20/A2_package_D_review.md issues A1-A3.
- date: '2026-10-20'
  change: >-
    Extend the real profile: Python scalars are the exact received binary64/int64 values (AR.SCALAR_VALUE, with the
    dtype- and opmath-rounded readings as diagnostics); +-inf with extended-real results (AR.EXTENDED_REAL); torch.pow
    with an integral scalar exponent including 0**0 = 1 and negative bases (AR.POW, AR.ZERO_POW; aten.pow added to
    covers); an integer subset with overflow undefined (AR.INTEGER, AR.INT_OVERFLOW). AR.E28 and AR.E29 change from
    unsupported to values. Review and implementation status reset to drafted / pending.
  trigger: >-
    Path A closure (PATH_A_CLOSURE_PLAN G7): recorded calls mul/add with Python floats not representable in the tensor
    dtype, pow.Tensor_Scalar with exponents 1.0/2/2.0/3/3.0, an additive -inf attention mask, where.self with -inf
    scalar-tensor branches and int64 position-id addition were refused by the finite profile.
- date: '2026-10-19'
  change: >-
    Add a PyTorch 2.10 public Tensor/Tensor maximum/minimum profile with complete forward and both broadcast VJPs,
    including the official equal-value half split.
  trigger: >-
    A real FlagGems public-call audit found that the existing real profile covered extrema forward values but could
    not judge a training call or the versioned PyTorch choice at equal operands.
- date: '2026-10-19'
  change: >-
    Add a PyTorch 2.10 public scalar-bound clamp profile with complete forward and input VJP, explicitly preserving
    PyTorch's inclusive boundary subgradient and the min-greater-than-max rule.
  trigger: >-
    A real common-operator audit found that the existing real profile covered clamp forward values but could not
    judge a training call or distinguish the selected PyTorch boundary gradient from other legal mathematical choices.
- date: '2026-10-19'
  change: >-
    Add a PyTorch 2.10 public Tensor/Tensor where profile with complete forward and both data VJPs, including separate
    gradient reduction for independently broadcast input and other tensors.
  trigger: >-
    A real common-operator audit found that the existing real profile covered only the where forward selection and
    could not judge a training call, branch-specific gradient routing or either data tensor's broadcast reduction.
- date: '2026-10-19'
  change: >-
    Add a PyTorch 2.10 public scalar masked_fill profile with complete forward and input VJP, including input expansion
    under ordinary broadcasting and gradient reduction back to the input shape.
  trigger: >-
    A real common-operator audit found that the existing real profile covered only an aten-style forward value and
    could not judge a training call or implementations that incorrectly restrict which operand may broadcast.
- date: '2026-10-18'
  change: >-
    Replace the active all-arithmetic draft with a finite same-dtype floating profile for twenty common pointwise
    operations, complete output checking and physical input representability. Preserve the former broad contract under contracts/draft.
  trigger: >-
    The former profile treated integer arithmetic as unbounded exact arithmetic, admitted arbitrary rationals under
    floating dtype labels, mixed unresolved pow and infinity choices with routine arithmetic, and had no complete output checker.
