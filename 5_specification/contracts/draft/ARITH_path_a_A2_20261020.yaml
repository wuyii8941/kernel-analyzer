schema_version: '1.2'
id: ARITH
role: ATEN_ARITH
title: Common element-wise arithmetic (floating with infinities, integer subset, integral pow) and selected PyTorch 2.10 autograd tasks
review:
  status: drafted
  author: Claude (original broad draft), Codex (finite common-operation revision, 2026-10-18), Claude (path A domain extension, 2026-10-20)
  date: '2026-10-18'
  reviewer: Codex source, formula, domain and complete-output review with separate exact-rational tests
  scope: Same-dtype f16/bf16/f32/f64 default functional operations (2026-10-20 draft adds infinities, exact received scalars, integral pow and an integer subset to the real profile, pending review); scalar masked_fill, Tensor/Tensor where, scalar-bound clamp and Tensor/Tensor maximum/minimum additionally have complete public-call forward and VJP profiles
activation:
  implementation_status: pending
  implementation_evidence: evidence/arith_implementation.md (finite scope); evidence/arith_mathfn_index_domains.md (2026-10-20 extension)
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, reviewed_contract_and_adapter_match_current]
covers: [aten.add, aten.sub, aten.rsub, aten.mul, aten.div, aten.neg, aten.reciprocal, aten.abs, aten.sign,
  aten.pow, prims.fma, aten.floor, aten.ceil, aten.clamp, aten.clamp_min, aten.clamp_max, aten.maximum, aten.minimum,
  aten.where, aten.masked_fill, aten.floor_divide, torch.Tensor.masked_fill, torch.where, torch.clamp,
  torch.maximum, torch.minimum]
profiles:
  real:
    meaning: >-
      Exact extended-real formulas for common default functional operations on dense f16, bf16, f32 or f64 values,
      including +inf and -inf where the extended-real result is defined (AR.EXTENDED_REAL), and exact integer formulas
      for a subset of operations on same-dtype integer tensors (AR.INTEGER, AR.INT_OVERFLOW). Every tensor value must
      be exactly representable in its declared source dtype; NaN is refused. All data tensors in one call have the
      same dtype. A Python scalar operand, alpha, bound or fill value is the exact value the call received
      (AR.SCALAR_VALUE), not that value rounded to the tensor dtype. pow takes an integral scalar exponent (AR.POW,
      AR.ZERO_POW). Operation rounding and output storage rounding belong to K-G, not to this task value.
    task_choice_required: false
    basis: [AR.SCHEMA, AR.FINITE, AR.SCALAR_VALUE, AR.EXTENDED_REAL, AR.POW, AR.INTEGER, AR.INT_OVERFLOW]
    outputs: [out]
  torch210_masked_fill_scalar_autograd:
    meaning: >-
      PyTorch 2.10 out-of-place Tensor.masked_fill using the Scalar overload, with complete physical finite floating
      input, complete Boolean mask, a finite exactly representable Python scalar and complete same-dtype upstream.
      Input and mask use ordinary broadcasting, so the public output may be larger than the input. Return the complete
      public output and the complete input VJP after summing gradient contributions over broadcast input axes.
    task_choice_required: false
    basis: [AR.MASKED_FILL_TASK, AR.MASKED_FILL_VJP]
    outputs: [out, grad]
  torch210_where_tensor_autograd:
    meaning: >-
      PyTorch 2.10 public torch.where(condition,input,other) using the Tensor/Tensor overload, with a complete Boolean
      condition, complete same-dtype physical finite floating data tensors and complete same-dtype upstream. All four
      tensors use ordinary broadcasting. Return the complete public output and complete VJPs for both data tensors,
      summing contributions over each data tensor's broadcast axes.
    task_choice_required: false
    basis: [AR.WHERE_TASK, AR.WHERE_VJP]
    outputs: [out, grad_input, grad_other]
  torch210_clamp_scalar_autograd:
    meaning: >-
      PyTorch 2.10 public functional torch.clamp using optional Python scalar min and max bounds, at least one present,
      a complete physical finite floating input and complete same-dtype upstream. Return the complete output and input
      VJP. The selected PyTorch subgradient passes upstream at coordinates exactly equal to either active boundary;
      when min exceeds max the output is max and the complete input VJP is zero.
    task_choice_required: false
    basis: [AR.CLAMP_TASK, AR.CLAMP_VJP]
    outputs: [out, grad]
  torch210_extrema_tensor_autograd:
    meaning: >-
      PyTorch 2.10 public functional torch.maximum or torch.minimum using the Tensor/Tensor overload, with two
      complete same-dtype physical finite floating tensors and complete same-dtype upstream on their broadcast
      output. Return the complete output and both complete input VJPs. At equal input values PyTorch's selected
      autograd rule gives half of upstream to each operand; each broadcast gradient is then summed to its source shape.
    task_choice_required: false
    basis: [AR.EXTREMA_TASK, AR.EXTREMA_VJP]
    outputs: [out, grad_input, grad_other]
readings:
  scalar_rounded_to_dtype:
    meaning: >-
      Diagnostic reading of AR.SCALAR_VALUE alternative (b) for the real profile on floating tensors: every Python
      scalar operand, alpha, bound or fill value is first rounded to nearest even in the tensor dtype. The pow
      exponent is not rounded. Not the task.
    basis: [AR.SCALAR_VALUE]
  scalar_rounded_to_opmath:
    meaning: >-
      Diagnostic reading of AR.SCALAR_VALUE alternative (c): scalars are first rounded to nearest even in the internal
      computation type (float32 for bf16/f16 tensors, the tensor dtype for f32/f64). The pow exponent is not rounded.
      Not the task.
    basis: [AR.SCALAR_VALUE]
outputs:
  out: {shape: 'complete broadcast output shape; prims.fma requires three equal shapes', guarantee: exact}
  grad: {shape: 'complete selected masked_fill or clamp input shape', guarantee: exact}
  grad_input: {shape: 'complete selected where or extrema input shape', guarantee: exact}
  grad_other: {shape: 'complete selected where or extrema other shape', guarantee: exact}
comparison:
  input_binding: >-
    Tensor records are physical source values, not arbitrary mathematical reals labelled with a dtype. In the real
    profile a Python scalar is the exact rational value received (a binary64 number or an int64 integer,
    CONTRACT_PROTOCOL 4.1); in the autograd profiles it must be exactly representable in the data dtype. Boolean
    condition and mask tensors are accepted only by where and masked_fill. Clamp bounds are optional Python scalars,
    not tensors. The autograd profiles require explicit shape records for every tensor and upstream. Inputs and
    outputs are otherwise dense.
  complete_output: >-
    check_output requires exactly the fields declared by the selected profile. Every tensor has t, v and shape.
    It checks result dtype, every complete broadcast or input shape and every coordinate, including empty tensors.
  equality: Exact rational equality with no tolerance.
  test_evidence: Separate Fraction-based broadcasting and scalar formulas, plus PyTorch 2.10 dtype/shape cross-checks.
  error_handling: >-
    Division or reciprocal by zero, opposite infinities in a sum, zero times infinity, infinity divided by infinity,
    zero to a negative power and integer results outside the result dtype are domain_undefined; NaN and malformed
    calls are invalid_input; unreviewed variants are unsupported.
decisions:
- id: AR.SCHEMA
  status: reviewed
  statement: >-
    The selected interfaces are the PyTorch 2.10 default functional tensor/scalar overloads named by covers.
    add/sub/rsub use alpha; div optionally uses keyword-only rounding_mode; clamp uses scalar bounds; masked_fill
    uses its scalar-value overload. Except for where's scalar branch overloads, the first data argument is a tensor;
    where must still have at least one tensor branch to determine the reviewed dtype. In-place, out, tensor-bound clamp,
    one-argument where and other overloads are outside this profile. prims.fma is the retained Inductor primitive and
    requires three same-dtype, same-shape tensors here. The 2026-10-20 draft adds torch.pow with a floating tensor
    base and a scalar exponent (aten.pow.Tensor_Scalar); the scalar-base and tensor-exponent forms stay outside.
  basis: [TS_NATIVE_FUNCTIONS.ARITH_SCHEMAS, TS_INDUCTOR_PRIMS.FMA, TS_REFS.RSUB, T_POW.DEF]
- id: AR.FINITE
  status: drafted
  statement: >-
    Support boundary. Tensor values are exactly representable in the declared dtype; all data tensors in a call
    share one dtype, so the documented promotion keeps that dtype for the result. The real profile accepts
    f16/bf16/f32/f64 values including +-inf (AR.EXTENDED_REAL) and, for the operations listed in AR.INTEGER, integer
    dtypes; NaN is not a real value and is invalid. The four autograd profiles keep the reviewed finite floating
    scope with scalars exactly representable in the data dtype. This is a support boundary, not a claim that PyTorch
    lacks other variants (mixed dtypes, booleans, complex and float8 stay unsupported).
  basis: [T_TENSOR_ATTR.PROMOTION, TS_NATIVE_FUNCTIONS.ARITH_SCHEMAS]
- id: AR.SCALAR_VALUE
  status: drafted
  statement: >-
    What a Python scalar operand (also alpha, clamp bounds and fill values) means in the real-profile task. The
    PyTorch 2.10 Tensor Attributes page says that for type promotion "a floating point scalar operand has dtype
    torch.get_default_dtype() and an integral non-boolean scalar operand has dtype torch.int64", that values are not
    inspected to choose dtypes, and that a same-category scalar does not change the result dtype; torch.add and
    torch.mul only state out = input + alpha*other and out = input*other with type promotion. Alternatives: (a) the
    exact value received by the call, i.e. the binary64 value of a Python float or the exact value of a Python int
    that an ATen Scalar carries (int64, or uint64 for [2^63, 2^64)) (CONTRACT_PROTOCOL 4.1); (b) that value rounded to
    nearest even in the tensor dtype (so 0.044715 with a bf16 tensor means 183/4096); (c) that value rounded to the
    operator's internal computation type (float32 for bf16/f16 tensors, the dtype itself for f32/f64); (d) the value
    rounded to the default dtype float32, suggested by the Tensor Attributes sentence (identical to (c) for
    bf16/f16/f32 tensors, different for f64 tensors). Choice: (a). (d) is rejected because that sentence assigns a
    dtype category for the promotion algorithm only (it decides the result dtype, and the same page says values are
    not inspected); it does not say the operand's value is converted, and (d) would round a scalar used with an f64
    tensor below f64 precision. (b) and (c) are numerical choices of a particular kernel and belong to K-G; they are
    recorded as the diagnostic readings scalar_rounded_to_dtype and scalar_rounded_to_opmath, never as the task.
    Plain consequence: PyTorch 2.10 eager itself follows reading (c) (it converts the scalar to float32 before the
    operation), so on the recorded f32 calls (x 0.044715, x 0.7978845608028654, x 0.3535533905932738, + 1e-06)
    eager deviates from RN(f) by up to about 1 ulp on a large share of coordinates (evidence
    arith_mathfn_index_domains.md section 3); under this choice that deviation is a K-G effect of the scalar
    conversion, which the readings identify, not a different task. Further consequences: a rational that no ATen
    Scalar can carry (neither binary64 nor an integer, e.g. 1/3) is invalid_input; boolean scalars and integers
    outside [-2^63, 2^64), which are legal Python values but not admitted here, are unsupported; for selection
    operations (where, masked_fill, clamp) the readings coincide after output rounding because rounding is monotone
    and the other operands are representable. The pow exponent is read exactly in every reading.
  basis: [T_TENSOR_ATTR.PROMOTION, T_TENSOR_ATTR.SCALAR_DTYPE, T_ADD.DEF, T_MUL.DEF]
- id: AR.EXTENDED_REAL
  status: drafted
  statement: >-
    The real profile admits +inf and -inf in floating tensors and scalars. A result is the extended-real value where
    the operation has one: finite + inf = inf, finite * inf = +-inf by sign, finite / inf = 0, reciprocal of +-inf is
    0, abs, sign, neg, floor, ceil, maximum, minimum and clamp order the extended reals, and where / masked_fill pass
    an infinite selected value through unchanged. inf + (-inf) (including through sub and alpha), 0 * inf, inf / inf
    and x / 0 have no extended-real value and are domain_undefined; this contract does not demand the NaN that
    IEEE 754 delivers there. There is no signed zero: -1 / inf is the real 0. NaN is invalid_input.
  basis: [IEEE754.INF_ARITH, IEEE754.INVALID, T_ADD.DEF, T_MUL.DEF, T_DIV.TRUE, T_WHERE.DEF]
- id: AR.POW
  status: drafted
  statement: >-
    torch.pow with a scalar exponent is out_i = x_i ** exponent. The exponent is the exact value received; when it
    is an integer n (a Python int, or a float such as 3.0 whose exact value is an integer) the task value is the exact
    integer power, defined for every real base including negative bases (x**3 of -2 is -8; the float type of 3.0 does
    not turn it into the principal power exp(y log x)). n < 0 is 1 / x**|n|; a zero base with n < 0 is
    domain_undefined; +-inf bases follow AR.EXTENDED_REAL (inf**n = inf or 0, (-inf)**n by the parity of n). A
    non-integral exponent has a transcendental value outside this exact-output profile and is unsupported (a negative
    base would additionally have no real value); so are |n| > 64 (an exact evaluation size bound), tensor exponents,
    scalar bases and integer tensors.
  basis: [T_POW.DEF, AR.EXTENDED_REAL]
- id: AR.ZERO_POW
  status: drafted
  statement: >-
    x ** 0 = 1 for every admitted x, including 0 ** 0 and (+-inf) ** 0. torch.pow's page does not state the case;
    IEEE 754 pow(x, +-0) = 1 for any x and the empty-product convention agree. Alternative (0 ** 0 undefined) rejected
    because both sources give 1.
  basis: [IEEE754.POW0, T_POW.DEF]
- id: AR.INTEGER
  status: drafted
  statement: >-
    The real profile admits same-dtype integer tensors (int64, int32, int16, int8, uint8) for add, sub, rsub, mul,
    neg, abs, sign, maximum, minimum, clamp, clamp_min, clamp_max, where and masked_fill. The values are literal
    integers in the dtype range and the task value is exact integer arithmetic; the result keeps the tensor dtype
    (a same-category Python int does not promote). An integer scalar or alpha enters exactly as the int64 value
    received; the documentation does not say that one outside the tensor dtype is an error (PyTorch 2.10 eager accepts
    int8 + 1000), so only the exact result is tested against the dtype range (AR.INT_OVERFLOW). A Python float scalar or alpha would promote the result to the default floating
    dtype and is outside this same-dtype profile (unsupported). div, floor_divide, reciprocal, floor, ceil, pow and
    fma on integer tensors are unsupported.
  basis: [T_TENSOR_ATTR.PROMOTION, T_ADD.DEF, T_SUB.DEF, T_MUL.DEF]
- id: AR.INT_OVERFLOW
  status: drafted
  statement: >-
    The PyTorch 2.10 pages fix the result dtype of integer arithmetic but say nothing about results outside its range.
    Alternatives: (a) two's-complement wraparound modulo 2^bits (what common CPU/GPU kernels do in practice); (b) no
    task value, domain_undefined; (c) unsupported. Choice: (b). The documentation gives no rule, signed overflow is
    undefined behaviour in the C++ the kernels are written in, and a wraparound answer would be an observed
    implementation behaviour rather than the operator's stated semantics. Consequence: when the exact integer result
    of a coordinate lies outside the result dtype, the call is domain_undefined and the device value is not judged;
    results inside the range are exact. This applies also to selection (where, masked_fill, clamp) when an exact int64
    scalar outside the tensor dtype would be selected.
  basis: [T_TENSOR_ATTR.PROMOTION, T_ADD.DEF]
- id: AR.REAL
  status: reviewed
  statement: >-
    The task value is the exact real formula stated by the public operation. Floating operation rounding and output
    conversion are measured separately in K-G. The result tensor keeps the common data dtype and has the documented broadcast shape.
  basis: [T_ADD.DEF, T_SUB.DEF, T_MUL.DEF, T_DIV.TRUE, T_TENSOR_ATTR.PROMOTION]
- id: AR.DIVISION
  status: reviewed
  statement: >-
    div with no rounding mode is exact real division; trunc rounds the real quotient toward zero; floor and
    floor_divide round it toward negative infinity. A zero divisor and reciprocal of zero have no real task value.
  basis: [T_DIV.TRUE, T_DIV.TRUNC, T_DIV.FLOOR, T_FLOOR_DIVIDE.DEF, T_RECIP.DEF]
- id: AR.FLOOR_INFINITE
  status: drafted
  statement: >-
    Floor division (div with rounding_mode floor, and floor_divide) with an infinite operand. The torch.div page
    defines floor mode as rounding the quotient down, "equivalent to floor division in Python (the // operator) and
    NumPy's np.floor_divide", which give inf // 2 = nan and -1 // inf = -1 (PyTorch 2.10 eager agrees on CPU and
    CUDA). The torch.floor_divide page gives floor(input / other), whose extended-real reading gives floor(inf/2) = inf
    and floor(-1/inf) = 0. Alternatives: (a) the extended-real floor of the quotient; (b) the Python // /
    np.floor_divide convention; (c) leave these cases outside the profile. Choice: (c), for both operations: the two
    retained pages disagree on exactly these inputs and neither reading is selected by the documentation, so the
    profile gives no answer (unsupported) instead of choosing for an implementation. A zero divisor has no value under
    either reading and stays domain_undefined (AR.DIVISION) even with an infinite dividend. Finite operands are unaffected,
    and trunc mode and true division with infinities follow AR.EXTENDED_REAL.
  basis: [T_DIV.FLOOR, T_FLOOR_DIVIDE.DEF, AR.EXTENDED_REAL]
- id: AR.SELECTION
  status: reviewed
  statement: >-
    where selects the first data operand at true condition coordinates and the second otherwise. masked_fill selects
    its scalar value at true mask coordinates. Conditions and masks must be boolean and broadcast to the data shape.
  basis: [T_WHERE.DEF, T_MASKED_FILL.DEF, TS_REFS.MASKED_FILL]
- id: AR.MASKED_FILL_TASK
  status: reviewed
  statement: >-
    Select PyTorch 2.10 public out-of-place Tensor.masked_fill with a Python scalar value. The native schema separates
    this functional Scalar overload from Tensor, out and in-place overloads. The official reference converts the
    scalar to the input dtype, computes where(mask,value,input) under ordinary broadcasting and returns a new
    contiguous tensor. This profile checks all returned values and unchanged input state; physical output stride and
    aliasing remain runtime binding conditions rather than inferred numerical fields.
  basis: [T_MASKED_FILL.DEF, TS_NATIVE_FUNCTIONS.ARITH_SCHEMAS, TS_REFS.MASKED_FILL]
- id: AR.MASKED_FILL_VJP
  status: reviewed
  statement: >-
    For complete upstream U on the broadcast output, the derivative with respect to the input is zero where the
    broadcast mask is true and U where it is false, summed back over every axis on which the input was broadcast.
    This follows coordinate by coordinate from AR.MASKED_FILL_TASK. Boolean mask and Python scalar have no requested
    gradient in this selected task.
  basis: [AR.MASKED_FILL_TASK]
- id: AR.WHERE_TASK
  status: reviewed
  statement: >-
    Select PyTorch 2.10 public torch.where(condition,input,other) with the Tensor/Tensor native overload. Condition
    is Boolean; input and other are physical same-dtype finite floating tensors. The official definition broadcasts
    all three tensors and selects input at true coordinates and other at false coordinates. Scalar, out and
    one-argument overloads are different tasks and remain outside this profile.
  basis: [T_WHERE.DEF, TS_NATIVE_FUNCTIONS.ARITH_SCHEMAS]
- id: AR.WHERE_VJP
  status: reviewed
  statement: >-
    For complete upstream U, input receives U exactly at true broadcast condition coordinates and zero elsewhere;
    other receives U exactly at false coordinates and zero elsewhere. Each result is summed back over the axes on
    which that data tensor was broadcast. This is the coordinate-wise transpose of AR.WHERE_TASK; condition has no
    requested gradient.
  basis: [AR.WHERE_TASK]
- id: AR.CLAMP_TASK
  status: reviewed
  statement: >-
    Select PyTorch 2.10 public functional torch.clamp with the Scalar native overload, no out tensor and at least one
    finite exactly representable bound. The output is min(max(input,min),max), omitting either absent side. If both
    bounds exist and min is greater than max, every output coordinate is max. Tensor bounds, clamp_min/clamp_max as
    separately named public calls, in-place and out overloads are different tasks.
  basis: [T_CLAMP.DEF, T_CLAMP.MINMAX, TS_NATIVE_FUNCTIONS.ARITH_SCHEMAS]
- id: AR.CLAMP_VJP
  status: reviewed
  statement: >-
    PyTorch 2.10 explicitly chooses input subgradient one at coordinates equal to min or max. Thus the complete input
    VJP is upstream where input is greater than or equal to an existing min and less than or equal to an existing max,
    and zero elsewhere. If min exceeds max no coordinate satisfies both comparisons. Scalar bounds have no requested
    gradient in this selected task.
  basis: [AR.CLAMP_TASK, TS_AUTOGRAD_DERIVATIVES.CLAMP]
- id: AR.EXTREMA_TASK
  status: reviewed
  statement: >-
    Select PyTorch 2.10 public functional torch.maximum or torch.minimum with the Tensor/Tensor native overload.
    Both operands are complete same-dtype finite floating tensors using ordinary broadcasting. Out, scalar,
    reduction, fmax/fmin and special-value variants are different tasks and remain outside this profile.
  basis: [T_MAXIMUM.DEF, T_MINIMUM.DEF, TS_NATIVE_FUNCTIONS.ARITH_SCHEMAS]
- id: AR.EXTREMA_VJP
  status: reviewed
  statement: >-
    For maximum, a strict larger operand receives the full upstream; for minimum, a strict smaller operand receives
    it. At equality PyTorch 2.10 explicitly gives half to each operand. Each broadcast-coordinate contribution is
    summed back to the corresponding source shape. This is the selected versioned public autograd task.
  basis: [AR.EXTREMA_TASK, TS_AUTOGRAD_DERIVATIVES.EXTREMA]
clauses:
- {id: AR.C1, basis: [T_ADD.DEF, T_SUB.DEF, TS_REFS.RSUB, T_MUL.DEF, AR.REAL], statement: 'add(a,b,alpha)=a+alpha*b; sub(a,b,alpha)=a-alpha*b; rsub(a,b,alpha)=b-alpha*a; mul(a,b)=a*b, with broadcasting', observes: [out], evidence_kind: definition}
- {id: AR.C2, basis: [AR.DIVISION], statement: 'true, truncating and floor division use the selected real quotient rule; reciprocal is one divided by the input', observes: [out], evidence_kind: definition}
- {id: AR.C3, basis: [T_NEG.DEF, T_ABS.DEF, T_SIGN.DEF], statement: 'neg=-x; abs=|x|; sign is -1, 0 or 1 according to x', observes: [out], evidence_kind: definition}
- {id: AR.C4, basis: [TS_INDUCTOR_PRIMS.FMA], statement: 'prims.fma(a,b,c)=a*b+c without rounding after multiplication in the task formula', observes: [out], evidence_kind: definition}
- {id: AR.C5, basis: [T_FLOOR.DEF, T_CEIL.DEF], statement: 'floor rounds toward negative infinity and ceil toward positive infinity', observes: [out], evidence_kind: definition}
- {id: AR.C6, basis: [T_CLAMP.DEF, T_CLAMP.MINMAX], statement: 'clamp applies the lower then upper scalar bound; if min exceeds max every result is max; clamp_min and clamp_max apply one bound', observes: [out], evidence_kind: definition}
- {id: AR.C7, basis: [T_MAXIMUM.DEF, T_MINIMUM.DEF], statement: 'maximum and minimum select the element-wise larger and smaller finite values', observes: [out], evidence_kind: definition}
- {id: AR.C8, basis: [AR.SELECTION], statement: 'where and masked_fill use the complete boolean condition or mask after broadcasting', observes: [out], evidence_kind: definition}
- {id: AR.C9, basis: [AR.SCHEMA, AR.FINITE], statement: 'only the selected same-dtype default functional calls inside the declared support boundary and their complete output are admitted', observes: [out], evidence_kind: definition}
- {id: AR.C10, basis: [AR.MASKED_FILL_TASK], statement: 'the public scalar masked_fill output is where(mask,value,input) on the complete broadcast shape and the functional call leaves input, mask and upstream unchanged', observes: [out, grad], evidence_kind: definition}
- {id: AR.C11, basis: [AR.MASKED_FILL_VJP], statement: 'the complete input VJP sums upstream values from unmasked broadcast output coordinates back to each input coordinate; masked coordinates contribute zero', observes: [out, grad], evidence_kind: derived}
- {id: AR.C12, basis: [AR.WHERE_TASK], statement: 'public Tensor/Tensor where returns the complete three-way broadcast selection and leaves condition, input, other and upstream unchanged', observes: [out, grad_input, grad_other], evidence_kind: definition}
- {id: AR.C13, basis: [AR.WHERE_VJP], statement: 'the two complete data VJPs route upstream through opposite condition branches and each sums back to its own input shape', observes: [out, grad_input, grad_other], evidence_kind: derived}
- {id: AR.C14, basis: [AR.CLAMP_TASK], statement: 'public scalar-bound clamp returns every coordinate of lower-then-upper clipping and leaves input and upstream unchanged', observes: [out, grad], evidence_kind: definition}
- {id: AR.C15, basis: [AR.CLAMP_VJP], statement: 'the complete input VJP passes upstream inside the inclusive selected bounds, including equality at either boundary, and is zero outside or everywhere when min exceeds max', observes: [out, grad], evidence_kind: definition}
- {id: AR.C16, basis: [AR.EXTREMA_TASK], statement: 'public Tensor/Tensor maximum or minimum returns every coordinate of the selected broadcast extremum and leaves both inputs and upstream unchanged', observes: [out, grad_input, grad_other], evidence_kind: definition}
- {id: AR.C17, basis: [AR.EXTREMA_VJP], statement: 'both complete VJPs route full upstream to the strict selected operand, split equality upstream equally, and reduce each broadcast gradient to its own input shape', observes: [out, grad_input, grad_other], evidence_kind: definition}
- {id: AR.C18, basis: [AR.SCALAR_VALUE], statement: 'a Python scalar operand, alpha, bound or fill value enters the real-profile formula as the exact binary64 or int64 value received, without rounding to the tensor dtype or to a computation type', observes: [out], evidence_kind: definition}
- {id: AR.C19, basis: [AR.POW, AR.ZERO_POW], statement: 'pow with an integral scalar exponent n is the exact n-th power for every real or infinite base, x**0 = 1 including 0**0, and a zero base with n < 0 is undefined; non-integral exponents are unsupported', observes: [out], evidence_kind: definition}
- {id: AR.C20, basis: [AR.EXTENDED_REAL], statement: 'infinite floating values give the extended-real result where it exists, are passed through unchanged by selection, and make inf - inf, 0*inf, inf/inf undefined', observes: [out], evidence_kind: definition}
- {id: AR.C21, basis: [AR.INTEGER, AR.INT_OVERFLOW], statement: 'the integer subset is exact integer arithmetic in the tensor dtype; a coordinate whose exact result leaves the dtype range makes the call undefined', observes: [out], evidence_kind: definition}
examples:
