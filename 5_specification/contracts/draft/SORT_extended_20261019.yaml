schema_version: '1.2'
id: SORT
role: ATEN_SORT
title: Sorting and top-k selection (torch.sort, torch.argsort, torch.topk), exact values and allowed index sets
review:
  status: drafted
  author: Claude (spec v3 author, group D2_special), 2026-10-17
  date: '2026-10-17'
  scope: Values and indices of one sort / argsort / topk call along one dimension; awaiting a review by someone who did not
    write it
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, reviewed_contract_and_adapter_match_current]
covers: [aten.sort, aten.argsort, aten.topk]
profiles:
  real:
    meaning: Elements are exact extended reals (rationals, -inf, +inf); the order is the order of the reals. Values are exact;
      an index is exact where the documented order determines it and otherwise an allowed set.
    task_choice_required: false
outputs:
  out:
    shape: '[values, indices] (argsort: indices only), the input shape with the sorted dimension of size n (topk: k)'
    kind: discrete
    guarantee: allowed_set
comparison:
  input_binding: Tensor values are the exact values received (a binary float is its exact value).
  complete_output: Every observed values or indices tensor is a record containing exactly t, v and shape. Dtype and
    explicit shape are checked before allowed-set membership; legacy bare lists are not a complete observation.
  quality: Exact equality of values and indices; an index position with several allowed originals compares as a set.
  test_evidence: Exact equality.
  error_handling: k outside [0, n] is invalid_input; NaN is not a real value (invalid_input); topk with sorted=False is unsupported.
decisions:
- id: SO.INDEX_SETS
  status: drafted
  statement: 'With stable=False the order of equal elements is not guaranteed (torch.sort example, argsort documentation), and
    topk documents that tied indices are not stable. The indices output is therefore stated per position as the set of original
    indices whose value equals the value at that position (exact when the value is unique). The joint constraint that the
    indices of a row are a permutation (sort) or distinct (topk) is part of the clause but is not encoded in the per-position
    sets: a comparison tool must also check distinctness. With stable=True the indices are exact: equal elements keep their
    original relative order, in ascending and in descending sorts alike ("preserving the order of equivalent elements").'
  basis: [T_SORT.STABLE, T_ARGSORT.DEF, T_TOPK.TIES]
- id: SO.UNSORTED
  status: drafted
  statement: topk with sorted=False returns the k elements in an unspecified order; stating it needs a multiset comparison the
    output format here does not have, so it is unsupported. The tested FlagGems call uses the default sorted=True.
  basis: [T_TOPK.SORTED]
- id: SO.REALS
  status: drafted
  statement: Infinities sort at the ends (-inf first in ascending order); NaN is not a real number and is outside the contract
    (its IEEE placement is not a real-number property).
  basis: [T_SORT.DEF]
clauses:
- {id: SO.C1, basis: [T_SORT.DEF], statement: 'sort: values along dim in ascending order (descending=True: descending); indices
    point to the original positions', observes: [out], evidence_kind: definition}
- {id: SO.C2, basis: [T_SORT.STABLE, SO.INDEX_SETS], statement: 'stable=True: equal elements keep their original relative order
    (exact indices), in both directions', observes: [out], evidence_kind: definition}
- {id: SO.C3, basis: [SO.INDEX_SETS, T_ARGSORT.DEF], statement: 'stable=False: the index at a position with tied values is any of
    the tied originals (allowed set)', observes: [out], evidence_kind: definition}
- {id: SO.C4, basis: [T_SORT.DEF], statement: dim selects the sorted dimension (default the last), observes: [out], evidence_kind: definition}
- {id: SO.C5, basis: [T_TOPK.DEF, T_TOPK.SORTED], statement: 'topk: the k largest (largest=False: smallest) values, sorted from
    the most extreme', observes: [out], evidence_kind: definition}
- {id: SO.C6, basis: [T_TOPK.TIES, SO.INDEX_SETS], statement: 'topk indices of tied values (including ties across the k
    boundary) are allowed sets', observes: [out], evidence_kind: definition}
- {id: SO.C7, basis: [T_TOPK.DEF], statement: 'k outside [0, n] is invalid_input; sorted=False is unsupported', observes: [out],
  evidence_kind: definition}
- {id: SO.C8, basis: [SO.REALS], statement: infinities are ordered as extended reals, observes: [out], evidence_kind: definition}
- {id: SO.C9, basis: [T_ARGSORT.DEF], statement: argsort returns the indices output of sort, observes: [out], evidence_kind: definition}
examples:
- {id: SO.E1, profile: real, clauses: [SO.C1], input: {op: aten.sort, args: [{t: f32, v: [[3, 1, 2]]}, 1]}, expected: {outcome: value,
    fields: {out: [[[1, 2, 3]], [[1, 2, 0]]]}}}
- {id: SO.E2, profile: real, clauses: [SO.C3], input: {op: aten.sort, args: [{t: f32, v: [1, 0, 1]}]}, expected: {outcome: value,
    fields: {out: [[0, 1, 1], [1, {set: [0, 2]}, {set: [0, 2]}]]}}}
- {id: SO.E3, profile: real, clauses: [SO.C2], input: {op: aten.sort, args: [{t: f32, v: [1, 0, 1]}], kwargs: {stable: true}},
  expected: {outcome: value, fields: {out: [[0, 1, 1], [1, 0, 2]]}}}
- {id: SO.E4, profile: real, clauses: [SO.C2, SO.C1], input: {op: aten.sort, args: [{t: bf16, v: [1, 2, 1, 2]}], kwargs: {descending: true,
      stable: true}}, expected: {outcome: value, fields: {out: [[2, 2, 1, 1], [1, 3, 0, 2]]}}}
- {id: SO.E5, profile: real, clauses: [SO.C3, SO.C1], input: {op: aten.sort, args: [{t: f16, v: [1, 2, 1, 2]}], kwargs: {descending: true}},
  expected: {outcome: value, fields: {out: [[2, 2, 1, 1], [{set: [1, 3]}, {set: [1, 3]}, {set: [0, 2]}, {set: [0, 2]}]]}}}
- {id: SO.E6, profile: real, clauses: [SO.C4], input: {op: aten.sort, args: [{t: f32, v: [[2, 0], [1, 3]]}, 0]}, expected: {outcome: value,
    fields: {out: [[[1, 0], [2, 3]], [[1, 0], [0, 1]]]}}}
- {id: SO.E7, profile: real, clauses: [SO.C8], input: {op: aten.sort, args: [{t: f32, v: [0, -inf, inf]}]}, expected: {outcome: value,
    fields: {out: [[-inf, 0, inf], [1, 0, 2]]}}}
- {id: SO.E8, profile: real, clauses: [SO.C5], input: {op: aten.topk, args: [{t: f32, v: [[1, 5, 3, 4]]}, 2, 1]}, expected: {outcome: value,
    fields: {out: [[[5, 4]], [[1, 3]]]}}}
- {id: SO.E9, profile: real, clauses: [SO.C6], input: {op: aten.topk, args: [{t: f32, v: [5, 3, 3]}, 2]}, expected: {outcome: value,
    fields: {out: [[5, 3], [0, {set: [1, 2]}]]}}}
- {id: SO.E10, profile: real, clauses: [SO.C5], input: {op: aten.topk, args: [{t: f32, v: [1, 5, 3, 4]}, 2], kwargs: {largest: false}},
  expected: {outcome: value, fields: {out: [[1, 3], [0, 2]]}}}
- {id: SO.E11, profile: real, clauses: [SO.C7], input: {op: aten.topk, args: [{t: f32, v: [1, 5]}, 3]}, expected: {outcome: invalid_input}}
- {id: SO.E12, profile: real, clauses: [SO.C7], input: {op: aten.topk, args: [{t: f32, v: [1, 5]}, 1], kwargs: {sorted: false}},
  expected: {outcome: unsupported}}
- {id: SO.E13, profile: real, clauses: [SO.C9], input: {op: aten.argsort, args: [{t: f32, v: ['1/2', '-1/3', 0]}]}, expected: {
    outcome: value, fields: {out: [1, 2, 0]}}}
signature:
  inputs: ['op: aten.sort (self, dim=-1, descending=False, stable=False) | aten.argsort | aten.topk (self, k, dim=-1, largest=True,
      sorted=True)', 'tensor {t, v, shape}']
  pre_state: []
  post_state: []
  observation_unit: the values and indices of one call
domain:
  valid: [exact extended reals, k in 0 .. n]
  domain_undefined: []
  invalid_input: [NaN, k out of range]
  unsupported: [topk with sorted=False]
mutation_requirements:
- {id: SO.M1, misreading: descending flag ignored, witnesses: [SO.E4]}
- {id: SO.M2, misreading: stable descending sort taken as the reverse of the stable ascending sort (equal elements reversed),
  witnesses: [SO.E4]}
- {id: SO.M3, misreading: 'unstable sort indices claimed exact (first occurrence) where ties allow several', witnesses: [SO.E2]}
- {id: SO.M4, misreading: dim ignored (always the last dimension), witnesses: [SO.E6]}
- {id: SO.M5, misreading: topk returns its k values in ascending order, witnesses: [SO.E8]}
- {id: SO.M6, misreading: topk largest flag ignored, witnesses: [SO.E10]}
nonclaims:
- The per-position index sets do not encode that indices of a row are distinct; that check belongs to the comparison tool.
- NaN placement (IEEE) and the device's tie-breaking order are not judged.
changes:
- {date: '2026-10-18', change: 'complete-output comparison now requires typed tensor records with explicit shape before
    checking values, index/value correspondence, ordering, tie choices and row-wise index uniqueness', trigger: 'a real
    FlagGems sort result was incorrectly rejected when supplied through the contract-declared tensor-record interface;
    tests/test_sorting_membership.py'}
- {date: '2026-10-18', change: 'reference moved to kernel_spec/sorting.py and shared with GRAPH; an element may be an enclosure
    (a value computed inside a graph): two elements are ordered when their enclosures decide the order, otherwise the result
    is not_established (the reference previously raised invalid_input for an enclosure, which misclassified a valid real
    input). Clauses, decisions and the results on exact inputs are unchanged.', trigger: 'GRAPH composition of essential_phase2b/moe_block
    (torch.topk k = 2 on router softmax probabilities), the gap recorded in corpus/bindings/E2_program.json'}
