schema_version: '1.2'
id: RADAM
role: RADAM
title: torch.optim.RAdam (variance rectification, decoupled_weight_decay, maximize), one step from an explicit
  pre-state, PyTorch 2.10 algorithm box
review:
  status: drafted
  author: Claude (spec v3 author, group E1_optim), 2026-10-17
  date: '2026-10-17'
  scope: One optimizer step on one parameter tensor (flattened), real arithmetic with the received hyperparameters;
    awaiting a review by someone who did not write it
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, reviewed_contract_and_adapter_match_current]
covers: [torch.optim.RAdam]
profiles:
  torch210:
    meaning: torch.optim.RAdam as its 2.10 algorithm box states; rho_t evaluated exactly from the received beta2 and the
      new step count; all option values.
    task_choice_required: false
outputs:
  theta:
    shape: '[d]'
    guarantee: rigorous_enclosure
  m:
    shape: '[d]'
    guarantee: exact
  v:
    shape: '[d]'
    guarantee: exact
  t:
    shape: scalar integer
    guarantee: exact
comparison:
  input_binding: 'All values are the exactly received rationals; in particular beta2 is the received value (a binary64
    0.999 is its exact binary64 value), never a binary32 rounding of it.'
  quality: No tolerance; theta is a strict enclosure, m, v, t exact.
  test_evidence: Exact equality or containment.
  error_handling: Inputs validated before evaluation.
decisions:
- id: RA.THRESHOLD
  status: drafted
  statement: 'The rectified branch is taken iff rho_t > 5 with rho_t the exact real value for the received beta2 and the
    new step count t = t_old + 1 (2.10 box and reference program). The RAdam paper uses a different threshold
    (rho_t > 4); the contract follows the versioned torch documentation, the task being torch.optim.RAdam. An
    implementation that evaluates rho_t in binary32 (compiled or capturable path, bug B012) can take the other branch
    near the threshold; under this contract that is a deviation from the task, not an allowed reading.'
  basis: [T_RADAM_OPT.RHO, T_RADAM_OPT.RECT, TS_RADAM.STEP]
- id: RA.DOMAIN
  status: drafted
  statement: 'In the rectified branch sqrt(v_t) + eps = 0 (eps = 0 and v_t = 0) divides by zero: domain_undefined. The
    unrectified branch has no denominator and is defined for every pre-state.'
  basis: [T_RADAM_OPT.RECT, T_RADAM_OPT.UNRECT]
clauses:
- {id: RA.C1, basis: [T_RADAM_OPT.MAXIMIZE], statement: g = -grad if maximize else grad (first), observes: [theta, m, v],
  evidence_kind: definition}
- {id: RA.C2, basis: [T_RADAM_OPT.DECAY, T_RADAM_OPT.DECOUPLED_TEXT], statement: 'weight_decay != 0: decoupled ->
    theta_t = theta_old*(1 - lr*weight_decay); otherwise g <- g + weight_decay*theta_old', observes: [theta, m, v],
  evidence_kind: definition}
- {id: RA.C3, basis: [T_RADAM_OPT.MOMENTS], statement: 't_new = t_old + 1; m_new, v_new as Adam; m_hat = m_new/(1 -
    beta1**t_new)', observes: [m, v, t, theta], evidence_kind: definition}
- {id: RA.C4, basis: [T_RADAM_OPT.INIT, T_RADAM_OPT.RHO, RA.THRESHOLD], statement: 'rho_inf = 2/(1-beta2) - 1; rho_t =
    rho_inf - 2*t_new*beta2**t_new/(1 - beta2**t_new); rectified iff rho_t > 5', observes: [theta],
  evidence_kind: definition}
- {id: RA.C5, basis: [T_RADAM_OPT.RECT, RA.DOMAIN], statement: 'rectified: l = sqrt(1 - beta2**t_new)/(sqrt(v_new) +
    eps) (uncorrected v_new), r = sqrt((rho_t-4)(rho_t-2)rho_inf/((rho_inf-4)(rho_inf-2)rho_t)), theta_new = theta_t -
    lr*m_hat*r*l', observes: [theta], evidence_kind: definition}
- {id: RA.C6, basis: [T_RADAM_OPT.UNRECT], statement: 'not rectified: theta_new = theta_t - lr*m_hat', observes: [theta],
  evidence_kind: definition}
- {id: RA.C7, basis: [T_ZERO_GRAD.SKIP], statement: 'gradient None leaves the state unchanged; a zero gradient is a full
    step', observes: [theta, m, v, t], evidence_kind: definition}
examples:
- id: RA.E1
  profile: torch210
  clauses: [RA.C3, RA.C4, RA.C6]
  input: {state: {theta: [1], m: [0], v: [0], t: 0}, gradient: [2], lr: 1/10, beta1: 9/10, beta2: 999/1000,
    eps: 1/100000000, weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: value, fields: {theta: ['4/5'], m: ['1/5'], v: ['1/250'], t: 1}}
  note: rho_1 = 1 for every beta2; theta = 1 - (1/10)*2.
- id: RA.E2
  profile: torch210
  clauses: [RA.C3, RA.C4, RA.C5]
  input: {state: {theta: [1], m: [0], v: [1], t: 5}, gradient: [1], lr: 1, beta1: 1/2, beta2: 9/10, eps: 1/10,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: value, fields: {theta: [1 - 8*sqrt(1405790045870435862235)/3718862618625], m: ['1/2'], v: [1],
      t: 6}}
  note: rho_6 = 2525329/468559 > 5; m_hat = 32/63; l = sqrt(1-(9/10)^6)/(1+1/10).
- id: RA.E3
  profile: torch210
  clauses: [RA.C4, RA.C6]
  input: {state: {theta: [1], m: [0], v: [1], t: 4}, gradient: [1], lr: 1, beta1: 1/2, beta2: 9/10, eps: 0,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: value, fields: {theta: ['15/31'], m: ['1/2'], v: [1], t: 5}}
  note: rho_5 = 187579/40951 (about 4.58), between 4 and 5 - not rectified.
- id: RA.E4
  profile: torch210
  clauses: [RA.C4, RA.C6]
  input: {state: {theta: [1], m: [0], v: [0], t: 4}, gradient: [1], lr: 1, beta1: 1/2, beta2: 99999/100000, eps: 0,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: value, fields: {theta: ['15/31'], m: ['1/2'], v: ['1/100000'], t: 5}}
  note: Exact rho_5 = 4.99996 < 5 - not rectified; binary32 evaluation gives 9 (B012 mechanism).
- id: RA.E5
  profile: torch210
  clauses: [RA.C2, RA.C6]
  input: {state: {theta: [2], m: [0], v: [0], t: 0}, gradient: [1], lr: 1/10, beta1: 1/2, beta2: 9/10, eps: 0,
    weight_decay: 1/2, decoupled: true, maximize: false}
  expected: {outcome: value, fields: {theta: ['9/5'], m: ['1/2'], v: ['1/10'], t: 1}}
- id: RA.E6
  profile: torch210
  clauses: [RA.C1, RA.C2, RA.C6]
  input: {state: {theta: [2], m: [0], v: [0], t: 0}, gradient: [1], lr: 1/10, beta1: 1/2, beta2: 9/10, eps: 0,
    weight_decay: 1/2, decoupled: false, maximize: true}
  expected: {outcome: value, fields: {theta: [2], m: [0], v: [0], t: 1}}
  note: g = -1 + (1/2)*2 = 0.
- id: RA.E7
  profile: torch210
  clauses: [RA.C7]
  input: {state: {theta: [1], m: [1], v: [1], t: 1}, gradient: null, lr: 1/10, beta1: 1/2, beta2: 9/10, eps: 0,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: value, fields: {theta: [1], m: [1], v: [1], t: 1}}
- id: RA.E8
  profile: torch210
  clauses: [RA.C5]
  input: {state: {theta: [1], m: [1], v: [0], t: 5}, gradient: [0], lr: 1, beta1: 1/2, beta2: 9/10, eps: 0,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: domain_undefined}
- id: RA.E9
  profile: torch210
  clauses: [RA.C3, RA.C6, RA.C7]
  input: {state: {theta: [1], m: [1], v: [1], t: 1}, gradient: [0], lr: 1/10, beta1: 1/2, beta2: 9/10, eps: 0,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: value, fields: {theta: ['14/15'], m: ['1/2'], v: ['9/10'], t: 2}}
- id: RA.N1
  profile: torch210
  clauses: [RA.C4]
  input: {state: {theta: [1], m: [0], v: [0], t: 0}, gradient: [1], lr: 1, beta1: 1/2, beta2: 1, eps: 0,
    weight_decay: 0, decoupled: false, maximize: false}
  expected: {outcome: invalid_input}
signature:
  inputs: ['gradient [d] or None', lr, beta1, beta2, eps, weight_decay, 'decoupled, maximize (booleans)']
  pre_state: ['theta [d]', 'm [d]', 'v [d]', t nonnegative integer]
  post_state: ['theta [d]', 'm [d]', 'v [d]', t]
  observation_unit: one parameter tensor (flattened; element-wise update), one optimizer step
domain:
  valid: [d >= 1, finite rationals, v >= 0, '0 <= beta1, beta2 < 1', 'lr, eps, weight_decay >= 0']
  domain_undefined: ['rectified branch with sqrt(v_new) + eps = 0']
  invalid_input: [length mismatch, negative v, 'beta outside [0, 1)', NaN or infinite values, non-boolean options]
  unsupported: [sparse gradients, complex parameters, differentiable=True]
mutation_requirements:
- {id: RA.M1, misreading: 'rho_t evaluated in binary32 (B012: compiled / capturable path), threshold flips near rho_t = 5',
  witnesses: [RA.E4]}
- {id: RA.M2, misreading: threshold rho_t > 4 (paper) instead of > 5 (torch 2.10), witnesses: [RA.E3]}
- {id: RA.M3, misreading: adaptive Adam step at every step (no rectification switch), witnesses: [RA.E1, RA.E3]}
- {id: RA.M4, misreading: 'l computed from the bias-corrected v_hat (1/(sqrt(v_hat)+eps)), eps position changed',
  witnesses: [RA.E2]}
- {id: RA.M5, misreading: decoupled_weight_decay flag inverted, witnesses: [RA.E5, RA.E6]}
- {id: RA.M6, misreading: maximize negates after the L2 term, witnesses: [RA.E6]}
- {id: RA.M7, misreading: None gradient treated as zero, witnesses: [RA.E7]}
nonclaims:
- Device rounding is not judged here (K - f). A binary32 evaluation of rho_t (bug B012, tolerance study mechanism B) is
  measured against this exact target; the size of that deviation is an empirical result, not part of the contract.
- A rejected mutant witnesses a particular error; rejecting all listed mutants does not prove completeness.
changes: []
