schema_version: '1.2'
id: CLIP
role: CLIP
title: Gradient clipping - get_total_norm, clip_grad_norm_ (incl. non-finite gradients) and clip_grad_value_
review:
  status: drafted
  author: Claude (spec v3 author, group E2_program), 2026-10-17
  date: '2026-10-17'
  scope: Documented formulas of PyTorch 2.10; non-finite gradients under the documented formula with IEEE 754 special
    values; awaiting a review by someone who did not write it
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, contract_and_implementation_hashes_bound]
covers: [torch.nn.utils.clip_grad_norm_, torch.nn.utils.clip_grad_value_, torch.nn.utils.get_total_norm,
  torch.nn.utils.clip_grads_with_norm_, accelerate.Accelerator.clip_grad_norm_]
profiles:
  real:
    meaning: Exact real gradients (rationals, +-inf where the real operations have limits); a gradient that the
      documented formula would turn into 0 * inf or that is NaN makes the target undefined.
    task_choice_required: false
  ieee_nonfinite:
    meaning: 'The documented formula evaluated with IEEE 754 special values for non-finite gradients and
      error_if_nonfinite=False: total norm +inf or NaN, coefficient 0 or NaN, 0 * inf = NaN. Finite gradients as in
      profile real. NaN outputs are written as the empty allowed set.'
    task_choice_required: true
outputs:
  total_norm:
    shape: scalar (clip_grad_value_ returns nothing - the empty list)
    guarantee: rigorous_enclosure
  grads:
    shape: list of the gradients after the call, each with its parameter's shape; a parameter without gradient is []
    guarantee: rigorous_enclosure
readings:
  minimum_number:
    meaning: 'min(max_norm/(total_norm + 1e-6), 1) read as IEEE minimumNumber, so a NaN total norm gives coefficient 1
      and leaves the gradients unscaled (instead of the NaN-propagating minimum of CLIP.NONFINITE). Diagnostic only.'
    basis: [IEEE754.MINMAX]
comparison:
  input_binding: Gradient values and max_norm / clip_value are the exact values received.
  quality: 'No tolerance; exact values or enclosure containment. In profile ieee_nonfinite an element at which NaN is
    required is written {set: []}.'
  test_evidence: Exact equality or enclosure containment.
  error_handling: error_if_nonfinite=True with a non-finite total norm is the documented error (invalid_input); NaN
    gradients under profile real are domain_undefined.
decisions:
- id: CLIP.EPS
  status: drafted
  statement: 'The 1e-6 of the documented coefficient max_norm/(total_norm + 1e-6) is part of the formula (earlier
    decision CLIP-A1) and is read as the decimal 10^-6 it denotes. The reference program adds the binary64 literal 1e-6
    (10^-6 + 2^-70 approx.); that difference is a constant-binding question of the implementation (K - G), not a
    different target. Alternative (no epsilon) is mutation CLIP.M1.'
  basis: [T_CLIP_WITH_NORM.DEF, TS_CLIP_GRAD.CLIP]
- id: CLIP.FOREACH
  status: drafted
  statement: 'foreach selects an implementation ("the faster foreach-based implementation"); the documented result is the
    same function, so foreach has no effect on the target. A parameter without a gradient is skipped (reference
    program), contributing nothing to the norm and keeping no gradient.'
  basis: [T_CLIP_NORM.PARAMS, TS_CLIP_GRAD.CLIP, TS_CLIP_GRAD.NORM]
- id: CLIP.NONFINITE
  status: drafted
  statement: 'Earlier status "non-finite gradients: documented scaling by the non-finite coefficient, recorded" decided:
    with error_if_nonfinite=False the documented formula still applies. Profile real: +inf gradients give total norm
    +inf, coefficient max_norm/(inf + 1e-6) = 0, and the infinite element times 0 has no real value, so the result is
    domain_undefined; NaN is outside the reals (domain_undefined). Profile ieee_nonfinite (task-selected): IEEE 754
    special values - a sum with NaN is NaN, sqrt(+inf) = +inf, finite/+inf = 0, 0 * inf = NaN, and min(NaN, 1) =
    NaN (IEEE minimum, as the reference program''s clamp); hence an inf gradient leaves NaN at its own position and 0
    elsewhere, a NaN gradient makes every element NaN. The inf-norm of a NaN gradient (a max) has no IEEE or documented
    result and is domain_undefined. Alternative minimumNumber (coefficient 1) is the reading minimum_number.
    error_if_nonfinite=True with a non-finite total norm raises (documented) - invalid_input in both profiles.'
  basis: [T_CLIP_NORM.PARAMS, T_CLIP_WITH_NORM.DEF, IEEE754.NAN_PROP, IEEE754.INF_ARITH, IEEE754.INVALID, IEEE754.MINMAX,
    TS_CLIP_GRAD.CLIP]
- id: CLIP.VALUE
  status: drafted
  statement: 'clip_grad_value_ (earlier "outside the contract") clamps every gradient element to [-clip_value,
    clip_value]: +-inf go to the bounds; NaN stays NaN in profile ieee_nonfinite (IEEE minimum / maximum) and is
    undefined in profile real. A negative clip_value (empty range; the page does not address it) is outside the
    contract (unsupported, untested).'
  basis: [T_CLIP_VALUE.DEF, TS_CLIP_GRAD.VALUE, IEEE754.MINMAX]
clauses:
- {id: CL.C1, basis: [T_GET_TOTAL_NORM.DEF, T_CLIP_NORM.DEF, T_VECTOR_NORM.DEF], statement: 'total norm = p-norm of the
    vector of per-parameter p-norms = p-norm of all gradient elements together (p = inf: max |g|); no gradients: 0',
  observes: [total_norm], evidence_kind: definition}
- {id: CL.C2, basis: [T_CLIP_WITH_NORM.DEF, CLIP.EPS], statement: 'clipped g = g * min(max_norm/(total_norm + 10^-6), 1)
    with the same coefficient for every parameter', observes: [grads], evidence_kind: definition}
- {id: CL.C3, basis: [CLIP.FOREACH], statement: 'foreach has no effect; parameters without gradient are skipped',
  observes: [total_norm, grads], evidence_kind: definition}
- {id: CL.C4, basis: [CLIP.NONFINITE], statement: 'non-finite gradients: profile real undefined; profile ieee_nonfinite
    IEEE special values of the documented formula; error_if_nonfinite=True raises', observes: [total_norm, grads],
  evidence_kind: definition}
- {id: CL.C5, basis: [CLIP.VALUE], statement: 'clip_grad_value_: every element clamped to [-c, c]', observes: [grads],
  evidence_kind: definition}
examples:
- {id: CL.E1, profile: real, clauses: [CL.C1, CL.C2], input: {op: clip_grad_norm, grads: [[3], [4]], max_norm: 1, norm_type: 2},
  expected: {outcome: value, fields: {total_norm: 5, grads: [['3000000/5000001'], ['4000000/5000001']]}}}
- {id: CL.E2, profile: real, clauses: [CL.C1, CL.C2], note: total norm below max_norm - coefficient clamped to 1, input: {
    op: clip_grad_norm, grads: [['3/10'], ['2/5']], max_norm: 1, norm_type: 2}, expected: {outcome: value, fields: {total_norm: '1/2',
      grads: [['3/10'], ['2/5']]}}}
- {id: CL.E3, profile: real, clauses: [CL.C1, CL.C2], input: {op: clip_grad_norm, grads: [[1, -2], [3]], max_norm: 3, norm_type: 1},
  expected: {outcome: value, fields: {total_norm: 6, grads: [['3000000/6000001', '-6000000/6000001'], ['9000000/6000001']]}}}
- {id: CL.E4, profile: real, clauses: [CL.C1, CL.C2], input: {op: clip_grad_norm, grads: [[1, -4], [2]], max_norm: 2, norm_type: inf},
  expected: {outcome: value, fields: {total_norm: 4, grads: [['2000000/4000001', '-8000000/4000001'], ['4000000/4000001']]}}}
- {id: CL.E5, profile: real, clauses: [CL.C1, CL.C2], input: {op: clip_grad_norm, grads: [[1, 1]], max_norm: 1, norm_type: 2},
  expected: {outcome: value, fields: {total_norm: sqrt(2), grads: [[1/(sqrt(2)+1/1000000), 1/(sqrt(2)+1/1000000)]]}}}
- {id: CL.E6, profile: real, clauses: [CL.C1, CL.C2], note: all-zero gradients (tested), input: {op: clip_grad_norm, grads: [[
        0, 0], [0]], max_norm: 1, norm_type: 2}, expected: {outcome: value, fields: {total_norm: 0, grads: [[0, 0], [0]]}}}
- {id: CL.E7, profile: real, clauses: [CL.C3, CL.C2], input: {op: clip_grad_norm, grads: [[3], null, [4]], max_norm: 1, norm_type: 2},
  expected: {outcome: value, fields: {total_norm: 5, grads: [['3000000/5000001'], [], ['4000000/5000001']]}}}
- {id: CL.E8, profile: real, clauses: [CL.C3], input: {op: clip_grad_norm, grads: [[3], [4]], max_norm: 1, norm_type: 2, foreach: true},
  expected: {outcome: value, fields: {total_norm: 5, grads: [['3000000/5000001'], ['4000000/5000001']]}}}
- {id: CL.E9, profile: real, clauses: [CL.C5], input: {op: clip_grad_value, grads: [[1, -3], ['1/4']], clip_value: '1/2'},
  expected: {outcome: value, fields: {total_norm: [], grads: [['1/2', '-1/2'], ['1/4']]}}}
- {id: CL.E10, profile: real, clauses: [CL.C4], input: {op: clip_grad_norm, grads: [['inf', 1], [2]], max_norm: 1, norm_type: 2},
  expected: {outcome: domain_undefined}}
- {id: CL.E11, profile: ieee_nonfinite, clauses: [CL.C4], input: {op: clip_grad_norm, grads: [['inf', 1], [2]], max_norm: 1,
    norm_type: 2}, expected: {outcome: value, fields: {total_norm: inf, grads: [[{set: []}, 0], [0]]}}}
- id: CL.E12
  profile: ieee_nonfinite
  clauses: [CL.C4]
  input: {op: clip_grad_norm, grads: [['nan', 1], [2]], max_norm: 1, norm_type: 2}
  expected: {outcome: value, fields: {total_norm: {set: []}, grads: [[{set: []}, {set: []}], [{set: []}]]}}
  readings:
    minimum_number: {outcome: value, fields: {total_norm: {set: []}, grads: [[{set: []}, 1], [2]]}}
- {id: CL.E13, profile: ieee_nonfinite, clauses: [CL.C1, CL.C4], input: {op: clip_grad_norm, grads: [['inf', -1], [2]], max_norm: 1,
    norm_type: inf}, expected: {outcome: value, fields: {total_norm: inf, grads: [[{set: []}, 0], [0]]}}}
- {id: CL.E14, profile: ieee_nonfinite, clauses: [CL.C4], input: {op: clip_grad_norm, grads: [['inf', 1], [2]], max_norm: 1,
    norm_type: 2, error_if_nonfinite: true}, expected: {outcome: invalid_input}}
- {id: CL.E15, profile: real, clauses: [CL.C1], note: per-shard norms of the tested shards = 2 condition, input: {op: get_total_norm,
    grads: [[3], [4]], norm_type: 2}, expected: {outcome: value, fields: {total_norm: 5, grads: [[3], [4]]}}}
- {id: CL.E16, profile: real, clauses: [CL.C1, CL.C2], input: {op: clip_grad_norm, grads: [[1, 2]], max_norm: 1, norm_type: 3},
  expected: {outcome: value, fields: {total_norm: 9**(1/3), grads: [[1/(9**(1/3)+1/1000000), 2/(9**(1/3)+1/1000000)]]}}}
- {id: CL.E17, profile: ieee_nonfinite, clauses: [CL.C5, CL.C4], input: {op: clip_grad_value, grads: [['nan', 'inf', '-inf', 2]],
    clip_value: 1}, expected: {outcome: value, fields: {total_norm: [], grads: [[{set: []}, 1, -1, 1]]}}}
- {id: CL.E18, profile: real, clauses: [CL.C5], input: {op: clip_grad_value, grads: [['inf', '-inf']], clip_value: 1},
  expected: {outcome: value, fields: {total_norm: [], grads: [[1, -1]]}}}
signature:
  inputs: ['op: clip_grad_norm | clip_grad_value | get_total_norm', 'grads: list, one nested list per parameter (null:
      no gradient)', 'max_norm, norm_type (positive rational or inf), error_if_nonfinite, foreach, clip_value']
  pre_state: [the gradients]
  post_state: [the gradients after the in-place call]
  observation_unit: one call over a list of parameters
domain:
  valid: [rational or infinite gradient elements; norm_type a positive rational or inf; max_norm and clip_value >= 0]
  domain_undefined: [profile real - NaN gradients, or an infinite gradient that the coefficient 0 multiplies; inf-norm of
      a NaN gradient]
  invalid_input: [error_if_nonfinite=True with a non-finite total norm]
  unsupported: [norm_type 0, -inf or negative, negative clip_value]
mutation_requirements:
- {id: CLIP.M1, misreading: coefficient max_norm / total_norm without the 1e-6, witnesses: [CL.E1]}
- {id: CLIP.M2, misreading: coefficient not clamped at 1 (small gradients amplified), witnesses: [CL.E2]}
- {id: CLIP.M3, misreading: total norm as the sum of per-parameter norms, witnesses: [CL.E1]}
- {id: CLIP.M4, misreading: norm_type ignored (always the 2-norm), witnesses: [CL.E3]}
- {id: CLIP.M5, misreading: each parameter clipped by its own norm, witnesses: [CL.E1]}
- {id: CLIP.M6, misreading: clip_grad_value_ clamps only the upper side, witnesses: [CL.E9]}
- {id: CLIP.M7, misreading: 'a non-finite total norm leaves the gradients unscaled (coefficient 1)', witnesses: [CL.E11]}
- {id: CLIP.M8, misreading: '0 * inf taken as 0 when the coefficient is 0', witnesses: [CL.E11]}
- {id: CLIP.M9, misreading: error_if_nonfinite ignored, witnesses: [CL.E14]}
- {id: CLIP.M10, misreading: inf-norm computed as max(g) without the absolute value, witnesses: [CL.E4]}
- {id: CLIP.M11, misreading: 'parameters after one without gradient are dropped (silent truncation)', witnesses: [CL.E7]}
nonclaims:
- Floating-point evaluation of the norm and of the coefficient (including the binary64 1e-6) is the numerical
  question (K - G).
- NaN propagation in profile ieee_nonfinite is a task-selected profile built from the documented formula and IEEE 754;
  PyTorch documents no NaN behaviour for these functions.
changes: []
