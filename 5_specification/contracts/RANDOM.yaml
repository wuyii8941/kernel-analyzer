- {id: RN3.E3, profile: native_forward_given_mask, clauses: [RN3.C1], note: 'recorded p = 0.1 as a Python float: exact double 3602879701896397/36028797018963968, scale 36028797018963968/32425917317067571', input: {op: aten.native_dropout, args: [{t: bf16, v: [[[3, '-1/2']]]}, 0.1, true], kwargs: {observed_mask: {t: b8, v: [[[true, false]]]}}}, expected: {outcome: value, fields: {out: [[[['108086391056891904/32425917317067571', 0]]], [[[1, 0]]]]}}}
- {id: RN3.E4, profile: native_forward_given_mask, clauses: [RN3.C2], input: {op: aten.native_dropout, args: [{t: f32, v: [2, 4]}, '1/2', false]}, expected: {outcome: value, fields: {out: [[2, 4], [1, 1]]}}}
