schema_version: '1.2'
id: RANDOM
role: RANDOM
title: Deterministic dropout forward boundaries, finite native dropout backward, and native dropout forward given the returned mask
review:
  status: reviewed_for_implementation
  reviewer: 'independent review 2026-10-21 (reviews/2026-10-20/A2_package_E_review.md)'
  author: Claude (path A closure work package E), 2026-10-20; profiles deterministic_forward and finite_backward unchanged from the review by OpenAI Codex (2026-10-19)
  date: '2026-10-21'
  scope: >-
    PyTorch 2.10 dropout cases whose complete value is fixed without choosing a random stream, plus native dropout
    forward conditioned on the mask the call returned. The new profile awaits a review by someone who did not write it.
activation:
  implementation_status: validated
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers: [aten.dropout, torch.nn.functional.dropout, aten.native_dropout_backward, aten.native_dropout]
profiles:
  deterministic_forward:
    meaning: >-
      Complete dropout forward values on positive rank-1 through rank-4 physical finite f16, bf16, f32 or f64
      tensors when evaluation is selected, or when training uses p=0 or p=1. These cases have a unique result without
      observing or reproducing a random stream. Training with 0<p<1 is outside this profile.
    task_choice_required: false
    basis: [RN2.SCHEMA, RN2.DETERMINISTIC]
  finite_backward:
    meaning: >-
      Complete native dropout backward values for a positive rank-1 through rank-4 physical finite f16, bf16, f32 or
      f64 gradient tensor, an explicit same-shape Boolean mask, and a finite exact scale.
    task_choice_required: false
    basis: [RN2.SCHEMA, RN2.BACKWARD]
  native_forward_given_mask:
    meaning: >-
      aten.native_dropout(input, p, train) -> (output, mask) on a finite f16, bf16, f32 or f64 input of positive size
      and any rank, with the mask the call returned supplied as the reference input observed_mask. Given that mask the
      output is determined: input * mask / (1 - p) in training with 0 < p < 1; input when train is false or p = 0;
      zeros when p = 1. The profile checks the consistency of the output with the mask and the documented scaling;
      it does not check that the mask is random or has the documented keep probability.
    task_choice_required: false
    basis: [RN3.CONDITIONED, RN3.SCALING, RN3.MASK_POSITION, RN3.TRAIN_NONE]
readings:
  keep_fraction:
    meaning: >-
      Diagnostic only, never part of the verdict: [fraction of true entries in observed_mask, documented keep
      probability 1 - p] for a native_dropout query. Whether the fraction is plausible for Bernoulli(1 - p) is a
      separate statistical question.
    basis: [T_DROPOUT.DEF, RN3.CONDITIONED]
outputs:
  out:
    shape: >-
      the complete input or gradient shape; for aten.native_dropout the ATen return list [output, mask] where output
      has the input shape and dtype and the mask position is the Boolean mask in the numeric encoding 1 = true, 0 = false (RN3.MASK_POSITION)
    guarantee: exact
comparison:
  input_binding: >-
    The tensor records contain the exact physical values received in their declared dtypes. Forward probability and
    training mode, or backward mask and scale, are explicit call arguments.
  complete_output: The complete returned tensor is observed with dtype, explicit shape and every value.
  quality: Exact finite-real task value, dtype and shape; no tolerance and no partial output.
  test_evidence: Independent coordinate formulas and PyTorch 2.10 comparisons over all selected floating dtypes.
  error_handling: Malformed calls are invalid_input; stochastic training forward without the returned mask, in-place
    operation, special values, signed-zero distinctions, empty or unselected ranks and other dtypes receive no
    reference answer. native_dropout with train=None is unsupported (RN3.TRAIN_NONE).
decisions:
- id: RN2.SCHEMA
  status: reviewed
  statement: >-
    For the profiles deterministic_forward and finite_backward, select the one-output functional dropout calls and the
    one-output native_dropout_backward call. Native dropout forward returns an additional mask; it is not part of
    these two profiles and is covered only by the separate profile native_forward_given_mask (RN3.CONDITIONED).
    In-place, feature, alpha and fused attention dropout forms are different tasks.
  basis: [TS_NATIVE_FUNCTIONS.DROPOUT_SCHEMAS]
- id: RN2.DETERMINISTIC
  status: reviewed
  statement: >-
    Evaluation-mode dropout is the identity. In training, p=0 is the identity and p=1 is the all-zero tensor. For
    0<p<1 the output depends on independently sampled Bernoulli variables, so this value reference refuses the query
    instead of inventing a mask or accepting the tested kernel's mask as ground truth.
  basis: [T_DROPOUT.DEF, T_DROPOUT_F.DEF, TS_DECOMP.DROPOUT]
- id: RN2.BACKWARD
  status: reviewed
  statement: >-
    Native dropout backward with an explicit mask and scale returns grad_output * mask * scale at every coordinate.
    Its result is deterministic because the mask is an ordinary task input.
  basis: [TS_DECOMP.DROPOUT_BWD, TS_NATIVE_FUNCTIONS.DROPOUT_SCHEMAS]
- id: RN3.CONDITIONED
  status: reviewed
  statement: >-
    native_dropout returns (output, mask). The mask is drawn from Bernoulli variables whose stream is
    implementation-defined, so no f can predict it. Given the Boolean mask the call actually returned, the output is
    a deterministic function of input, p and that mask. The profile therefore takes the returned mask as an
    additional reference input, the keyword observed_mask (not an ATen argument: the measured call is replayed as
    recorded and the harness maps return position 1 into this keyword). Alternatives: (a) refuse training forward
    (the previous reviewed scope); (b) a pseudo-op such as random.native_dropout_given_mask; (c) the keyword
    observed_mask on aten.native_dropout. Choice (c), so that covers and overload matching stay those of the real
    ATen call. What is checked is the consistency of the output with the mask and the scaling, not the randomness,
    independence or keep probability of the mask; the mask is not an independent reference for itself. The keep
    fraction is available only as the diagnostic reading keep_fraction. observed_mask must be a Boolean tensor of the
    input's shape (else invalid_input); in training with 0 < p < 1 without it the call is unsupported. Negative zero
    in the input denotes the real value 0 (signed-zero distinctions are not compared).
  basis: [TS_NATIVE_FUNCTIONS_CR.NATIVE_DROPOUT_SCHEMA, T_DROPOUT.DEF, TS_DECOMP.DROPOUT, TS_DROPOUT_CPP.NATIVE_CPU]
- id: RN3.SCALING
  status: reviewed
  statement: >-
    In training with 0 < p < 1 the output is input * mask * (1/(1 - p)) at every coordinate, with p the exact value
    of the received double and the scale exact (the page states the 1/(1-p) scaling during training; the
    decomposition and the CPU kernel multiply by the Boolean mask and that scale). train false returns the input and
    an all-true mask; training with p = 0 returns the input (all-true mask in the decomposition, Bernoulli(1) in the
    kernels); p = 1 returns zeros and an all-false mask (decomposition and CUDA kernel; the CPU kernel uses scale 0 and
    Bernoulli(0)). p is documented as a probability (the probability of an element to be zeroed), so p outside
    [0, 1] is invalid_input on that documentation basis; the kernels do not reject it uniformly (CPU training raises
    in bernoulli_, evaluation returns the input, CUDA training computes with it). Non-floating inputs are unsupported.
  basis: [T_DROPOUT.DEF, TS_DECOMP.DROPOUT, TS_DROPOUT_CPP.NATIVE_CPU, TS_DROPOUT_CU.NATIVE_CUDA]
- id: RN3.MASK_POSITION
  status: reviewed
  statement: >-
    Both return positions are defined and compared. Position 1 (the mask) is the all-true mask when train is false or
    p = 0, the all-false mask when p = 1, and the observed mask itself in training with 0 < p < 1. Because the RANDOM
    output out is a numeric field shared with the reviewed profiles, and the measurement binding accepts one kind per
    output field, the reference returns the mask in the exact numeric encoding 1 = true (kept) and 0 = false
    (dropped); the contract's complete-output checker compares the observed Boolean mask (dtype bool, shape, every
    entry) with that encoding. In the conditioned case this comparison is only a consistency check of the binding (the
    returned mask is the reference input); in the deterministic cases it checks the documented mask. Alternatives:
    (a) a mixed numeric/Boolean field (kind discrete), refused by the measurement binding; (b) a second Boolean output
    field, not expressible in the path A ATen return-list convention; (c) not comparing position 1, which the binding
    layer forbids for a conditioning return and which would leave the deterministic masks unchecked. Choice: the
    numeric encoding.
  basis: [TS_NATIVE_FUNCTIONS_CR.NATIVE_DROPOUT_SCHEMA, TS_DECOMP.DROPOUT, RN3.CONDITIONED]
- id: RN3.TRAIN_NONE
  status: reviewed
  statement: >-
    The schema allows train = None. The decomposition treats it as evaluation (input, all-true mask); the CPU and
    CUDA kernels treat it as training. No page documents it, so train = None is unsupported. Recorded calls pass True.
  basis: [TS_NATIVE_FUNCTIONS_CR.NATIVE_DROPOUT_SCHEMA, TS_DECOMP.DROPOUT, TS_DROPOUT_CPP.NATIVE_CPU, TS_DROPOUT_CU.NATIVE_CUDA]
clauses:
- id: RN2.C1
  basis: [RN2.SCHEMA, RN2.DETERMINISTIC]
  statement: Evaluation forward returns the complete input unchanged for every admitted p in [0,1].
  observes: [out]
  evidence_kind: definition
- id: RN2.C2
  basis: [RN2.DETERMINISTIC]
  statement: Training forward returns the complete input for p=0 and a same-dtype, same-shape all-zero tensor for p=1.
  observes: [out]
  evidence_kind: definition
- id: RN2.C3
  basis: [RN2.DETERMINISTIC]
  statement: Training forward with 0<p<1 has no value answer in this profile.
  observes: [out]
  evidence_kind: definition
- id: RN2.C4
  basis: [RN2.BACKWARD]
  statement: Every backward output coordinate is grad_output at that coordinate times the Boolean mask and exact scale.
  observes: [out]
  evidence_kind: definition
- id: RN2.C5
  basis: [RN2.SCHEMA]
  statement: >-
    The deterministic_forward and finite_backward profiles require complete positive rank-1 through rank-4 physical finite floating tensors; backward additionally
    requires a same-shape Boolean mask. Special values, signed-zero distinctions and other ranks or dtypes are refused.
  observes: [out]
  evidence_kind: definition
- id: RN3.C1
  basis: [RN3.CONDITIONED, RN3.SCALING]
  statement: In training with 0 < p < 1, every output coordinate is input * (1/(1-p)) where observed_mask is true and 0 where it is false.
  observes: [out]
  evidence_kind: definition
- id: RN3.C2
  basis: [RN3.SCALING]
  statement: train false or p = 0 returns the complete input; training with p = 1 returns the all-zero tensor of the input's shape and dtype.
  observes: [out]
  evidence_kind: definition
- id: RN3.C3
  basis: [RN3.CONDITIONED, RN3.SCALING, RN3.TRAIN_NONE]
  statement: A missing observed_mask in stochastic training, train = None, special input values and non-floating inputs are unsupported; a non-Boolean or wrongly shaped observed_mask or p outside [0, 1] is invalid_input.
  observes: [out]
  evidence_kind: definition
- id: RN3.C4
  basis: [RN3.MASK_POSITION]
  statement: Return position 1 is the mask in the encoding 1 = kept, 0 = dropped - all ones for train false or p = 0, all zeros for p = 1, the observed mask otherwise.
  observes: [out]
  evidence_kind: definition
examples:
- {id: RN2.E1, profile: deterministic_forward, clauses: [RN2.C1], input: {op: aten.dropout, args: [{t: f32, v: [2, -4, 6]}, '1/2', false]}, expected: {outcome: value, fields: {out: [2, -4, 6]}}}
- {id: RN2.E2, profile: deterministic_forward, clauses: [RN2.C1], input: {op: torch.nn.functional.dropout, args: [{t: f64, v: [[1, 2], [3, 4]]}], kwargs: {p: '1/4', training: false, inplace: false}}, expected: {outcome: value, fields: {out: [[1, 2], [3, 4]]}}}
- {id: RN2.E3, profile: deterministic_forward, clauses: [RN2.C2], input: {op: aten.dropout, args: [{t: f16, v: [1, -2, 3]}, 0, true]}, expected: {outcome: value, fields: {out: [1, -2, 3]}}}
- {id: RN2.E4, profile: deterministic_forward, clauses: [RN2.C2], input: {op: torch.nn.functional.dropout, args: [{t: bf16, v: [[1, -2], [3, 4]]}, 1, true]}, expected: {outcome: value, fields: {out: [[0, 0], [0, 0]]}}}
- {id: RN2.E5, profile: deterministic_forward, clauses: [RN2.C3], input: {op: aten.dropout, args: [{t: f32, v: [1, 2]}, '1/2', true]}, expected: {outcome: unsupported}}
- {id: RN2.E6, profile: deterministic_forward, clauses: [RN2.C5], input: {op: aten.dropout, args: [{t: f32, v: [1, 2]}, '3/2', false]}, expected: {outcome: invalid_input}}
- {id: RN2.E7, profile: deterministic_forward, clauses: [RN2.C5], input: {op: aten.dropout, args: [{t: f32, v: [1, 2]}, 0, 1]}, expected: {outcome: invalid_input}}
- {id: RN2.E8, profile: deterministic_forward, clauses: [RN2.C5], input: {op: torch.nn.functional.dropout, args: [{t: f32, v: [1, 2]}], kwargs: {p: 0, training: true, inplace: true}}, expected: {outcome: unsupported}}
- {id: RN2.E9, profile: deterministic_forward, clauses: [RN2.C5], input: {op: aten.dropout, args: [{t: i64, v: [1, 2]}, 0, true]}, expected: {outcome: unsupported}}
- {id: RN2.E10, profile: deterministic_forward, clauses: [RN2.C5], input: {op: aten.dropout, args: [{t: f32, v: [1, inf]}, 0, true]}, expected: {outcome: unsupported}}
- {id: RN2.E11, profile: deterministic_forward, clauses: [RN2.C5], input: {op: aten.dropout, args: [{t: f32, v: ['1/3', 1]}, 0, true]}, expected: {outcome: invalid_input}}
- {id: RN2.E12, profile: finite_backward, clauses: [RN2.C4], input: {op: aten.native_dropout_backward, args: [{t: f32, v: [1, 2, -3]}, {t: b8, v: [true, false, true]}, '5/4']}, expected: {outcome: value, fields: {out: ['5/4', 0, '-15/4']}}}
- {id: RN2.E13, profile: finite_backward, clauses: [RN2.C4], input: {op: aten.native_dropout_backward, args: [{t: f16, v: [[2, -4], [6, 8]]}, {t: b8, v: [[false, true], [true, false]]}, '-1/2']}, expected: {outcome: value, fields: {out: [[0, 2], [-3, 0]]}}}
