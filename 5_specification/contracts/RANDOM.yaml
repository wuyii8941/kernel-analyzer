- {id: RN3.E14, profile: native_forward_given_mask, clauses: [RN3.C3], input: {op: aten.native_dropout, args: [{t: i64, v: [2, 4]}, '1/2', true], kwargs: {observed_mask: {t: b8, v: [true, false]}}}, expected: {outcome: unsupported}}
