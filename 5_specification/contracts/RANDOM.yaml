signature:
  inputs: [selected dropout operation and exact scalar parameters, one physical finite floating tensor, an explicit same-shape Boolean mask for backward, the returned mask as observed_mask for native forward]
  pre_state: [all input tensors are unchanged]
  post_state: [one complete newly returned tensor]
  observation_unit: every returned coordinate together with dtype and shape
domain:
  valid:
  - evaluation forward with p in the closed unit interval
  - training forward with p equal to zero or one
  - native backward with explicit Boolean mask and finite exact scale
  - native forward with p in [0, 1], Boolean train, and the returned same-shape Boolean mask as observed_mask (required in training with 0 < p < 1)
  invalid_input:
  - malformed record, probability outside the closed unit interval, nonboolean options, wrong mask dtype or shape, or unrepresentable physical input value
  unsupported:
  - stochastic training forward without the returned mask, native forward with train None, in-place operation, special values, signed-zero distinctions, empty dimensions, unselected ranks, or integer or complex floating inputs
mutation_requirements:
- {id: RN2.M1, misreading: evaluation forward still applies inverse keep-probability scaling, witnesses: [RN2.E1]}
- {id: RN2.M2, misreading: training p=1 returns the input instead of zeros, witnesses: [RN2.E4]}
- {id: RN2.M3, misreading: backward omits scale, witnesses: [RN2.E12]}
- {id: RN2.M4, misreading: backward uses the complement of the mask, witnesses: [RN2.E13]}
- {id: RN2.M5, misreading: backward adds scale instead of multiplying by it, witnesses: [RN2.E12]}
- {id: RN3.M1, misreading: native dropout scales kept elements by (1 - p) instead of 1/(1 - p), witnesses: [RN3.E1]}
- {id: RN3.M2, misreading: native dropout applies the mask but drops the scaling, witnesses: [RN3.E1]}
- {id: RN3.M3, misreading: native dropout applies the scaling but drops the mask, witnesses: [RN3.E1]}
- {id: RN3.M4, misreading: native dropout keeps the elements where the mask is false, witnesses: [RN3.E2]}
- {id: RN3.M5, misreading: native dropout keeps the 1/(1 - p) scaling in evaluation mode, witnesses: [RN3.E4]}
- {id: RN3.M6, misreading: native dropout with p = 1 returns the input, witnesses: [RN3.E5]}
- {id: RN3.M7, misreading: native dropout treats train = None as evaluation, witnesses: [RN3.E11]}
- {id: RN3.M8, misreading: the returned mask marks dropped elements (evaluation returns an all-false mask), witnesses: [RN3.E4]}
nonclaims:
- No value ground truth independent of the returned mask is claimed for training forward with 0<p<1. Its output law requires a separate statistical test, and a tested kernel's realized mask is not an independent reference for itself; native_forward_given_mask uses it only as conditioning input.
- native_forward_given_mask checks only that the returned output agrees with the returned mask and the documented scaling. It does not certify the mask: its randomness, independence, keep probability (the keep_fraction reading is diagnostic only). In the conditioned case the mask position only checks that the binding returned the observed mask (RN3.MASK_POSITION).
- No result is certified for random-number generation, in-place or feature dropout, fused attention dropout, gradients with respect to probability, special values, empty tensors, aliasing or device placement.
changes:
- date: '2026-10-21'
  change: >-
    Independent review fixes: Boolean mask observations must hold real Booleans; RN2.SCHEMA and RN2.C5 restated for
    three profiles (RN2.SCHEMA returned to drafted); p outside [0, 1] invalid on the documentation basis (RN3.SCALING).
  trigger: reviews/2026-10-20/A2_package_E_review.md (RN-1, RN-2, RN-3).
- date: '2026-10-20'
  change: >-
    Add profile native_forward_given_mask for aten.native_dropout with the returned mask as reference input
    observed_mask, decisions RN3.*, clauses RN3.C1-C4 (mask position compared in the numeric 1/0 encoding), examples RN3.E1-E15, mutants RN3.M1-M8 and the diagnostic reading
    keep_fraction; add aten.native_dropout to covers. Existing profiles are unchanged. Review status returned to
    drafted and implementation status to pending.
  trigger: >-
    Path A closure plan item G8: recorded native_dropout calls (bert-tiny, gpt2; f32 / bf16; p 0.1; train True) had
    no covering profile. The earlier concern that a returned mask is not an independent reference is addressed by
    claiming only output-mask consistency (RN3.CONDITIONED).
- date: '2026-10-19'
  change: >-
    Replace the conditioned-random draft with two reviewed deterministic profiles: forward boundary cases independent of
    a random stream, and native backward with an explicit mask. Preserve the former contract and adapter under
    contracts/draft.
  trigger: >-
    The former adapter accepted a synthetic keep keyword absent from the selected ATen schemas. The current runtime
    binding cannot use a returned mask as a task input, and doing so would not independently validate that mask.
