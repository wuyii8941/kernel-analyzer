- {id: RN3.E10, profile: native_forward_given_mask, clauses: [RN3.C3], input: {op: aten.native_dropout, args: [{t: f32, v: [2, 4]}, '3/2', true], kwargs: {observed_mask: {t: b8, v: [true, true]}}}, expected: {outcome: invalid_input}}
