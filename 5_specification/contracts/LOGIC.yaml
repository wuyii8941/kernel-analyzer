schema_version: '1.2'
id: LOGIC
role: ATEN_LOGIC
title: Common finite floating and boolean comparisons, masks and truth reductions
review:
  status: reviewed_for_implementation
  author: Claude (original broad draft) and Codex (physical common-operation revision), 2026-10-18
  date: '2026-10-18'
  reviewer: Codex source, schema, domain and complete-output review with separate Python, NumPy and PyTorch checks
  scope: Selected functional comparisons, logical and boolean bitwise operations, truth reductions and IEEE isnan
activation:
  implementation_status: validated
  implementation_evidence: evidence/logic_implementation.md
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, reviewed_contract_and_adapter_match_current]
covers: [aten.eq, aten.ne, aten.lt, aten.le, aten.gt, aten.ge, aten.logical_and, aten.logical_or, aten.logical_not,
  aten.bitwise_and, aten.bitwise_or, aten.bitwise_not, aten.any, aten.all, aten.isnan]
profiles:
  real:
    meaning: >-
      Exact boolean results for selected functional operations on physical finite f16, bf16, f32, f64 and boolean
      tensors. Floating values and scalar comparison operands must be exactly representable in the declared tensor
      dtype. Mixed tensor dtypes and integer tensors are outside this profile.
    task_choice_required: false
  ieee_values:
    meaning: >-
      Exact isnan classification for physical f16, bf16, f32 or f64 elements. Finite values, positive and negative
      infinity and NaN are accepted; NaN payload and signalling state are not observed.
    task_choice_required: false
outputs:
  out:
    shape: The complete boolean tensor at the broadcast shape, input shape, or selected reduction shape.
    kind: boolean
    guarantee: exact
comparison:
  input_binding: >-
    Tensor records describe physical stored values. Finite floating values must be exactly representable in the
    declared dtype; boolean records contain only literal booleans.
  complete_output: >-
    check_output requires one complete boolean tensor record with dtype, shape and every coordinate, including empty
    results and scalar tensors.
  equality: Exact boolean equality with no tolerance.
  test_evidence: Independent Python and NumPy truth/coordinate calculations plus PyTorch 2.10 dtype, shape and value checks.
  error_handling: Malformed schemas, shapes, dimensions and boolean records are invalid_input; unreviewed dtypes, mixed dtypes and overloads are unsupported.
decisions:
- id: LG.SCHEMA
  status: reviewed
  statement: >-
    Comparisons select the functional Tensor/Tensor or Tensor/Scalar overload. Logical operations select functional
    tensor overloads. Boolean bitwise operations select functional tensor overloads. any/all select either the
    all-elements form or one integer dimension with optional keepdim. isnan takes one tensor. Out, in-place, named
    dimension, dimension-list and other overloads are outside these profiles.
  basis: [TS_NATIVE_FUNCTIONS.LOGIC_SCHEMAS]
- id: LG.PHYSICAL
  status: reviewed
  statement: >-
    The real profile accepts finite physical f16/bf16/f32/f64 and boolean records. A scalar comparison operand must
    be exactly representable in the first tensor's floating dtype or be a literal boolean for a boolean tensor.
    Tensor/Tensor operations require the same dtype.
  basis: [T_TENSOR_ATTR.PROMOTION, TS_NATIVE_FUNCTIONS.LOGIC_SCHEMAS]
- id: LG.COMPARE
  status: reviewed
  statement: eq, ne, lt, le, gt and ge compare corresponding broadcast elements and return a boolean tensor.
  basis: [T_EQ.DEF, T_NE.DEF, T_LT.DEF, T_LE.DEF, T_GT.DEF, T_GE.DEF]
- id: LG.TRUTH
  status: reviewed
  statement: Logical operations treat zero as false and every nonzero finite floating value as true; boolean values retain their truth value.
  basis: [T_LAND.DEF, T_LOR.DEF, T_LNOT.DEF]
- id: LG.BOOL_BITWISE
  status: reviewed
  statement: On boolean tensors, bitwise and/or/not have the same values as logical and/or/not.
  basis: [T_BAND.DEF, T_BOR.DEF, T_BNOT.DEF]
- id: LG.EMPTY
  status: reviewed
  statement: any over an empty selected set is false and all over an empty selected set is true.
  basis: [T_ANY.DEF, T_ALL.DEF]
- id: LG.REDUCE
  status: reviewed
  statement: >-
    any/all either reduce every coordinate to a scalar boolean or reduce one integer dimension. keepdim retains the
    selected dimension with size one. Their values are existential and universal truth over the selected coordinates.
  basis: [T_ANY.DEF, T_ALL.DEF, LG.EMPTY]
- id: LG.ISNAN
  status: reviewed
  statement: isnan is true exactly for NaN elements and false for finite values and both infinities.
  basis: [T_ISNAN.DEF]
clauses:
- {id: LG.C1, basis: [LG.SCHEMA, LG.PHYSICAL, LG.COMPARE], statement: 'selected comparisons broadcast physical same-dtype tensors or compare a tensor with an exactly representable scalar and return every boolean coordinate', observes: [out], evidence_kind: definition}
- {id: LG.C2, basis: [LG.SCHEMA, LG.PHYSICAL, LG.TRUTH], statement: 'logical and/or/not use zero=false and nonzero=true and return every boolean coordinate', observes: [out], evidence_kind: definition}
- {id: LG.C3, basis: [LG.SCHEMA, LG.PHYSICAL, LG.BOOL_BITWISE], statement: 'selected bitwise operations act only on boolean tensors and return the corresponding boolean operation', observes: [out], evidence_kind: definition}
- {id: LG.C4, basis: [LG.SCHEMA, LG.PHYSICAL, LG.REDUCE], statement: 'any/all return the complete all-elements or one-dimension truth reduction, including empty identities and keepdim shape', observes: [out], evidence_kind: definition}
- {id: LG.C5, basis: [LG.SCHEMA, LG.ISNAN], statement: 'the ieee_values profile classifies every physical floating input coordinate as NaN or not NaN', observes: [out], evidence_kind: definition}
- {id: LG.C6, basis: [LG.SCHEMA, LG.PHYSICAL], statement: 'unselected dtypes, mixed dtypes, special values outside isnan and unselected overloads do not receive a reference answer', observes: [out], evidence_kind: definition}
examples:
- {id: LG.E1, profile: real, clauses: [LG.C1], input: {op: aten.eq, args: [{t: f32, v: [1, 2, '1/2']}, {t: f32, v: [1, 3, '1/2']}]}, expected: {outcome: value, fields: {out: [true, false, true]}}}
- {id: LG.E2, profile: real, clauses: [LG.C1], input: {op: aten.ne, args: [{t: bf16, v: [0, 2]}, 2]}, expected: {outcome: value, fields: {out: [true, false]}}}
- {id: LG.E3, profile: real, clauses: [LG.C1], input: {op: aten.lt, args: [{t: f16, v: [-1, 2, 3]}, 2]}, expected: {outcome: value, fields: {out: [true, false, false]}}}
- {id: LG.E4, profile: real, clauses: [LG.C1], input: {op: aten.le, args: [{t: b8, v: [false, true]}, {t: b8, v: [false, false]}]}, expected: {outcome: value, fields: {out: [true, false]}}}
- {id: LG.E5, profile: real, clauses: [LG.C1], input: {op: aten.gt, args: [{t: f32, v: [[1], [-1]]}, {t: f32, v: [0, 1]}]}, expected: {outcome: value, fields: {out: [[true, false], [false, false]]}}}
- {id: LG.E6, profile: real, clauses: [LG.C1], input: {op: aten.ge, args: [{t: f64, v: ['1/2', 1]}, '1/2']}, expected: {outcome: value, fields: {out: [true, true]}}}
- {id: LG.E7, profile: real, clauses: [LG.C6], input: {op: aten.eq, args: [{t: f32, v: ['1/3']}, 0]}, expected: {outcome: invalid_input}}
- {id: LG.E8, profile: real, clauses: [LG.C6], input: {op: aten.eq, args: [{t: f16, v: [1]}, {t: f32, v: [1]}]}, expected: {outcome: unsupported}}
- {id: LG.E9, profile: real, clauses: [LG.C6], input: {op: aten.lt, args: [{t: f32, v: [-inf]}, 0]}, expected: {outcome: unsupported}}
- {id: LG.E10, profile: real, clauses: [LG.C2], input: {op: aten.logical_and, args: [{t: f32, v: [0, -1, 2]}, {t: f32, v: [1, 1, 0]}]}, expected: {outcome: value, fields: {out: [false, true, false]}}}
- {id: LG.E11, profile: real, clauses: [LG.C2], input: {op: aten.logical_or, args: [{t: b8, v: [false, false, true]}, {t: b8, v: [false, true, false]}]}, expected: {outcome: value, fields: {out: [false, true, true]}}}
- {id: LG.E12, profile: real, clauses: [LG.C2], input: {op: aten.logical_not, args: [{t: bf16, v: [0, 3, -2]}]}, expected: {outcome: value, fields: {out: [true, false, false]}}}
- {id: LG.E13, profile: real, clauses: [LG.C6], input: {op: aten.logical_and, args: [{t: f16, v: [1]}, {t: f32, v: [1]}]}, expected: {outcome: unsupported}}
- {id: LG.E14, profile: real, clauses: [LG.C3], input: {op: aten.bitwise_and, args: [{t: b8, v: [true, true, false]}, {t: b8, v: [true, false, true]}]}, expected: {outcome: value, fields: {out: [true, false, false]}}}
- {id: LG.E15, profile: real, clauses: [LG.C3], input: {op: aten.bitwise_or, args: [{t: b8, v: [[false], [true]]}, {t: b8, v: [false, true]}]}, expected: {outcome: value, fields: {out: [[false, true], [true, true]]}}}
- {id: LG.E16, profile: real, clauses: [LG.C3], input: {op: aten.bitwise_not, args: [{t: b8, v: [true, false]}]}, expected: {outcome: value, fields: {out: [false, true]}}}
- {id: LG.E17, profile: real, clauses: [LG.C6], input: {op: aten.bitwise_and, args: [{t: i64, v: [1]}, {t: i64, v: [3]}]}, expected: {outcome: unsupported}}
- {id: LG.E18, profile: real, clauses: [LG.C4], input: {op: aten.any, args: [{t: f32, v: [[0, 0], [0, '1/2']]}, 1]}, expected: {outcome: value, fields: {out: [false, true]}}}
- {id: LG.E19, profile: real, clauses: [LG.C4], input: {op: aten.all, args: [{t: b8, v: [[true, false], [true, true]]}, 1, true]}, expected: {outcome: value, fields: {out: [[false], [true]]}}}
- {id: LG.E20, profile: real, clauses: [LG.C4], input: {op: aten.all, args: [{t: b8, v: []}]}, expected: {outcome: value, fields: {out: true}}}
- {id: LG.E21, profile: real, clauses: [LG.C4], input: {op: aten.any, args: [{t: b8, v: []}]}, expected: {outcome: value, fields: {out: false}}}
- {id: LG.E22, profile: real, clauses: [LG.C4], input: {op: aten.any, args: [{t: f64, v: [[0, 0], [0, 4]]}]}, expected: {outcome: value, fields: {out: true}}}
- {id: LG.E23, profile: real, clauses: [LG.C6], input: {op: aten.any, args: [{t: f32, v: [0, 1]}, 1]}, expected: {outcome: invalid_input}}
- {id: LG.E24, profile: real, clauses: [LG.C6], input: {op: aten.all, args: [{t: f32, v: [1]}, 0, 1]}, expected: {outcome: invalid_input}}
- {id: LG.E25, profile: ieee_values, clauses: [LG.C5], input: {op: aten.isnan, args: [{t: f32, v: [nan, 1, inf, -inf, 0]}]}, expected: {outcome: value, fields: {out: [true, false, false, false, false]}}}
- {id: LG.E26, profile: ieee_values, clauses: [LG.C5], input: {op: aten.isnan, args: [{t: bf16, v: [[nan], ['1/2']]}]}, expected: {outcome: value, fields: {out: [[true], [false]]}}}
- {id: LG.E27, profile: ieee_values, clauses: [LG.C6], input: {op: aten.isnan, args: [{t: b8, v: [false]}]}, expected: {outcome: unsupported}}
- {id: LG.E28, profile: real, clauses: [LG.C6], input: {op: aten.isnan, args: [{t: f32, v: [nan]}]}, expected: {outcome: unsupported}}
- {id: LG.E29, profile: ieee_values, clauses: [LG.C6], input: {op: aten.eq, args: [{t: f32, v: [1]}, 1]}, expected: {outcome: unsupported}}
- {id: LG.E30, profile: real, clauses: [LG.C6], input: {op: aten.eq, args: [{t: f32, v: [1]}, 1], kwargs: {out: {t: b8, v: [true]}}}, expected: {outcome: unsupported}}
- {id: LG.E31, profile: real, clauses: [LG.C6], input: {op: aten.eq, args: [1, {t: f32, v: [1]}]}, expected: {outcome: invalid_input}}
signature:
  inputs: ['op and args matching LG.SCHEMA', 'physical finite floating or literal boolean tensor records; isnan additionally permits infinities and NaN']
  pre_state: [all input tensors are unchanged]
  post_state: [one complete boolean result tensor]
  observation_unit: every boolean output coordinate together with dtype and shape
domain:
  valid: [physical finite f16/bf16/f32/f64 and boolean tensors in real; physical f16/bf16/f32/f64 IEEE values in ieee_values; selected schemas]
  invalid_input: [unrepresentable finite floating record; malformed boolean record; non-broadcastable shapes; invalid dimension or keepdim; malformed call]
  unsupported: [integer, float8 or complex tensors; mixed tensor dtypes; infinities or NaN outside isnan; integer bitwise tasks; out, in-place, named-dimension, dimension-list and unselected overloads]
mutation_requirements:
- {id: LG.M1, misreading: lt is implemented as le, witnesses: [LG.E3]}
- {id: LG.M2, misreading: ne is implemented as eq, witnesses: [LG.E2]}
- {id: LG.M3, misreading: negative nonzero values are treated as false, witnesses: [LG.E10]}
- {id: LG.M4, misreading: boolean bitwise_not returns its input unchanged, witnesses: [LG.E16]}
- {id: LG.M5, misreading: any of an empty set is true, witnesses: [LG.E21]}
- {id: LG.M6, misreading: all of an empty set is false, witnesses: [LG.E20]}
- {id: LG.M7, misreading: any with a dimension reduces the whole tensor, witnesses: [LG.E18]}
- {id: LG.M8, misreading: isnan is also true for infinities, witnesses: [LG.E25]}
- {id: LG.M9, misreading: ge is implemented as gt, witnesses: [LG.E6]}
nonclaims:
- Integer and float8 comparison or bitwise semantics, mixed-dtype promotion and complex values are not certified.
- NaN comparisons, NaN payloads, signalling NaNs, storage, device placement, gradients and state effects are not certified.
changes:
- date: '2026-10-18'
  change: >-
    Replace the active broad exact-real and integer draft with physical finite floating and boolean common-operation
    profiles, strict schemas and complete boolean output comparison. Preserve the former contract under contracts/draft.
  trigger: >-
    The former profile admitted unrepresentable values such as mathematical 1/3 under f32, mixed integer and floating
    tasks, infinities and integer bitwise rules without fixed-width validation, and had no complete output checker.
