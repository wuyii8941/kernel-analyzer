signature:
  inputs:
  - logits [N,C]
  - target [N] or [N,C] selected by profile
  - weights [C] or None
  - ignore_index integer for index profiles
  - eps
  - reduction sum/mean/none
  - upstream scalar for sum/mean; [N] for none
  pre_state: []
  post_state: []
  observation_unit: loss and complete VJP, not loss-only
domain:
  valid:
  - N >= 1, C >= 2 in this pilot; finite rectangular rational logits
  - index targets are integers in [0,C) or equal to the declared ignore_index
  - weights absent or finite nonnegative [C]; eps in [0,1]
  - probability rows finite, nonnegative, sum to one; probability profile eps=0
  - upstream has the exact reduction-dependent shape
  unsupported:
  - C=1 is an API-valid case outside this pilot, not an API violation
  - unbatched and higher-rank flattening until mapping validated
  - negative class weights for this pilot
  - probability-target smoothing
  - deprecated size_average/reduce overrides
  - unselected R_B or R_C diagnostic conventions
  domain_undefined:
  - mean normalization mass D=0, including but not limited to all-ignored rows
  invalid_input:
  - ragged shapes or nonmatching weights
  - nonintegral or out-of-range nonignored index
  - invalid probability row
  - invalid upstream shape
  - nonfinite logits in this finite-real profile
mutation_requirements:
- id: CE.M1
  misreading: mean by N instead of target-class weight mass
  witnesses:
  - CE.E3
- id: CE.M2
  misreading: mean by nonignored row count
  witnesses:
  - CE.E3
- id: CE.M3
  misreading: smoothing over C-1 alternatives
  witnesses:
  - CE.E4
- id: CE.M4
  misreading: ignored rows counted in denominator
  witnesses:
  - CE.E3
- id: CE.M5
  misreading: loss correct but gradient all zero
  witnesses:
  - CE.E1
  - CE.E2
- id: CE.M6
  misreading: hard-coded ignore_index
  witnesses:
  - CE.E7
- id: CE.M7
  misreading: none output collapsed to scalar, dropped row, or upstream ignored
  witnesses:
  - CE.E8
- id: CE.M8
  misreading: probability-target mean by sum of target weights
  witnesses:
  - CE.E11
nonclaims:
- R_A versus diagnostic R_B alone is not evidence that an implementation violates explicit PyTorch wording.
- These formulas do not choose a task-quality delta.
- An unimplemented profile is unsupported, not an illegal API input.
