schema_version: '1.1'
id: CE
role: CE
title: Cross entropy with explicit target, reduction and cotangent profiles
review:
  status: reviewed_for_implementation
  date: '2026-10-15'
  reviewer: ChatGPT review of uploaded contract draft
  input_package_sha256: a9a2a9123c2f39f5f76d1c82d61d70869bc0ec8236cce16d978f9556293d15a3
  scope: Contract content and explicit profiles, not all-domain oracle certification
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires:
  - source_profile_matched
  - input_contract_validated
  - all_required_outputs_bound
  - reference_semantics_and_guarantees_validated
  - no_unresolved_contradiction
  - contract_and_implementation_hashes_bound
profiles:
  index_unsmoothed:
    meaning: Class-index target, eps=0; arbitrary declared ignore_index.
    task_choice_required: false
  index_smoothing_unweighted:
    meaning: Class-index target, weights absent, 0<=eps<=1.
    task_choice_required: false
  index_smoothing_R_A:
    meaning: Per-class weighted smoothing; selected R_A interpretation; not a universally forced reading of incomplete
      prose.
    task_choice_required: true
  probability_unsmoothed:
    meaning: Valid probability rows, eps=0; no ignored probability rows.
    task_choice_required: false
outputs:
  loss:
    shape: scalar for sum/mean; [N] for none
    guarantee: rigorous_enclosure
  gradient:
    shape: '[N,C] VJP against explicit upstream'
    guarantee: rigorous_enclosure
comparison:
  input_binding: All arithmetic values are the exactly received rational values; published decimal constants are
    a separate interface query, not silently substituted.
  quality: No default semantic tolerance is inferred from these examples. Numerical resolution and application delta
    are separate declarations.
  test_evidence: Exact rational equality or certified relation when available; numerical enclosure compatibility
    is not a proof of equality.
  error_handling: No dropped outputs, silently truncated lists, coerced counts, or exceptions converted by message
    text.
decisions:
- id: CE.R_A
  status: needs_binding
  statement: Use per-class weights a_nc=w_c*((1-eps)onehot(y)_c+eps/C) for this selected profile. Requires explicit
    profile choice; R_B remains a diagnostic alternative, not automatic acceptance of every implementation.
  basis:
  - PCE.SMOOTH
  - PCE.PROB
- id: CE.FINITE_TARGET
  status: reviewed
  statement: When mean denominator is zero, finite-real loss and gradient are undefined. Does not impose a NaN/zero
    device-output convention.
  basis:
  - PCE.REDUCE
- id: CE.VJP
  status: reviewed
  statement: Gradient means VJP of the selected loss against the explicitly supplied upstream. This follows by differentiating
    the declared loss on finite logits.
  basis:
  - PCE.INDEX
  - PCE.PROB
  - PCE.REDUCE
clauses:
- id: CE.C1
  basis:
  - PCE.INDEX
  statement: p_nc=exp(x_nc)/sum_j exp(x_nj); unsmoothed row ell_n=-w_y*log(p_ny); ignored row ell=0
  observes:
  - loss
  evidence_kind: definition
- id: CE.C2
  basis:
  - PCE.IGNORE
  - PCE.REDUCE
  statement: Ignored index rows contribute zero loss, zero gradient, zero class-weight mass; ignore_index is an
    input, not hard-coded -100
  observes:
  - loss
  - gradient
  evidence_kind: definition
- id: CE.C3
  basis:
  - PCE.REDUCE
  statement: Index mean D=sum_nonignored w_y; sum and none use no normalization; weights default to one
  observes:
  - loss
  - gradient
  evidence_kind: definition
- id: CE.C4
  basis:
  - PCE.SMOOTH
  - CE.R_A
  statement: For selected R_A, a_nc=w_c*((1-eps)onehot(y)_c+eps/C); ell_n=-sum_c a_nc*log(p_nc)
  observes:
  - loss
  - gradient
  evidence_kind: definition
- id: CE.C5
  basis:
  - CE.FINITE_TARGET
  statement: D=0 for mean yields domain_undefined, not an allowed_set and not a required NaN; all-ignored sum/none
    return zero with zero VJP
  observes:
  - loss
  - gradient
  evidence_kind: definition
- id: CE.C6
  basis:
  - CE.VJP
  statement: A_n=sum_c a_nc; grad_nc=u_n*(A_n*p_nc-a_nc) for sum/none; divide additionally by D for mean. For scalar
    reduction the single upstream is reused on each row.
  observes:
  - gradient
  evidence_kind: derived
- id: CE.C7
  basis:
  - PCE.PROB
  - PCE.SHAPE
  statement: 'Probability profile: a_nc=w_c*y_nc; mean D=N (not class-weight mass); target rows match logits shape'
  observes:
  - loss
  - gradient
  evidence_kind: definition
examples:
- id: CE.E1
  profile: index_unsmoothed
  clauses:
  - CE.C1
  - CE.C6
  input:
    logits:
    - - 0
      - 0
    target:
    - 0
    weights: null
    eps: 0
    ignore_index: -100
    reduction: sum
    upstream: 1
