nonclaims:
- Floating-point rounding of a device kernel is the numerical question (K - G); this contract states the real target.
- Returned indices are compared as coordinates within a plane; the flat-offset convention of the device output is a
  binding question of phase 4.
- 'Adaptive max pooling windows rest on a reference program (POOL.ADAPTIVE): claims there are "consistent with the
  reference program".'
- NaN results under nan_prop are a project diagnostic profile (POOL-A3), not documented PyTorch behaviour.
