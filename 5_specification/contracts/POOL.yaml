signature:
  inputs: ['op: avg_pool{1,2,3}d | max_pool{1,2,3}d | adaptive_max_pool1d', 'x: nested list (planes..., spatial...)',
    'kernel, stride, padding, dilation, ceil_mode, count_include_pad, divisor_override, output_size as documented',
    'upstream: cotangent with the output shape']
  pre_state: []
  post_state: []
  observation_unit: one pooling call (forward value, maximiser sets, VJP)
domain:
  valid: [rational or infinite inputs; kernel, stride, dilation >= 1; 0 <= padding <= half of the effective kernel; output
      size >= 1]
  domain_undefined: [NaN input under profile real; NaN input to average pooling; inf - inf inside an average window]
  invalid_input: [padding above half of the effective kernel, empty output, divisor_override for avg_pool1d, upstream
      shape different from the output shape, malformed parameters]
  unsupported: [return-index conventions (flat offsets) - the contract states coordinates; LPPool, fractional and
      adaptive average pooling; integer dtypes]
