schema_version: '1.1'
id: RANKMEAN
role: RANKMEAN
title: Equal-valid-token objective over declared participants
review:
  status: reviewed_for_implementation
  date: '2026-10-15'
  reviewer: ChatGPT review of uploaded contract draft
  input_package_sha256: a9a2a9123c2f39f5f76d1c82d61d70869bc0ec8236cce16d978f9556293d15a3
  scope: Contract content and explicit profiles, not all-domain oracle certification
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires:
  - source_profile_matched
  - input_contract_validated
  - all_required_outputs_bound
  - reference_semantics_and_guarantees_validated
  - no_unresolved_contradiction
  - contract_and_implementation_hashes_bound
profiles:
  base:
    meaning: 'One declared task: L=sum per-rank token loss sums / sum valid-token counts.'
    task_choice_required: true
outputs:
  loss:
    shape: scalar
    guarantee: exact
comparison:
  input_binding: All arithmetic values are the exactly received rational values; published decimal constants are
    a separate interface query, not silently substituted.
  quality: No default semantic tolerance is inferred from these examples. Numerical resolution and application delta
    are separate declarations.
  test_evidence: Exact rational equality or certified relation when available; numerical enclosure compatibility
    is not a proof of equality.
  error_handling: No dropped outputs, silently truncated lists, coerced counts, or exceptions converted by message
    text.
decisions:
- id: RM.TASK
  status: needs_binding
  statement: Task owner selects equal-valid-token normalization. HF article is supporting motivation only. No default
    verdict against a sequence-averaged task.
  basis:
  - HF.TOKEN_MEAN
- id: RM.ZERO
  status: reviewed
  statement: No valid tokens means the finite-real average is undefined; do not demand any specific NaN/zero device
    convention.
  basis:
  - RM.TASK
clauses:
- id: RM.C1
  basis:
  - RM.TASK
  statement: N=sum_r n_r; if N>0, L=(sum_r S_r)/N
  observes:
  - loss
  evidence_kind: definition
- id: RM.C2
  basis:
  - RM.ZERO
  statement: N=0 yields domain_undefined; an individual empty rank contributes exact zero to numerator and denominator
  observes:
  - loss
  evidence_kind: definition
- id: RM.C3
  basis:
  - RM.TASK
  statement: Participant and contribution provenance is required; permutations or repartitions preserve L only when
    sums, counts and membership are transformed consistently
  observes:
  - loss
  evidence_kind: derived
