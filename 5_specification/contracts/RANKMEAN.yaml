signature:
  inputs:
  - 'S [R]: sums of per-token losses, not means'
  - 'n [R]: exact nonnegative integer token counts'
  - participant IDs [R], or an immutable binding record establishing them
  pre_state: []
  post_state: []
  observation_unit: aggregation only; not an entire distributed training-step equivalence claim
domain:
  valid:
  - R>=1; len(S)==len(n)==len(participant_ids); IDs unique
  - S finite rational; n integral and nonnegative (do not cast floats to int)
  - n_r=0 implies S_r=0
  - same valid-token set, equal token objective weights, and each contribution counted once, established by binding
    or declared as an unverified precondition
  domain_undefined:
  - sum(n)==0, with all S zero
  invalid_input:
  - shape mismatch
  - negative or fractional counts
  - nonzero S paired with zero n
  - duplicate participant IDs
  unsupported:
  - sequence-equal objectives
  - weighted means normalized by weight mass rather than token count
  - changing token membership or per-token losses across compared partitions
mutation_requirements:
- id: RM.M1
  misreading: mean of rank-local means
  witnesses:
  - RM.E1
- id: RM.M2
  misreading: sum rank-local means
  witnesses:
  - RM.E1
  - RM.E2
- id: RM.M3
  misreading: divide by rank or sequence count
  witnesses:
  - RM.E1
- id: RM.M4
  misreading: silently cast fractional n to int
  witnesses:
  - RM.N2
- id: RM.M5
  misreading: ignore mismatched count array
  witnesses:
  - RM.N1
composition_binding:
- A local CE mean is not S_r. Use its loss sum or undo the exact declared local normalization with provenance.
- PyTorch class-weighted CE mean uses weight mass, not token count; choose the intended denominator explicitly.
- This contract neither validates NCCL semantics nor proves BatchNorm/microbatch equivalence.
nonclaims:
- Task-selection still required per runtime use, independent of code correctness.
- Empty/unsupported/invalid are distinct outcomes; no finiteness filtering or drop-rank policy may be introduced
  silently.
