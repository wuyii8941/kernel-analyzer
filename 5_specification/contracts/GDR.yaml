- id: GD.E21
  profile: fla_chunk
  clauses: [GD.C1, GD.C10]
  input: {q: [[[[1]]]], k: [[[[1]]]], v: [[[[3]]]], g: [[[0]]], beta: [[[1]]],
    A_log: [17], dt_bias: [2], output_final_state: true}
  expected: {outcome: value, fields: {out: {o: [[[[3]]]], final_state: [[[[3]]]]}}}
  readings: {chunked: {outcome: value, fields: {out: {o: [[[[3]]]], final_state: [[[[3]]]]}}}}
  note: The gate is disabled by default; its optional parameters are accepted but inactive in the retained FLA source.
readings:
  chunked:
    meaning: Diagnostic evaluation by the chunkwise WY / UT-transform algorithm with the call's chunk size; it must give the
      same values as the recurrence (GD.C11).
    basis: [GDN_PAPER.CHUNK, FLA_GDR_NAIVE.CHUNK]
signature:
  inputs:
  - 'q, k [B][T][H][K]; v [B][T][HV][V]; g, beta [B][T][HV]'
  - 'scale (optional); initial_state [N][HV][K][V] or [N][HV][V][K] (optional); output_final_state, state_v_first,
    use_qk_l2norm_in_kernel, use_beta_sigmoid_in_kernel, allow_neg_eigval, use_gate_in_kernel (booleans)'
  - 'A_log [HV], dt_bias [HV] (with use_gate_in_kernel); cu_seqlens [N+1]; chunk_size'
  pre_state: [initial_state]
  post_state: [final_state]
  observation_unit: the outputs of one call
domain:
  valid: ['rational inputs of consistent shapes, HV divisible by H, chunk_size 16, 32 or 64']
  domain_undefined: ['paper_block: a zero q or k vector']
  invalid_input: [inconsistent shapes, HV not divisible by H, allow_neg_eigval without the sigmoid option, cu_seqlens with
      batch > 1 or not ending at T, A_log missing with use_gate_in_kernel, other chunk sizes]
  unsupported: [context parallelism (cp_context), FLA options passed under paper_block]
mutation_requirements:
- {id: GD.M1, misreading: 'gate applied after the delta write (h = alpha((I - beta k k^T) h + beta k v^T))', witnesses: [GD.E2]}
- {id: GD.M2, misreading: 'delta correction computed on the undecayed state (u = beta (v - h_{t-1}^T k))', witnesses: [GD.E2]}
