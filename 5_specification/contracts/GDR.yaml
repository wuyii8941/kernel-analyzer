schema_version: '1.2'
id: GDR
role: LINEAR_ATTENTION_RECURRENCE
title: Gated delta rule recurrence (Gated DeltaNet) as computed by FLA chunk_gated_delta_rule, real-number semantics
review:
  status: drafted
  author: Claude (spec v3 author, group D2_special), 2026-10-17
  date: '2026-10-17'
  scope: Forward outputs (o and the optional final state) of one chunk_gated_delta_rule call; awaiting a review by someone
    who did not write it
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, reviewed_contract_and_adapter_match_current]
covers:
- fla.ops.gated_delta_rule.chunk_gated_delta_rule (forward; options scale, initial_state, output_final_state,
  use_qk_l2norm_in_kernel, use_beta_sigmoid_in_kernel, allow_neg_eigval, use_gate_in_kernel with A_log / dt_bias,
  state_v_first, cu_seqlens, chunk_size; no context parallelism)
- the gated delta rule of Yang, Kautz, Hatamizadeh (arXiv 2412.06464), Eq. 10
profiles:
  fla_chunk:
    meaning: 'The FLA API: per value head hv (query/key head hv // (HV / H)) and sequence, h_t = alpha_t h_{t-1} + k_t u_t^T
      with u_t = beta_t (v_t - (alpha_t h_{t-1})^T k_t) and o_t = scale h_t^T q_t; alpha_t = exp(g_t) (g in log space) or the
      in-kernel gate; beta given or sigmoid(beta) (times 2 with allow_neg_eigval); q, k optionally L2-normalised with eps
      1e-6; scale default 1/sqrt(K).'
    task_choice_required: false
  paper_block:
    meaning: 'Only the normalised recurrence subcomputation of Eq. 10: q and k L2-normalised exactly (no eps),
      o_t = S_t q_t without a scale factor, alpha_t = exp(g_t), beta given. The historical profile name paper_block
      does not denote the complete Gated DeltaNet layer: projections, short convolution, SiLU, output normalisation,
      output gating and output projection are outside this contract. Exact normalisation without eps and unit scale
      are explicit task choices; a FLA call requires its own option binding.'
    task_choice_required: true
outputs:
  out:
    shape: '{o: [B][T][HV][V]} plus final_state [N][HV][K][V] ([N][HV][V][K] with state_v_first) when output_final_state'
    guarantee: rigorous_enclosure
comparison:
  input_binding: q, k, v, g, beta, scale, A_log, dt_bias and the initial state are the exact values received (a binary float
    is its exact rational value).
  quality: No tolerance. Exact results compare exactly; exp, sqrt, softplus and sigmoid give rigorous enclosures.
  test_evidence: Exact rational equality or containment of the expected formula's enclosure.
  error_handling: Shape and option violations documented or checked by the FLA entry point are invalid_input; a zero vector
    under the paper's exact normalisation is domain_undefined; options outside a profile are unsupported.
decisions:
- id: GD.VERSION
  status: drafted
  statement: The general-round case records the FLA version only as 'main'. The contract cites fla-org/flash-linear-attention
    at 8024667 (the last main commit before the case was added on 2026-10-05). The clauses used (docstring options, default
    scale, naive recurrence, gate formula, l2norm eps, GVA head map) are the ones read in that snapshot; a different main
    commit is not assumed to agree.
  basis: [FLA_GDR_CHUNK.SHAPES, FLA_GDR_NAIVE.RECURRENT]
- id: GD.LAYOUT
  status: drafted
  statement: 'The paper writes the state S in R^{dv x dk} (S_t = S_{t-1} alpha_t (I - beta_t k k^T) + beta_t v k^T, o = S q);
    FLA stores h = S^T in [K, V] (or [V, K] with state_v_first). Transposing Eq. 10 gives h_t = alpha_t (I - beta_t k k^T)
    h_{t-1} + beta_t k v^T = alpha_t h_{t-1} + k (beta_t (v - (alpha_t h_{t-1})^T k))^T, which is the naive FLA step (decay
    first, then the delta correction on the decayed state). Both layouts denote the same function; the contract states it
    in FLA''s layout because the observed states are FLA''s.'
  basis: [GDN_PAPER.EQ10, GDN_PAPER.OUT, FLA_GDR_NAIVE.RECURRENT, FLA_GDR_CHUNK.STATE]
- id: GD.SCALE
  status: drafted
  statement: 'The FLA docstring defines the default scale as 1 / sqrt(K) and the code computes K ** -0.5 in binary64. The
    contract takes the real 1 / sqrt(K) (exact for perfect squares, an enclosure otherwise); the binary64 rounding of that
    constant is part of the numerical question. Alternative (the binary64 value as the target) rejected: the docstring states
    the real value and the two differ by less than one binary64 ulp. The v2.5 draft used 1 / sqrt(K) in its recurrent path
    but 1 in its chunked path (review 2026-10-16); here both evaluations take the same default (mutant GD.M4 is that bug).
    The paper has no scale (o_t = S_t q_t): profile paper_block uses 1.'
  basis: [FLA_GDR_CHUNK.SCALE, FLA_GDR_NAIVE.RECURRENT, FLA_GDR_NAIVE.CHUNK, GDN_PAPER.OUT]
- id: GD.EPS
  status: drafted
  statement: With use_qk_l2norm_in_kernel the FLA l2norm divides by sqrt(sum x^2 + eps) with eps = 1e-6 written in the source;
    the contract uses eps = 10^-6 exactly (the decimal constant as written). Its float32 representation inside the kernel
    is numerical. The paper's normalisation has no eps; that reading is profile paper_block, not this option.
  basis: [FLA_L2NORM.FWD, FLA_GDR_CHUNK.L2, GDN_PAPER.BLOCK]
- id: GD.DOMAIN
  status: drafted
  statement: The paper describes alpha_t in (0, 1) and beta_t in (0, 1) (or (0, 2) for negative eigenvalues) as modelling ranges;
    neither FLA nor the paper defines a different result outside them, and the recurrence is defined for every real alpha
    and beta. The contract therefore accepts every rational g and beta and states the recurrence's value; it adds no range
    check that the API does not make.
  basis: [GDN_PAPER.EQ10, GDN_PAPER.BETA, FLA_GDR_CHUNK.GATE_LOG]
- id: GD.CHUNK
  status: drafted
  statement: chunk_size (16, 32 or 64; other values raise ValueError in FLA) only selects the chunked evaluation order. f does
    not depend on it - the paper derives the chunkwise form by expanding the recurrence - so it is used only by the
    diagnostic reading 'chunked', which must agree with the recurrence exactly. Base-2 exponentials with the gate scaled
    by 1/ln 2 (FLA) denote the same alpha_t = exp(g_t).
  basis: [GDN_PAPER.CHUNK, FLA_GDR_CHUNK.CHUNK_SIZE, FLA_GDR_CHUNK.LOG2, FLA_GDR_NAIVE.CHUNK]
- id: GD.PAPER
  status: drafted
  statement: 'The retained Gated DeltaNet paper describes L2-normalised q and k as inputs to Eq. 10, and separately describes
    projection, convolution, activation, output normalisation, gating and output projection in its token mixer block.
    paper_block specifies only the normalised recurrence, with exact L2 normalisation and unit scale explicitly selected;
    it does not specify that complete block. This is separate from the normalising denominator and Z state in the
    Katharopoulos linear-attention algorithm discussed in the A1 review. A zero q or k has no normalised value under
    paper_block (domain_undefined). The tested FLA case uses fla_chunk, not paper_block.'
  basis: [GDN_PAPER.BLOCK, GDN_PAPER.EQ10, GDN_PAPER.OUT]
clauses:
- {id: GD.C1, basis: [GDN_PAPER.EQ10, GD.LAYOUT, FLA_GDR_NAIVE.RECURRENT], statement: 'h_t = alpha_t h_{t-1} + k_t u_t^T,
    u_t = beta_t (v_t - (alpha_t h_{t-1})^T k_t), o_t = scale h_t^T q_t (the output reads the updated state); h_0 = 0 unless
    an initial state is given', observes: [out], evidence_kind: definition}
- {id: GD.C2, basis: [GD.SCALE, FLA_GDR_CHUNK.SCALE], statement: scale defaults to 1/sqrt(K) (the key dimension), observes: [
    out], evidence_kind: definition}
- {id: GD.C3, basis: [FLA_GDR_CHUNK.SHAPES, FLA_CHUNK_O.GVA], statement: 'value head hv uses q and k of head hv // (HV / H);
    HV must be divisible by H', observes: [out], evidence_kind: definition}
- {id: GD.C4, basis: [FLA_GDR_CHUNK.STATE], statement: 'initial_state [N, HV, K, V] starts each sequence; output_final_state
    returns h after the last token of each sequence', observes: [out], evidence_kind: definition}
- {id: GD.C5, basis: [FLA_GDR_CHUNK.STATE], statement: 'state_v_first: initial and final states are stored transposed ([V,
    K]); the computation is unchanged', observes: [out], evidence_kind: definition}
- {id: GD.C6, basis: [FLA_GDR_CHUNK.VARLEN], statement: 'cu_seqlens: batch 1, sequences [cu_i, cu_{i+1}) are independent and
    each starts from its own initial state (or zero)', observes: [out], evidence_kind: definition}
- {id: GD.C7, basis: [FLA_GDR_CHUNK.BETA, GDN_PAPER.BETA], statement: 'use_beta_sigmoid_in_kernel: beta_t = sigmoid(beta),
    times 2 with allow_neg_eigval; allow_neg_eigval without the sigmoid option is invalid', observes: [out], evidence_kind: definition}
- {id: GD.C8, basis: [FLA_GDR_CHUNK.L2, FLA_L2NORM.FWD, GD.EPS], statement: 'use_qk_l2norm_in_kernel: q and k are replaced by
    x / sqrt(sum x^2 + 10^-6)', observes: [out], evidence_kind: definition}
- {id: GD.C9, basis: [FLA_GDR_CHUNK.GATE_LOG, FLA_GDR_GATE.NAIVE, T_SOFTPLUS_F.DEF, T_SOFTPLUS_F.THRESH], statement: 'use_gate_in_kernel:
    log alpha_t = -exp(A_log) softplus(g_t + dt_bias) (torch softplus, threshold 20)', observes: [out], evidence_kind: definition}
- {id: GD.C10, basis: [FLA_GDR_CHUNK.GATE_LOG, FLA_GDR_CHUNK.LOG2, GD.DOMAIN], statement: 'without the in-kernel gate g is in
    log space: alpha_t = exp(g_t); supplied A_log and dt_bias are inactive and do not change the result', observes: [out], evidence_kind: definition}
- {id: GD.C11, basis: [GDN_PAPER.CHUNK, GD.CHUNK], statement: the chunkwise WY evaluation (any chunk size) equals the recurrence
    in exact arithmetic; chunk_size must be 16, 32 or 64, observes: [out], evidence_kind: definition}
- {id: GD.C12, basis: [GD.PAPER, GDN_PAPER.BLOCK, GDN_PAPER.OUT], statement: 'paper_block: q and k divided by their Euclidean
    norm, scale 1; a zero vector is domain_undefined', observes: [out], evidence_kind: definition}
examples:
- id: GD.E1
  profile: fla_chunk
  clauses: [GD.C1]
  input: {q: [[[[1]], [[1]]], [[[1]], [[1]]]], k: [[[[1]], [[2]]], [[[1]], [[2]]]], v: [[[[3]], [[4]]], [[[1]], [[0]]]], g: [
      [[0], [0]], [[0], [0]]], beta: [[['1/2'], ['1/2']], [['1/2'], ['1/2']]], scale: 1}
  expected: {outcome: value, fields: {out: {o: [[[['3/2']], [['5/2']]], [[['1/2']], [['-1/2']]]]}}}
  readings: {chunked: {outcome: value, fields: {out: {o: [[[['3/2']], [['5/2']]], [[['1/2']], [['-1/2']]]]}}}}
  note: 'batch 0: u0 = 3/2, h = 3/2; u1 = (4 - 2*3/2)/2 = 1/2, h = 3/2 + 2*1/2 = 5/2. batch 1: h = 1/2; u1 = (0 - 1)/2, h = -1/2'
- id: GD.E2
  profile: fla_chunk
  clauses: [GD.C1, GD.C10]
  input: {q: [[[[1]], [[1]]]], k: [[[[1]], [[2]]]], v: [[[[3]], [[4]]]], g: [[[0], [-1]]], beta: [[['1/2'], ['1/2']]], scale: 1}
  expected: {outcome: value, fields: {out: {o: [[[['3/2']], [[4 - 3*exp(-1)/2]]]]}}}
  readings: {chunked: {outcome: value, fields: {out: {o: [[[['3/2']], [[4 - 3*exp(-1)/2]]]]}}}}
  note: 'step 2 decays h = 3/2 to (3/2)e^-1, u = (4 - 3 e^-1)/2, h = (3/2)e^-1 + 2u = 4 - (3/2)e^-1'
- id: GD.E3
  profile: fla_chunk
  clauses: [GD.C2]
  input: {q: [[[[1, 0, 0, 0]]]], k: [[[[1, 0, 0, 0]]]], v: [[[[3]]]], g: [[[0]]], beta: [[[1]]]}
  expected: {outcome: value, fields: {out: {o: [[[['3/2']]]]}}}
  readings: {chunked: {outcome: value, fields: {out: {o: [[[['3/2']]]]}}}}
  note: K = 4, default scale 1/2; h = k v^T, o = (1/2) * 3
- id: GD.E4
  profile: fla_chunk
  clauses: [GD.C2]
  input: {q: [[[[1, 0]]]], k: [[[[1, 0]]]], v: [[[[3]]]], g: [[[0]]], beta: [[[1]]]}
