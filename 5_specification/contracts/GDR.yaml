  note: K = 2, default scale 1/sqrt(2) (irrational, enclosed)
- id: GD.E5
  profile: fla_chunk
  clauses: [GD.C3]
  input: {q: [[[[1], [2]]]], k: [[[[1], [1]]]], v: [[[[1], [1], [1], [1]]]], g: [[[0, 0, 0, 0]]], beta: [[[1, 1, 1, 1]]], scale: 1}
  expected: {outcome: value, fields: {out: {o: [[[[1], [1], [2], [2]]]]}}}
  note: H = 2, HV = 4; value heads 0, 1 read q head 0 and heads 2, 3 read q head 1
- id: GD.E6
  profile: fla_chunk
  clauses: [GD.C3]
  input: {q: [[[[1], [1]]]], k: [[[[1], [1]]]], v: [[[[1], [1], [1]]]], g: [[[0, 0, 0]]], beta: [[[1, 1, 1]]]}
  expected: {outcome: invalid_input}
  note: HV = 3 not divisible by H = 2
- id: GD.E7
  profile: fla_chunk
  clauses: [GD.C4]
  input: {q: [[[[1]]]], k: [[[[1]]]], v: [[[[3]]]], g: [[[0]]], beta: [[['1/2']]], scale: 1, initial_state: [[[[2]]]], output_final_state: true}
  expected: {outcome: value, fields: {out: {o: [[[['5/2']]]], final_state: [[[['5/2']]]]}}}
