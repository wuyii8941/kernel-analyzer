  note: 'k = 1, beta = 1/2: h_t = alpha_t h_{t-1}/2 + v_t/2, so h_0 = 1, h_t = 2^-t up to t = 14, alpha_15 = e^-1; T = 17 crosses
    the chunk boundary at 16, and the first chunk''s cumulative decay e^-1 must reach the second chunk'
- id: GD.E17
  profile: fla_chunk
  clauses: [GD.C11]
