  profile: fla_chunk
  clauses: [GD.C7]
  input: {q: [[[[1]]]], k: [[[[1]]]], v: [[[[3]]]], g: [[[0]]], beta: [[[0]]], scale: 1, use_beta_sigmoid_in_kernel: true, allow_neg_eigval: true}
