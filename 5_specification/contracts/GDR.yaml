nonclaims:
- Agreement with FLA's option semantics rests on the FLA reference program at 8024667 (docstrings, naive recurrence); it is
  agreement with that program, not a published standard. Eq. 10 itself is the paper's.
- Backward (gradients) is not covered; the tested case is forward only.
- Kernel numerics (TF32 dots, float32 cumsum of the log gate, binary64 scale) are the numerical question (K - G).
