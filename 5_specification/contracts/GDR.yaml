  clauses: [GD.C12, GD.C1]
  input: {q: [[[[3, 4]]]], k: [[[[0, 2]]]], v: [[[[5]]]], g: [[[0]]], beta: [[[1]]]}
  expected: {outcome: value, fields: {out: {o: [[[[4]]]]}}}
  note: q^ = (3/5, 4/5), k^ = (0, 1), h = k^ 5, o = q^ . h = 4 (no scale)
- id: GD.E19
  profile: paper_block
  clauses: [GD.C12]
  input: {q: [[[[0, 0]]]], k: [[[[0, 2]]]], v: [[[[5]]]], g: [[[0]]], beta: [[[1]]]}
  expected: {outcome: domain_undefined}
- id: GD.E20
  profile: paper_block
  clauses: [GD.C12]
  input: {q: [[[[3, 4]]]], k: [[[[0, 2]]]], v: [[[[5]]]], g: [[[0]]], beta: [[[1]]], scale: 1}
  expected: {outcome: unsupported}
