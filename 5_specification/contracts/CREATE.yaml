signature:
  inputs: [selected factory operation, size list or arange bounds or fill value, optional dtype, a *_like input tensor (shape and dtype only)]
  pre_state: [a *_like input tensor is unchanged]
  post_state: [one complete newly returned tensor]
  observation_unit: every returned coordinate together with dtype and shape
domain:
  valid:
  - arange with finite bounds, nonzero step consistent with end - start, integer arguments or a declared floating default dtype
  - zeros, ones, full, *_like and scalar_tensor with an explicit or inferable floating, integer or bool result dtype
  invalid_input:
  - malformed record, negative size, zero step, inconsistent step sign, nonfinite arange bounds, integer-result values out of range or infinite
  unsupported:
  - arange with an infinite step
  - result dtype equal to the process default floating dtype (profile explicit), scalar_tensor without dtype, NaN fill, floating overflow, non-integer values for integer results, Boolean values other than 0/1, arange inside the rounding ambiguity band, empty / empty_like, out and names overloads, complex and float8 dtypes
mutation_requirements:
- {id: CR.M1, misreading: arange includes end (length floor((end-start)/step)+1), witnesses: [CR.E2]}
- {id: CR.M2, misreading: arange length floor((end-start)/step) instead of ceil, witnesses: [CR.E4]}
- {id: CR.M3, misreading: arange with integer arguments returns the default floating dtype instead of int64, witnesses: [CR.E7]}
- {id: CR.M4, misreading: ones_like ignores the input dtype and returns the default floating dtype, witnesses: [CR.E43]}
- {id: CR.M5, misreading: scalar_tensor replaces an infinity by the largest finite value of the dtype, witnesses: [CR.E35]}
- {id: CR.M6, misreading: zeros turns an empty dimension into size 1, witnesses: [CR.E15]}
- {id: CR.M7, misreading: arange(end) counts from 1 to end, witnesses: [CR.E2]}
nonclaims:
- No values are defined for empty / empty_like; layout, device, pin_memory, memory_format, strides and requires_grad are not checked.
- The process default floating dtype is not observed; default_float32 only states the result under the task's declaration that it is float32.
- The arange validity checks and the scalar_tensor dtype analysis rely in part on reference programs (RangeUtils.h, TensorFactories.cpp, torch._refs, native_functions.yaml); there the result is consistency with those programs.
- Floating results are exact real values; how a device rounds start + i*step or a non-representable fill value is a measured deviation, not a claim of this contract.
changes:
- date: '2026-10-21'
  change: >-
    Independent review fixes: Boolean observations must hold real Booleans; an infinite arange step is unsupported
    with the alternatives in CR.ARANGE_LENGTH (example CR.E44); corrected profile name in a refusal message.
  trigger: reviews/2026-10-20/A2_package_E_review.md (CR-1, CR-2, CR-3).
- date: '2026-10-20'
