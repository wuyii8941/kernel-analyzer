schema_version: '1.2'
id: CREATE
role: CREATE
title: Tensor factories (arange, zeros, ones, full, zeros_like, ones_like, full_like, scalar_tensor)
review:
  status: reviewed_for_implementation
  reviewer: 'independent review 2026-10-21 (reviews/2026-10-20/A2_package_E_review.md)'
  author: Claude (path A closure work package E), 2026-10-20
  date: '2026-10-21'
  scope: >-
    Complete value, dtype and shape of the selected PyTorch 2.10 ATen factory overloads called with an explicit or
    inferable result dtype. Awaiting a review by someone who did not write it.
activation:
  implementation_status: validated
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers: [aten.arange, aten.zeros, aten.ones, aten.full, aten.zeros_like, aten.ones_like, aten.full_like,
  aten.scalar_tensor]
profiles:
  explicit:
    meaning: >-
      Factory calls whose result dtype is fixed by the call itself (an explicit dtype, the dtype of a *_like input,
      int64 inference for arange with integer arguments, bool / int64 inference for full with a bool / int fill) and
      is a floating (f16, bf16, f32, f64), integer (i64, i32, i16, i8, u8) or bool dtype. A Boolean result is returned
      in the exact numeric encoding 1 = true, 0 = false (CR.BOOL_ENCODING). Calls whose result dtype is the process
      default floating dtype are outside this profile.
    task_choice_required: false
    outputs: [out]
    basis: [CR.SCOPE, CR.ARANGE_LENGTH, CR.ARANGE_DTYPE, CR.CONVERSION, CR.LIKE, CR.SCALAR_DTYPE, CR.BOOL_ENCODING]
  default_float32:
    meaning: >-
      explicit extended to calls whose result dtype is the process default floating dtype (zeros / ones without
      dtype, full with a floating fill, arange with a floating argument), with the task declaring that the process
      runs with the documented initial default torch.float32.
    task_choice_required: true
    outputs: [out]
    basis: [CR.DEFAULT_DTYPE, CR.SCOPE, CR.ARANGE_LENGTH, CR.ARANGE_DTYPE, CR.CONVERSION, CR.LIKE, CR.SCALAR_DTYPE,
      CR.BOOL_ENCODING]
outputs:
  out:
    shape: >-
      the complete result tensor with its dtype and explicit shape (including empty and 0-dim shapes); Boolean results
      in the numeric encoding 1 = true, 0 = false
    guarantee: exact
comparison:
  input_binding: >-
    Size lists, scalar arguments and dtypes are the recorded call arguments; a Python float argument denotes its exact
    binary value. A *_like input contributes only its shape and dtype. Non-semantic keywords (device, layout,
    pin_memory, memory_format) are not part of the reference interface and must be dropped by the binding with a
    recorded basis.
  complete_output: The complete returned tensor is observed with dtype, explicit shape and every value.
  quality: >-
    Exact values: integers exactly, Booleans exactly in the 1 / 0 encoding; floating results are the exact real task value (start + i*step, the
    fill value, plus or minus infinity where the dtype has infinities); the deviation of a stored floating value from
    that real value is measured, not tolerated by the reference.
  test_evidence: Hand-derived coordinate values and PyTorch 2.10 eager comparisons of the recorded argument structures.
  error_handling: >-
    Malformed calls (negative sizes, zero step, inconsistent step sign, nonfinite arange bounds, values outside an
    integer dtype's range) are invalid_input; result-dtype choices outside the profile, overflow of a floating dtype,
    arange lengths at the documented rounding ambiguity, empty, and scalar_tensor without dtype are unsupported.
decisions:
- id: CR.SCOPE
  status: reviewed
  statement: >-
    Select the functional overloads arange (default, start, start_step), zeros, ones, full, zeros_like, ones_like,
    full_like and scalar_tensor. Their out and names overloads are different tasks. empty / empty_like are not
    selected: their values are uninitialized (T_EMPTY.UNINIT), so no value is defined and a contract could only state
    dtype and shape. The keywords layout, device, pin_memory and memory_format do not change any value and are not
    reference inputs; requires_grad is not an ATen argument. Alternatives considered: (a) include empty with only
    dtype/shape compared; rejected because no recorded call needs it and the value-comparison interface would have to
    mark every coordinate not compared; (b) accept and ignore the non-semantic keywords in the reference; rejected
    because the harness drops them with a recorded basis and silently accepting arbitrary encodings would hide binding
    errors.
  basis: [TS_NATIVE_FUNCTIONS_CR.CREATION_SCHEMAS, T_EMPTY.UNINIT, T_ONES_LIKE.DTYPE]
- id: CR.DEFAULT_DTYPE
  status: needs_binding
  statement: >-
    zeros / ones / full (floating fill) without dtype and arange with a floating argument and no dtype take the
    process default floating dtype, which is mutable process state (torch.set_default_dtype) and is not part of the
    recorded call. Alternatives: (a) assume torch.float32, the documented initial default; (b) refuse such calls;
    (c) record the default dtype at capture time. The profile explicit chooses (b); the profile
    default_float32 is (a) and requires the task to declare it. (c) needs a recorder change.
  basis: [T_SET_DEFAULT_DTYPE.INITIAL, T_ZEROS.DEF, T_ARANGE.DEF]
- id: CR.ARANGE_DTYPE
  status: reviewed
  statement: >-
    Without dtype, arange returns int64 when start, end and step are all integers and the default floating dtype if
    any of them is floating (as documented). A Python float, a rational string or an infinity counts as floating.
    Boolean arguments, a bool result dtype, and non-integer arguments with an explicit integer dtype are unsupported:
    the documentation does not say how non-integer bounds are converted to an integer result (the reference program
    converts the scalars to the accumulation type first).
  basis: [T_ARANGE.DEF, TS_RANGE_UTILS_H.SIZE]
- id: CR.ARANGE_LENGTH
  status: reviewed
  statement: >-
    The result is 1-D of length ceil((end - start) / step) evaluated exactly on the received argument values, with
    value start + i*step at index i (equivalently out_{i+1} = out_i + step). step = 0, nonfinite start or end, and a
    step whose sign disagrees with end - start (the formula would give a negative size) are invalid_input, as checked
    by the reference program. The page warns that non-integer steps are subject to rounding when comparing against
    end; the reference program evaluates the quotient in double precision. Alternatives: (a) exact formula
    everywhere; (b) emulate the double evaluation; (c) an allowed set of both lengths near integers; (d) exact formula
    but refuse the ambiguous band. Choice (d): when any argument is non-integer (or has magnitude at least 2^53) and
    the exact quotient lies within 2^-30 * max(1, |q|) of an integer (including exactly on it), the call is
    unsupported. (b) would define f from the implementation, (c) needs set-valued shapes. All-integer arguments below
    2^53 are always evaluated exactly. An infinite step is not rejected by the reference program's checks (only
    nonfinite start and end are) and PyTorch 2.10 eager returns an empty tensor for arange(0, 5, inf); the page's
    length formula involves division by an infinite step, which is not a real-number operation. Alternatives: (i)
    invalid_input; (ii) length 0 by reading (end - start)/inf as 0; (iii) unsupported. Choice (iii): the
    documentation does not define the case, and neither refusing a call eager accepts nor fixing its value is
    supported by a source.
  basis: [T_ARANGE.DEF, T_ARANGE.ROUNDING, TS_RANGE_UTILS_H.CHECKS, TS_RANGE_UTILS_H.SIZE]
- id: CR.CONVERSION
  status: reviewed
  statement: >-
    A fill value (0 for zeros, 1 for ones, fill_value, s, or an arange value) in a floating result is its exact real
    value; infinities are exact; NaN has no real value and is unsupported; a finite value that rounds to infinity in
    the result dtype is unsupported (overflow is not documented for these pages). In an integer result the value must
    be an integer (else unsupported) inside the dtype's range (else invalid_input; infinity is invalid_input). In a
    Boolean result only bool values or 0 / 1 are admitted (other values unsupported), giving false / true. full
    without dtype infers bool from a bool fill, int64 from an int fill, and the default floating dtype from a floating
    fill.
  basis: [T_FULL.DEF, T_ZEROS.DEF, T_ONES.DEF, T_ARANGE.ROUNDING]
- id: CR.LIKE
  status: reviewed
  statement: >-
    zeros_like, ones_like and full_like read only the shape and dtype of input (dtype defaults to input's dtype);
    input values, including NaN and infinities, are irrelevant and accepted.
  basis: [T_ONES_LIKE.DEF, T_ONES_LIKE.DTYPE, T_ZEROS_LIKE.DEF, T_ZEROS_LIKE.DTYPE, T_FULL_LIKE.DEF]
- id: CR.BOOL_ENCODING
  status: reviewed
  statement: >-
    A Boolean result (ones / zeros / full / *_like / scalar_tensor with bool dtype) is returned in the exact numeric
    encoding 1 = true, 0 = false in the numeric output out; the contract's complete-output checker requires the
    observed tensor to have dtype bool and the given shape, and compares each Boolean entry with that encoding.
    Alternatives: (a) a separate Boolean output field (kind boolean) in a separate profile; rejected because the path
    A generation rule maps a single output field named out; (b) a mixed field (kind discrete), refused by the
    measurement binding. Values are unaffected; only the representation of true / false in the reference changes.
  basis: [TS_NATIVE_FUNCTIONS_CR.CREATION_SCHEMAS, T_ONES.DEF, T_ZEROS.DEF]
- id: CR.SCALAR_DTYPE
  status: reviewed
  statement: >-
    scalar_tensor(s, dtype) is the 0-dim tensor holding s in dtype. Without dtype the sources disagree: the
    torch._refs reference infers the dtype from the Python type of s (int -> int64), while the native factory leaves
    the TensorOptions default (the default floating dtype; PyTorch 2.10 eager returns float32 for an int). No page
    documents it, so scalar_tensor without dtype is unsupported in every profile. The recorded calls pass dtype.
  basis: [TS_REFS.SCALAR_TENSOR, TS_PRIMS.SCALAR_TENSOR, TS_TENSOR_FACTORIES_CPP.SCALAR_TENSOR]
clauses:
- id: CR.C1
  basis: [CR.ARANGE_LENGTH, CR.ARANGE_DTYPE]
  statement: arange returns the complete 1-D tensor of length ceil((end-start)/step) with value start + i*step at index i, int64 for integer arguments without dtype.
  observes: [out]
  evidence_kind: definition
- id: CR.C2
  basis: [CR.ARANGE_LENGTH]
  statement: arange with zero step, nonfinite start or end, or a step sign inconsistent with end - start is invalid_input; an infinite step is unsupported; end == start gives the empty tensor.
  observes: [out]
  evidence_kind: definition
- id: CR.C3
  basis: [CR.ARANGE_DTYPE, CR.DEFAULT_DTYPE, CR.ARANGE_LENGTH]
  statement: arange with a floating argument and no dtype has the default floating dtype; explicit refuses it, default_float32 evaluates it as float32 with exact values; the documented rounding ambiguity band is refused.
  observes: [out]
  evidence_kind: definition
- id: CR.C4
  basis: [CR.CONVERSION, TS_NATIVE_FUNCTIONS_CR.CREATION_SCHEMAS]
  statement: zeros / ones / full return the complete tensor of the given (possibly empty) size whose every coordinate is 0 / 1 / fill_value in the result dtype (0 / 1 encoding false / true for bool).
  observes: [out]
  evidence_kind: definition
- id: CR.C5
  basis: [CR.LIKE, CR.CONVERSION]
  statement: zeros_like / ones_like / full_like return the fill value at every coordinate of input's shape, in input's dtype unless dtype is given.
  observes: [out]
  evidence_kind: definition
- id: CR.C6
  basis: [CR.SCALAR_DTYPE, CR.CONVERSION]
  statement: scalar_tensor(s, dtype) returns the 0-dim tensor holding s exactly (infinities exact in floating dtypes); without dtype it is unsupported.
  observes: [out]
  evidence_kind: definition
- id: CR.C7
  basis: [CR.CONVERSION, CR.DEFAULT_DTYPE]
  statement: Negative sizes, values outside an integer dtype's range and infinities in integer results are invalid_input; calls whose result dtype is the default floating dtype are unsupported in explicit; float8 and complex result dtypes are unsupported.
  observes: [out]
  evidence_kind: definition
