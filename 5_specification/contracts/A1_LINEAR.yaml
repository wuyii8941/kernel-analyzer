nonclaims:
- All source/task decisions remain pending independent review; development checks cannot activate this contract.
- This contract is the only current A1 entry; historical drafts/v2_5 is not a fallback.
- A kernel binding must establish which region, profile, input transformation, outputs and memory states are being
  compared.
