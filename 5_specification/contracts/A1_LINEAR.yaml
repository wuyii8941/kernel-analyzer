schema_version: '1.2'
id: A1_LINEAR
role: LINEAR_ATTENTION_RECURRENCE
title: Selected linear-attention and delta recurrence cores, complete state and VJP (draft migration)
review:
  status: drafted
  author: Codex, 2026-10-18
  date: '2026-10-18'
  scope: Prepared migration of the isolated A1 draft; needs independent source and implementation review. Local
    FLA support copies have unverified upstream revision.
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires:
  - source_profile_matched
  - input_contract_validated
  - all_required_outputs_bound
  - reference_semantics_and_guarantees_validated
  - no_unresolved_contradiction
  - reviewed_contract_and_adapter_match_current
covers:
- Explicitly selected single-head mathematical recurrence regions, including variable-length sequences and full
  VJP; not a full FLA API or model layer
profiles:
  unnormalized_core:
    meaning: S_t=S_{t-1}+k_t v_t^T; o_t=scale*S_t^T q_t. No denominator or Z state.
    basis:
    - A1.TASK
    - A1_LOCAL_LINEAR.RECURRENCE
    task_choice_required: true
  normalized_core:
    meaning: Same S update, Z_t=Z_{t-1}+k_t; o_t=scale*S_t^T*q_t/(scale*dot(q_t,Z_t)+epsilon). epsilon is mandatory,
      nonnegative and fixed for differentiation.
    basis:
    - A1.TASK
    - A1.NORMALIZATION
    - A1_LOCAL_LINEAR.NORMALIZED
    - A1_LOCAL_NORMALIZE.STATE
    task_choice_required: true
  scalar_decay_core:
    meaning: A_t=a_t*S_{t-1}; S_t=A_t+k_t*v_t^T; o_t=scale*S_t^T*q_t.
    basis:
    - A1.TASK
    - A1_LOCAL_SCALAR.RECURRENCE
    - A1.GATE
    task_choice_required: true
  diagonal_decay_core:
    meaning: A_t=diag(a_t)*S_{t-1}; S_t=A_t+k_t*v_t^T; o_t=scale*S_t^T*q_t.
    basis:
    - A1.TASK
    - A1_LOCAL_GLA.RECURRENCE
    - A1.GATE
    task_choice_required: true
  delta_core:
    meaning: A_t=S_{t-1}; S_t=A_t+beta_t*k_t*(v_t-A_t^T*k_t)^T; o_t=scale*S_t^T*q_t. beta is scalar per token, supplied
      directly.
    basis:
    - A1.TASK
    - A1_LOCAL_DELTA.RECURRENCE
    task_choice_required: true
  gated_delta_core:
    meaning: A_t=a_t*S_{t-1}; S_t=A_t+beta_t*k_t*(v_t-A_t^T*k_t)^T; o_t=scale*S_t^T*q_t.
    basis:
    - A1.TASK
    - GDN_PAPER.EQ10
    - FLA_GDR_NAIVE.RECURRENT
    - A1.GATE
    task_choice_required: true
  kda_core:
    meaning: A_t=diag(a_t)*S_{t-1}; S_t=A_t+beta_t*k_t*(v_t-A_t^T*k_t)^T; o_t=scale*S_t^T*q_t. Decay precedes correction.
    basis:
    - A1.TASK
    - A1_LOCAL_KDA.RECURRENCE
    - A1.GATE
    task_choice_required: true
outputs:
  result:
    shape: Complete named record described by signature; every output and state coordinate is required
    guarantee: rigorous_enclosure
comparison:
  input_binding: Exact supplied finite values; binary floats denote their exact rational values. Explicit scale
    and epsilon are fixed task parameters.
  quality: Exact rationals when possible, outward enclosures otherwise; no tolerance.
  test_evidence: Example compatibility and independent exact matrix/gradient checks do not establish general certification.
  error_handling: Invalid structure rejects the complete query; zero normalized denominator is undefined; unsupported
    API features are not guessed.
decisions:
- id: A1.TASK
  status: needs_binding
  statement: The caller must select the exact recurrence subtask and bind every input, state and output. A role/family
    name is insufficient. Retained local implementations support the written updates but have not been independently
    tied to an upstream revision. No complete Katharopoulos paper algorithm is claimed, and no default feature map
    is selected. Direct finite decay/beta values describe this algebraic task, not every model parameterization.
  basis:
  - A1_LOCAL_LINEAR.RECURRENCE
  - A1_LOCAL_LINEAR.NORMALIZED
  - A1_LOCAL_NORMALIZE.STATE
  - A1_LOCAL_SCALAR.RECURRENCE
  - A1_LOCAL_GLA.RECURRENCE
  - A1_LOCAL_DELTA.RECURRENCE
  - GDN_PAPER.EQ10
  - FLA_GDR_NAIVE.RECURRENT
  - A1_LOCAL_KDA.RECURRENCE
- id: A1.SCALE
  status: drafted
  statement: All paths use real 1/sqrt(K) by default; an explicit scale instead uses its exactly supplied value.
    K is positive. Floating computation of the default belongs to the numerical execution question and must be selected
    consistently at binding.
  basis:
  - A1_LOCAL_LINEAR.RECURRENCE
  - A1_LOCAL_SCALAR.RECURRENCE
- id: A1.GATE
  status: needs_binding
  statement: gate_parameterization defaults to direct. Explicit ln means a=exp(g), log2 means a=2^g; the argument
    named a then carries g and gradients are dg. Changing the base changes the task unless the input is correspondingly
    transformed. Unknown bases reject. No automatic sigmoid, softplus or beta conversion.
  basis:
  - A1_LOCAL_SCALAR.RECURRENCE
  - A1_LOCAL_GLA.RECURRENCE
  - A1_LOCAL_KDA.RECURRENCE
- id: A1.NORMALIZATION
  status: needs_binding
  statement: q and k are the supplied core vectors, after any feature map selected outside this region.
    The retained local implementation adds the literal 1e-10 after scaling the query-key sum.
    This contract generalizes that constant only by explicit task choice of epsilon; it does not
    attribute arbitrary epsilon to the paper or the full FLA API. The denominator is
    scale*dot(q,Z)+epsilon, not scale*(dot(q,Z)+epsilon). Cancelling scale requires
    rescaling epsilon and a nonzero scale. A binding must specify the exact value of epsilon,
    including any conversion of a source-language literal, and the q/k transformations.
  basis:
  - A1_LOCAL_LINEAR.NORMALIZED
  - A1_LOCAL_NORMALIZE.STATE
- id: A1.VJP
  status: drafted
  statement: Differentiate sum_t dot(dO_t,o_t)+dot(dST,S_T), plus dot(dZT,Z_T) for normalized_core, with respect
    to every supplied core tensor; scale and epsilon fixed. k occurs in both delta write and residual. Varlen has
    one cotangent per declared final state, including empty segments.
  basis:
  - A1.TASK
  - A1_LOCAL_NORMALIZE.STATE
