signature:
  inputs:
  - 'operation: forward or backward; q/k [T,K], v [T,V]; K,V positive'
  - profile selects the exact subtask; epsilon mandatory only for normalized_core
  - a [T] for scalar/gated_delta, [T,K] for diagonal/KDA; gate_parameterization direct/ln/log2
  - beta [T] direct for delta profiles; no per-value beta in this draft
  - optional cu_seqlens [N+1], starts 0, nondecreasing, ends T; N>=1
  - backward requires dO [T,V]; optional dST/dZT or their per-sequence lists
  - optional positive integer chunk_size only for forward linear/normalized/decay cores
  pre_state:
  - S0 [K,V], or S0_list [N,K,V], defaults to zero; required for all-empty tokens to determine dimensions
  - normalized Z0 [K], or Z0_list [N,K], defaults to zero; cannot substitute for S dimensions
  post_state:
  - 'forward: out [T,V] and state [K,V] (states [N,K,V] for varlen); normalized additionally zstate [K] or zstates
    [N,K]'
  - 'backward: dq/dk [T,K], dv [T,V], dS0 [K,V] or dS0_list [N,K,V]; normalized adds dZ0 [K] or dZ0_list [N,K]'
  - decay/gated profiles add da or dg in the supplied gate shape; delta profiles add dbeta [T]
  observation_unit: One selected region, one head, every declared sequence and all states; no inferred API layout
    or storage aliasing
domain:
  valid:
  - Finite exact inputs, matching tensor dimensions and complete state pools; empty segments retained
  - Direct a and beta may be any finite supplied value under explicitly selected algebraic task; log inputs finite
  - epsilon >=0; normalized denominators nonzero
  domain_undefined:
  - Any normalized output has zero denominator
  invalid_input:
  - Missing required input; malformed dimensions, counts, boundaries or cotangents; negative epsilon
  unsupported:
  - Unknown profile/operation/base/keyword; discarded or unbound outputs
  - Feature-map selection, full paper/model algorithm, implicit q/k normalization, sigmoid beta, multihead expansion,
    reverse scan, transposed state or storage effects
  - Delta chunked diagnostic evaluation; full FLA API compatibility
