signature:
  inputs: ['op: layer_norm | rms_norm | group_norm', 'x: nested list (layer/rms: (*, normalized_shape); group: (N, C,
      *))', 'normalized_shape (layer/rms) or num_groups (group)', 'weight, bias: nested lists or null (rms_norm has no
      bias)', 'eps: exact rational, explicit', 'upstream: nested list of the shape of x', 'offset (profile rms_offset)']
  pre_state: []
  post_state: []
  observation_unit: 'one normalisation call: y, saved statistics and the complete VJP. aten.native_layer_norm(x,
    normalized_shape, w, b, eps) = (y, mean, rstd) and aten.native_group_norm(x, w, b, N, C, HxW, G, eps) = (y, mean,
    rstd) map to y and saved; their backward ops (with output_mask) map to grad. Profile torch_autograd observes the
    public y and VJP boundary and does not expose saved statistics. Profile aten_native takes {op, args, kwargs} for
    aten.native_layer_norm, aten.native_layer_norm_backward and aten.rms_norm (schema argument names) and returns
    out = the ATen return.'
domain:
  valid: [exact rational inputs of consistent shapes for which every variance/second-moment plus eps is positive]
  domain_undefined: [nonpositive variance/second-moment plus eps, empty normalisation set]
  invalid_input: [normalized_shape that is not the trailing shape of x, num_channels not divisible by num_groups,
    parameter shapes that do not match, the public GroupNorm batch-size rejection in torch_autograd, missing or extra
    fields]
  unsupported: [ops outside the profile (rms_offset has rms_norm only), infinite or NaN values, ATen calls outside
      aten_native, aten.rms_norm eps=None for float16 / bfloat16, output_mask true for an absent weight or bias]
mutation_requirements:
- {id: NM.M1, misreading: unbiased variance (n - 1) in the normalisation, witnesses: [NM.E1]}
- {id: NM.M2, misreading: 'eps outside the square root, 1/(sqrt(var) + eps)', witnesses: [NM.E1]}
- {id: NM.M3, misreading: 'offset ignored in profile rms_offset (bug B004: x_hat w instead of x_hat (1 + w))',
  witnesses: [NM.E8]}
- {id: NM.M4, misreading: offset form used for torch.nn.RMSNorm, witnesses: [NM.E7]}
- {id: NM.M5, misreading: RMSNorm subtracts the mean (LayerNorm used for RMSNorm), witnesses: [NM.E7]}
- {id: NM.M6, misreading: 'interleaved groups (channel c in group c mod G)', witnesses: [NM.E11]}
- {id: NM.M7, misreading: dx without the mean(h) term, witnesses: [NM.E3]}
- {id: NM.M8, misreading: dx without the x_hat mean(h x_hat) term, witnesses: [NM.E1]}
- {id: NM.M9, misreading: RMSNorm eps outside the square root, witnesses: [NM.E7]}
- {id: NM.M10, misreading: statistics over the last axis only for a multi-dimensional normalized_shape, witnesses: [NM.E2]}
- {id: NM.M11, misreading: GroupNorm affine parameters per group instead of per channel, witnesses: [NM.E11]}
- {id: NM.M12, misreading: dweight from the first normalisation set only, witnesses: [NM.E1]}
- {id: NM.M13, misreading: constant set treated as undefined although eps > 0, witnesses: [NM.E3]}
- {id: NM.M14, misreading: negative eps rejected even when every radicand is positive, witnesses: [NM.E19]}
- {id: NM.M15, misreading: 'aten.native_layer_norm with eps outside the square root', witnesses: [NM.E23]}
- {id: NM.M16, misreading: aten.native_layer_norm with unbiased variance, witnesses: [NM.E23]}
- {id: NM.M17, misreading: 'aten.native_layer_norm returns the standard deviation sqrt(var + eps) as rstd', witnesses: [
    NM.E23]}
- {id: NM.M18, misreading: 'aten.native_layer_norm_backward recomputes mean and rstd from input instead of using the
    supplied values', witnesses: [NM.E27]}
- {id: NM.M19, misreading: aten.native_layer_norm_backward ignores output_mask, witnesses: [NM.E28]}
- {id: NM.M20, misreading: 'aten.rms_norm eps=None taken as 1e-5 (FlagGems defect D5)', witnesses: [NM.E30]}
- {id: NM.M21, misreading: aten.rms_norm eps=None taken as 0, witnesses: [NM.E30]}
nonclaims:
- Floating-point rounding, including the casts of Liger's casting modes and of the HF modules, is the numerical question
  K - G (decision NM.CASTS).
- The saved statistics and the offset variant rest on torch sources and reference programs (Liger, HF transformers),
  not on the documentation pages; agreement with them is agreement with those programs.
- In profile aten_native the shape of mean / rstd, the use of the supplied statistics in the backward and the
  total arrangement of the ATen returns rest on the PyTorch 2.10 schemas and sources (NM.ATEN_STATS,
  NM.ATEN_BWD_SUPPLIED); the dtype of mean / rstd is not judged (NM.ATEN_DTYPES).
changes:
- date: '2026-10-18'
  change: Added torch_autograd with the complete public output y and VJP while retaining saved statistics in the
    native/full profile.
  trigger: A real Liger RMSNorm forward/backward call exposed y and parameter/input gradients but kept rstd internal;
    requiring rstd at that public boundary incorrectly rejected an otherwise complete binding.
- date: '2026-10-18'
  change: Separated the public GroupNorm input rejection from the native/full profile and replaced the unsupported
    eps >= 0 restriction with the real formula's positive-radicand domain.
  trigger: PyTorch 2.10 accepts negative eps when the radicand remains positive, while public group_norm and
    aten.native_group_norm differ on the single-value configuration.
- date: '2026-10-20'
  change: Added the non-task-choice profile aten_native with an ATen-call interface (kernel_spec.aten_adapter.make_reference)
    for aten.native_layer_norm, aten.native_layer_norm_backward and aten.rms_norm, the output out, decisions
    NM.ATEN_INTERFACE, NM.ATEN_STATS, NM.ATEN_BWD_SUPPLIED, NM.ATEN_RMS_EPS_NONE and NM.ATEN_DTYPES, clauses NM.C14-NM.C17,
    examples NM.E23-NM.E34 and mutants NM.M15-NM.M21; aten.rms_norm added to covers. Existing profiles keep their
    semantics; their outputs are now listed explicitly and they refuse ATen calls. Review status reset to drafted.
  trigger: Path A closure (G6) - recorded FlagGems calls of these overloads (including the D5 rms_norm eps=None trigger)
    had no validated contract with an ATen-call interface.
