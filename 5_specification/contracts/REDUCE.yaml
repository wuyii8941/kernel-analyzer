schema_version: '1.2'
id: REDUCE
role: REDUCE
title: Common finite floating reductions and their vector-Jacobian products
review:
  status: reviewed_for_implementation
  author: Claude (original broad draft) and Codex (finite common-operation revision), 2026-10-18
  date: '2026-10-19'
  reviewer: Codex independent source, formula, domain and complete-output review
  scope: Finite floating default functional reductions, including selected variance, standard-deviation, var-mean and vector 2-norm forward/VJP tasks; device rounding and concrete kernel binding remain separate
activation:
  implementation_status: validated
  implementation_evidence: evidence/reduce_implementation.md
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, reviewed_contract_and_adapter_match_current]
covers: [aten.sum, aten.mean, aten.prod, aten.amax, aten.amin, aten.argmax, aten.argmin, aten.max, aten.min,
  aten.cumsum, aten.logsumexp, aten.var, aten.std, aten.var_mean, vjp.aten.sum, vjp.aten.mean, vjp.aten.prod,
  vjp.aten.amax, vjp.aten.amin, vjp.aten.max, vjp.aten.min, vjp.aten.logsumexp, vjp.aten.cumsum,
  vjp.aten.var, vjp.aten.std, vjp.aten.var_mean, aten.linalg_vector_norm, vjp.aten.linalg_vector_norm]
profiles:
  real:
    meaning: >-
      Exact real reductions of finite f16, bf16, f32 or f64 tensor values in the selected default functional
      interfaces. An explicit floating dtype converts the input first. VJP operations differentiate the selected
      forward task against an explicit upstream tensor of the same dtype, with the documented extrema tie rules.
      Variance, standard deviation and var-mean are restricted to their correction overloads with correction 0 or 1 and
      positive degrees of freedom. Standard-deviation VJPs additionally require a positive standard deviation unless
      the reduced slice contains one element, where the selected correction-zero function is identically zero.
      The public linalg vector-norm task is restricted to real f32/f64, order two, no explicit dtype conversion and
      a nonzero norm in every reduced slice for VJP queries.
    task_choice_required: false
    basis: [RD.SCHEMA, RD.VJP, RD.VAR]
outputs:
  out:
    shape: Per operation; max/min along a dimension return value and index tensors, and VJPs return the input gradient.
    guarantee: rigorous_enclosure
comparison:
  input_binding: Tensor values are the exact finite values received; explicit dtype conversion occurs before reduction.
  complete_output: >-
    check_output requires out to contain complete tensor records with t, v and shape. Structured max/min and var-mean
    outputs require both ordered records. Shape, dtype and every coordinate are checked, including empty tensors.
  equality: Exact values compare exactly; a point merely lying inside a nonpoint enclosure does not establish equality.
  quality: No tolerance.
  test_evidence: Exact equality or containment of an independently calculated exact value in the reference enclosure.
  error_handling: Empty means and variance with non-positive degrees of freedom are domain_undefined; empty extrema are invalid_input; unsupported types and nonfinite inputs are refused.
decisions:
- id: RD.SCHEMA
  status: reviewed
  statement: >-
    The selected interfaces are the PyTorch 2.10 default functional overloads. sum/mean may reduce an integer list of
    dimensions; prod reduces one integer dimension or all elements; cumsum uses one integer dimension; logsumexp
    requires one or more dimensions. The selected var/std/var_mean correction overloads use an optional integer dimension list,
    keyword-only correction and keepdim; this profile selects only correction 0 or 1 and does not select the older
    unbiased overloads. dtype for sum/mean/prod/cumsum is keyword-only. Out, named-dimension and complex overloads are
    outside this profile. The selected linalg_vector_norm functional schema uses scalar order, an optional integer
    dimension list, Boolean keepdim and keyword-only dtype; only order two with dtype omitted is selected here.
  basis: [TS_NATIVE_FUNCTIONS.REDUCE_SCHEMAS, T_SUM.DEF, T_MEAN.DEF, T_PROD.DEF, T_CUMSUM.DEF, T_LOGSUMEXP.DEF, T_VAR.DEF, T_STD.DEF, T_VAR_MEAN.DEF, T_VECTOR_NORM.DEF]
- id: RD.EMPTY
  status: reviewed
  statement: >-
    Over an empty reduced set, sum is 0 and prod is 1; mean is undefined; extrema and arg-extrema are invalid because
    they have no identity; cumsum preserves the empty input; logsumexp is -inf because it is log(0).
  basis: [T_SUM.DEF, T_PROD.DEF, T_MEAN.EMPTY, T_AMAX.DEF, T_CUMSUM.DEF, T_LOGSUMEXP.DEF]
- id: RD.VJP
  status: reviewed
  statement: >-
    VJPs are derivatives of the selected real forward tasks. amax/amin divide the upstream gradient equally among
    tied extreme values; max/min along one dimension send it to the documented first index. Product differentiation
    multiplies the other elements and therefore remains defined in the presence of zeros. Variance differentiation
    gives 2(x-mean)/(N-correction) times the broadcast upstream when the denominator is positive. For a positive
    standard deviation, its VJP is upstream times (x-mean)/((N-correction) std). A zero standard deviation has no
    unique real derivative for slices with more than one element; a one-element correction-zero slice is the constant
    zero function and has zero VJP.
  basis: [T_SUM.DEF, T_MEAN.DEF, T_PROD.DEF, T_AMAX.GRAD, T_MAX.DIM, T_MIN.DIM, T_CUMSUM.DEF, T_LOGSUMEXP.DEF, T_VAR.DEF, T_STD.DEF]
- id: RD.VAR
  status: reviewed
  statement: >-
    The selected variance task is torch.var's correction overload on finite floating tensors, with dim None, one
    integer dimension, or a nonempty list of distinct integer dimensions; correction is omitted/None (meaning 1), 0,
    or 1. For N reduced elements it returns sum((x-mean)^2)/(N-correction). N-correction must be positive; otherwise
    the real task is domain_undefined. Constant slices with a positive denominator have variance and VJP equal to zero.
    Empty-dimension spelling, other corrections, legacy unbiased overloads and out forms are not selected.
  basis: [T_VAR.DEF, TS_NATIVE_FUNCTIONS.REDUCE_SCHEMAS]
- id: RD.STD
  status: reviewed
  statement: >-
    The selected standard-deviation task is torch.std's correction overload on the same finite floating inputs,
    dimension forms and corrections as RD.VAR. Forward std is the nonnegative square root of the selected variance,
    including zero for a constant slice. Its VJP is admitted for positive std, and also for a one-element
    correction-zero slice where the complete function is identically zero. For a zero-variance slice with more than
    one element the real derivative is not unique, so that VJP query is domain_undefined rather than assigned a
    framework-specific subgradient.
  basis: [T_STD.DEF, T_VAR.DEF, TS_NATIVE_FUNCTIONS.REDUCE_SCHEMAS]
- id: RD.VAR_MEAN
  status: reviewed
  statement: >-
    The selected var-mean task is torch.var_mean's correction overload on the same finite floating inputs, dimension
    forms and corrections as RD.VAR. It returns the complete ordered pair (variance, mean). Its input VJP accepts two
    complete same-dtype upstream tensors and is the sum of their VJPs:
    upstream_var * 2(x-mean)/(N-correction) + upstream_mean/N.
  basis: [T_VAR_MEAN.DEF, T_VAR.DEF, T_MEAN.DEF, TS_NATIVE_FUNCTIONS.REDUCE_SCHEMAS]
- id: RD.VECTOR_NORM
  status: reviewed
  statement: >-
    The selected task is public torch.linalg.vector_norm on a finite real f32 or f64 tensor with order two, dim None,
    one integer dimension, or a nonempty sequence of distinct integer dimensions, Boolean keepdim and no explicit
    dtype conversion. Forward returns the nonnegative square root of the sum of squares. Its VJP is admitted only
    when every reduced slice has positive norm and equals broadcast(upstream) * x / norm. At a zero vector the real
    2-norm has no unique derivative, so that VJP is domain_undefined rather than assigned PyTorch's zero convention.
  basis: [T_VECTOR_NORM.DEF, TS_NATIVE_FUNCTIONS.REDUCE_SCHEMAS]
clauses:
- {id: RD.C1, basis: [T_SUM.DEF, T_MEAN.DEF, T_MEAN.EMPTY, RD.SCHEMA, RD.EMPTY], statement: 'sum and mean over the selected dimensions, including input conversion and empty domains', observes: [out], evidence_kind: definition}
- {id: RD.C2, basis: [T_PROD.DEF, RD.SCHEMA, RD.EMPTY], statement: 'product over one dimension or all elements, with empty product 1', observes: [out], evidence_kind: definition}
- {id: RD.C3, basis: [T_AMAX.DEF, T_AMIN.DEF, RD.EMPTY], statement: 'amax and amin over one or more dimensions; an empty reduced axis is invalid', observes: [out], evidence_kind: definition}
- {id: RD.C4, basis: [T_ARGMAX.DEF, T_ARGMIN.DEF, T_MAX.DIM, T_MIN.DIM], statement: 'argmax/argmin and max/min along one dimension return the first extreme index', observes: [out], evidence_kind: definition}
- {id: RD.C5, basis: [T_CUMSUM.DEF, RD.SCHEMA, RD.EMPTY], statement: 'cumsum along one dimension, after any explicit input conversion', observes: [out], evidence_kind: definition}
- {id: RD.C6, basis: [T_LOGSUMEXP.DEF, RD.SCHEMA, RD.EMPTY], statement: 'logsumexp is log of the sum of exponentials over one or more dimensions; an empty reduced set gives -inf', observes: [out], evidence_kind: definition}
- {id: RD.C7, basis: [RD.VJP, T_SUM.DEF, T_MEAN.DEF, T_PROD.DEF], statement: 'sum, mean and product VJPs are the derivatives of their selected forward tasks', observes: [out], evidence_kind: derived}
- {id: RD.C8, basis: [RD.VJP, T_AMAX.GRAD, T_MAX.DIM, T_MIN.DIM], statement: 'amax/amin VJPs split ties evenly; max/min dimension VJPs select the returned first index', observes: [out], evidence_kind: derived}
- {id: RD.C9, basis: [RD.VJP, T_LOGSUMEXP.DEF, T_CUMSUM.DEF], statement: 'logsumexp VJP is the softmax over the reduced slice; cumsum VJP is the reverse cumulative sum', observes: [out], evidence_kind: derived}
- {id: RD.C10, basis: [RD.SCHEMA], statement: 'only finite f16/bf16/f32/f64 default functional calls and matching-dtype VJPs are admitted', observes: [out], evidence_kind: definition}
- {id: RD.C11, basis: [RD.VAR, T_VAR.DEF], statement: 'selected variance is the exact corrected sum of squared deviations for correction 0 or 1 and positive degrees of freedom', observes: [out], evidence_kind: definition}
- {id: RD.C12, basis: [RD.VAR, RD.VJP, T_VAR.DEF], statement: 'variance VJP is upstream times 2(x-mean)/(N-correction), including zero for a constant slice when the denominator is positive', observes: [out], evidence_kind: derived}
- {id: RD.C13, basis: [RD.STD, T_STD.DEF], statement: 'selected standard deviation is the nonnegative square root of selected variance for correction 0 or 1 and positive degrees of freedom', observes: [out], evidence_kind: definition}
- {id: RD.C14, basis: [RD.STD, RD.VJP, T_STD.DEF], statement: 'standard-deviation VJP is upstream times (x-mean)/((N-correction) std) for positive std; a one-element correction-zero slice has zero VJP and a larger zero-variance slice is undefined', observes: [out], evidence_kind: derived}
- {id: RD.C15, basis: [RD.VAR_MEAN, T_VAR_MEAN.DEF], statement: 'selected var-mean returns the complete ordered pair of corrected variance and mean', observes: [out], evidence_kind: definition}
- {id: RD.C16, basis: [RD.VAR_MEAN, RD.VJP, T_VAR.DEF, T_MEAN.DEF], statement: 'var-mean input VJP is the sum of the variance and mean VJPs for the two explicit upstream tensors', observes: [out], evidence_kind: derived}
- {id: RD.C17, basis: [RD.VECTOR_NORM, T_VECTOR_NORM.DEF], statement: 'selected public linalg vector 2-norm is the nonnegative square root of the sum of squares over the selected dimensions', observes: [out], evidence_kind: definition}
- {id: RD.C18, basis: [RD.VECTOR_NORM, RD.VJP, T_VECTOR_NORM.DEF], statement: 'at positive norm, the vector 2-norm input VJP is broadcast(upstream) times x divided by norm; a zero-norm slice is undefined', observes: [out], evidence_kind: derived}
