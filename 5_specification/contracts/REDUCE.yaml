signature:
  inputs: ['op: one of the selected default functional names', 'args as in the retained PyTorch 2.10 schemas; VJP operations take (upstream, input, forward arguments)']
  pre_state: []
  post_state: []
  observation_unit: the complete reduction result or complete input gradient
domain:
  valid: [finite f16/bf16/f32/f64 tensors; valid integer dimensions; optional explicit floating dtype where declared; selected variance, standard-deviation and var-mean correction 0 or 1 with positive degrees of freedom; standard-deviation VJP with positive std or a one-element correction-zero slice; public f32/f64 linalg vector 2-norm with omitted dtype and positive norm for VJP]
  domain_undefined: [mean over an empty reduced set; variance or standard deviation with N minus correction non-positive; standard-deviation VJP on a zero-variance slice containing more than one element; vector 2-norm VJP on a zero-norm slice]
  invalid_input: [dimensions out of range or repeated; empty extrema; malformed or nonboolean keepdim; prod with multiple dimensions; logsumexp with no dimensions; VJP upstream shape or dtype different from the forward output]
  unsupported: [integer, boolean, float8, complex or nonfinite tensors; out and named-dimension overloads; unselected variance, standard-deviation or var-mean corrections and overloads; deprecated torch.norm; vector-norm orders other than two, f16/bf16 vector-norm inputs and explicit vector-norm dtype conversion]
mutation_requirements:
- {id: RD.M1, misreading: argmax returns the last maximal index, witnesses: [RD.E10]}
- {id: RD.M2, misreading: amax gradient goes entirely to the first maximal element, witnesses: [RD.E19]}
- {id: RD.M3, misreading: max-along-dim gradient splits evenly among ties, witnesses: [RD.E20]}
- {id: RD.M4, misreading: product gradient is computed as product divided by the selected element, witnesses: [RD.E18]}
- {id: RD.M5, misreading: mean of an empty set is zero, witnesses: [RD.E5]}
- {id: RD.M6, misreading: cumsum gradient is the forward cumulative sum, witnesses: [RD.E22]}
- {id: RD.M7, misreading: logsumexp returns the sum of exponentials without taking log, witnesses: [RD.E14]}
- {id: RD.M8, misreading: the finite floating profile silently accepts integer tensors, witnesses: [RD.E24]}
- {id: RD.M9, misreading: prod accepts a list of dimensions in the selected default overload, witnesses: [RD.E27]}
- {id: RD.M10, misreading: a VJP accepts an upstream tensor with a different dtype, witnesses: [RD.E29]}
- {id: RD.M11, misreading: variance always divides by N and ignores correction, witnesses: [RD.E32]}
- {id: RD.M12, misreading: variance VJP omits the factor 2, witnesses: [RD.E33]}
- {id: RD.M13, misreading: standard deviation returns variance without the square root, witnesses: [RD.E38]}
- {id: RD.M14, misreading: standard-deviation VJP omits division by std, witnesses: [RD.E40]}
- {id: RD.M15, misreading: standard deviation ignores correction and always uses Bessel correction, witnesses: [RD.E39]}
- {id: RD.M16, misreading: var-mean returns mean before variance, witnesses: [RD.E45]}
- {id: RD.M17, misreading: var-mean VJP ignores the mean upstream, witnesses: [RD.E47]}
- {id: RD.M18, misreading: var-mean VJP ignores the variance upstream, witnesses: [RD.E47]}
- {id: RD.M19, misreading: vector 2-norm returns the sum of squares without the square root, witnesses: [RD.E49]}
- {id: RD.M20, misreading: vector 2-norm VJP omits division by the norm, witnesses: [RD.E51]}
nonclaims:
- Accumulation order, intermediate rounding, output rounding and device reduction strategy are numerical effects in K - G.
- Deprecated torch.norm, other vector-norm orders and dtype conversions, unselected variance/standard-deviation/var-mean corrections and overloads, integer overflow, nonfinite arithmetic, named dimensions and out buffers remain outside this reviewed profile.
changes:
- date: '2026-10-18'
  change: >-
    The runtime contract was narrowed from a single broad draft spanning statistics and norm edge conventions to the
    common finite floating reductions that can be sourced and independently checked now. The previous full draft is
    retained under contracts/draft and is never loaded by the runtime registry.
  trigger: >-
    A contract-wide admission result could not honestly certify routine sum/mean/cumsum while unresolved zero-norm and
    zero-variance derivative choices remained in the same profile. PyTorch 2.10 schemas also exposed keyword-only dtype,
    single-dimension prod and required-dimension logsumexp boundaries that the former executable interface accepted too broadly.
- date: '2026-10-19'
  change: >-
    Admit only torch.var's finite correction overload and its complete input VJP for correction 0 or 1 with positive
    degrees of freedom. Keep std, var_mean, norm, other corrections and legacy overloads outside the profile.
  trigger: >-
    The former rejection grouped variance with the genuinely singular zero-standard-deviation gradient. Re-reading
    the PyTorch 2.10 formula and schema shows that variance itself has an unambiguous polynomial VJP on this range.
- date: '2026-10-19'
  change: >-
    Admit torch.std's matching correction overload and forward value, plus its VJP only where the exact real derivative
    is unique: positive std, or the one-element correction-zero constant function.
  trigger: >-
    The official formula and schema make the forward task precise. Restricting the VJP domain avoids treating PyTorch's
    zero gradient convention for larger constant slices as a generally valid derivative of the real standard deviation.
- date: '2026-10-19'
  change: >-
    Admit torch.var_mean's matching correction overload, its complete ordered pair and a combined input VJP with
    separate variance and mean upstream tensors.
  trigger: >-
    The official documentation and schema specify both outputs. Treating either output or either upstream as optional
    would let a partial reference pass a fused multi-output implementation.
- date: '2026-10-19'
  change: >-
    Admit public torch.linalg.vector_norm only for real f32/f64 order-two calls without explicit dtype conversion, and
    admit its input VJP only on positive-norm slices.
  trigger: >-
    The official PyTorch 2.10 definition and native schema fix this public task. Restricting the VJP excludes the
    zero-vector kink instead of turning PyTorch's implementation convention into a universal derivative.
