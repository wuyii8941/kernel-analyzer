schema_version: '1.2'
id: SOFTMAX
role: SOFTMAX
title: Softmax, log-softmax, safe softmax, their backward operations and Inductor's prepare_softmax_online
review:
  status: drafted
  author: Claude (spec v3 author), 2026-10-16
  date: '2026-10-16'
  scope: Real-number values of the documented operations; awaiting a review by someone who did not write it
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, contract_and_implementation_hashes_bound]
covers: [aten._softmax, aten._log_softmax, aten._safe_softmax, aten._softmax_backward_data, aten._log_softmax_backward_data,
  prims.prepare_softmax_online]
profiles:
  real:
    meaning: Softmax along dim of exact real inputs (with -inf for masked entries); results are rigorous enclosures,
      exact where rational (e.g. equal entries give 1/n).
    task_choice_required: false
outputs:
  out:
    shape: per operation; prepare_softmax_online returns two tensors with the reduced dim kept
    guarantee: rigorous_enclosure
comparison:
  input_binding: Tensor values are the exact values received.
  quality: No tolerance.
  test_evidence: Containment of the exact expected values in the reference enclosures.
  error_handling: A row whose entries are all -inf (or contain +inf) has no softmax; domain_undefined except for
    _safe_softmax, which documents zeros.
decisions:
- id: SM.MASKED_ROW
  status: drafted
  statement: 'Softmax and log-softmax of a row whose entries are all -inf are 0/0: domain_undefined (devices return NaN,
    zeros or garbage; none is demanded). _safe_softmax defines that row as zeros (its decomposition), so there the
    zeros are the value. A row containing +inf is domain_undefined. Entries equal to -inf in a row with a finite
    entry get probability 0 (the limit).'
  basis: [T_SOFTMAX.DEF, TS_DECOMP.SAFE_SOFTMAX]
- id: SM.PSO_MASKED
  status: drafted
  statement: prepare_softmax_online of an all -inf row computes exp(-inf - (-inf)); the real target is undefined
    (domain_undefined).
  basis: [TS_INDUCTOR_PRIMS.PSO]
clauses:
- {id: SM.C1, basis: [T_SOFTMAX.DEF, SM.MASKED_ROW], statement: 'softmax = exp(x_i) / sum_j exp(x_j) along dim; -inf
    entries get 0', observes: [out], evidence_kind: definition}
- {id: SM.C2, basis: [T_LOG_SOFTMAX.DEF, SM.MASKED_ROW], statement: 'log_softmax = x_i - log sum_j exp(x_j) along dim',
  observes: [out], evidence_kind: definition}
- {id: SM.C3, basis: [TS_DECOMP.SAFE_SOFTMAX, SM.MASKED_ROW], statement: _safe_softmax = softmax with all -inf rows set to 0,
  observes: [out], evidence_kind: definition}
- {id: SM.C4, basis: [TS_DECOMP.SOFTMAX_BWD, T_SOFTMAX.DEF], statement: '_softmax_backward_data(g, y) = y*g - y * sum(y*g)
    along dim (the VJP of softmax)', observes: [out], evidence_kind: definition}
- {id: SM.C5, basis: [TS_DECOMP.LOG_SOFTMAX_BWD, T_LOG_SOFTMAX.DEF], statement: '_log_softmax_backward_data(g, y) = g -
    exp(y) * sum(g) along dim', observes: [out], evidence_kind: definition}
- {id: SM.C6, basis: [TS_INDUCTOR_PRIMS.PSO, SM.PSO_MASKED], statement: 'prepare_softmax_online(x, dim) = (amax(x, dim,
    keepdim), sum(exp(x - amax), dim, keepdim))', observes: [out], evidence_kind: definition}
examples:
- {id: SM.E1, profile: real, clauses: [SM.C1], input: {op: aten._softmax, args: [{t: f32, v: [[0, 0], [0, 1]]}, 1, false]},
  expected: {outcome: value, fields: {out: [['1/2', '1/2'], [1/(1+exp(1)), exp(1)/(1+exp(1))]]}}}
- {id: SM.E2, profile: real, clauses: [SM.C1], input: {op: aten._softmax, args: [{t: f32, v: [[1, -inf, 1]]}, 1, false]}, expected: {
    outcome: value, fields: {out: [['1/2', 0, '1/2']]}}}
- {id: SM.E3, profile: real, clauses: [SM.C1], input: {op: aten._softmax, args: [{t: f32, v: [[-inf, -inf]]}, 1, false]}, expected: {
    outcome: domain_undefined}}
- {id: SM.E4, profile: real, clauses: [SM.C1], input: {op: aten._softmax, args: [{t: f32, v: [[0, 1], [0, 2]]}, 0, false]}, expected: {
    outcome: value, fields: {out: [['1/2', 1/(1+exp(1))], ['1/2', exp(1)/(1+exp(1))]]}}}
- {id: SM.E5, profile: real, clauses: [SM.C2], input: {op: aten._log_softmax, args: [{t: f32, v: [[0, 0, 0], [1, -inf, 1]]}, 1,
      false]}, expected: {outcome: value, fields: {out: [[-log(3), -log(3), -log(3)], [-log(2), -inf, -log(2)]]}}}
- {id: SM.E6, profile: real, clauses: [SM.C2], input: {op: aten._log_softmax, args: [{t: f32, v: [[-inf, -inf]]}, 1, false]},
  expected: {outcome: domain_undefined}}
- {id: SM.E7, profile: real, clauses: [SM.C3], input: {op: aten._safe_softmax, args: [{t: f32, v: [[-inf, -inf], [0, -inf]]}, 1]},
  expected: {outcome: value, fields: {out: [[0, 0], [1, 0]]}}}
- {id: SM.E8, profile: real, clauses: [SM.C4], input: {op: aten._softmax_backward_data, args: [{t: f32, v: [[1, 0]]}, {t: f32,
        v: [['1/4', '3/4']]}, 1, f32]}, expected: {outcome: value, fields: {out: [['3/16', '-3/16']]}}, note: 'y*g = [1/4, 0],
    sum 1/4; y*g - y/4 = [1/4 - 1/16, -3/16].'}
- {id: SM.E9, profile: real, clauses: [SM.C5], input: {op: aten._log_softmax_backward_data, args: [{t: f32, v: [[1, 2]]}, {t: f32,
        v: [[0, -inf]]}, 1, f32]}, expected: {outcome: value, fields: {out: [[-2, 2]]}}, note: 'exp(y) = [1, 0], sum g = 3; g -
    exp(y) * 3 = [1 - 3, 2 - 0].'}
- {id: SM.E10, profile: real, clauses: [SM.C6], input: {op: prims.prepare_softmax_online, args: [{t: f32, v: [[0, 1], [2, 2]]},
      1]}, expected: {outcome: value, fields: {out: [[[1], [2]], [[1+exp(-1)], [2]]]}}}
- {id: SM.E11, profile: real, clauses: [SM.C6], input: {op: prims.prepare_softmax_online, args: [{t: f32, v: [[-inf, -inf]]},
      1]}, expected: {outcome: domain_undefined}}
signature:
  inputs: ['op: one of the covered names', 'args as in ATen: (input, dim, half_to_float) / (grad, output, dim, input_dtype) / (input, dim)']
  pre_state: []
  post_state: []
  observation_unit: the result tensor(s) of one operation
domain:
  valid: [exact real values and -inf entries]
  domain_undefined: [rows that are all -inf (except _safe_softmax), rows containing +inf]
  invalid_input: [NaN values, dim out of range]
  unsupported: []
mutation_requirements:
- {id: SM.M1, misreading: softmax along the wrong dim (always the last), witnesses: [SM.E4]}
- {id: SM.M2, misreading: an all -inf row gives a uniform distribution, witnesses: [SM.E3]}
- {id: SM.M3, misreading: '-inf entries treated as 0 logits', witnesses: [SM.E2]}
- {id: SM.M4, misreading: softmax backward without the sum term (g * y), witnesses: [SM.E8]}
- {id: SM.M5, misreading: 'log_softmax backward uses y instead of exp(y)', witnesses: [SM.E9]}
- {id: SM.M6, misreading: prepare_softmax_online returns sum exp(x) without subtracting the max, witnesses: [SM.E10]}
- {id: SM.M7, misreading: _safe_softmax leaves masked rows undefined, witnesses: [SM.E7]}
nonclaims:
- How a kernel stabilises the computation (max subtraction, online rescaling) is numerical (K - G).
changes: []
