- {id: ACT.E16, profile: torch, clauses: [ACT.C7], input: {op: aten.softplus, args: [{t: f32, v: [6]}], kwargs: {beta: 4,
      threshold: 20}}, expected: {outcome: value, fields: {out: [6]}}, note: 'beta x = 24 > 20 although x = 6 < 20'}
- {id: ACT.E17, profile: torch, clauses: [ACT.C7], input: {op: aten.softplus_backward, args: [{t: f32, v: [2, 3]}, {t: f32,
        v: [0, 21]}], kwargs: {beta: 1, threshold: 20}}, expected: {outcome: value, fields: {out: [1, 3]}}}
- {id: ACT.E18, profile: softplus_formula, clauses: [ACT.C8], input: {op: aten.softplus, args: [{t: f32, v: [21]}], kwargs: {
      beta: 1, threshold: 20}}, expected: {outcome: value, fields: {out: ['log(1+exp(21))']}}}
- {id: ACT.E19, profile: softplus_formula, clauses: [ACT.C8], input: {op: aten.softplus_backward, args: [{t: f32, v: [1]},
      {t: f32, v: [21]}], kwargs: {beta: 1, threshold: 20}}, expected: {outcome: value, fields: {out: ['1/(1+exp(-21))']}}}
- {id: ACT.E20, profile: torch, clauses: [ACT.C9], input: {op: aten.tanh_backward, args: [{t: f32, v: [2, 1]}, {t: f32, v: [
          '1/2', 0]}]}, expected: {outcome: value, fields: {out: ['3/2', 1]}}}
- {id: ACT.E21, profile: torch, clauses: [ACT.C9], input: {op: aten.sigmoid_backward, args: [{t: f32, v: [4]}, {t: f32, v: [
          '1/4']}]}, expected: {outcome: value, fields: {out: ['3/4']}}}
- {id: ACT.E22, profile: torch, clauses: [ACT.C10], input: {op: act.swiglu, args: [{t: f32, v: [1, 0]}, {t: f32, v: [2, 5]}]},
