schema_version: '1.2'
id: ACT
role: ACT
title: Activation functions (ReLU, GELU both forms, SiLU, Softplus) with their VJPs, tanh/sigmoid VJPs, and the GLU
  composites SwiGLU / GeGLU, real-number semantics
review:
  status: drafted
  author: Claude (spec v3 author, group C_act_norm_loss), 2026-10-17
  date: '2026-10-17'
  scope: Real-number semantics of the documented activations and of the VJPs obtained by differentiating them; awaiting
    a review by someone who did not write it
activation:
  implementation_status: pending
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction, contract_and_implementation_hashes_bound]
covers: [aten.relu, aten.threshold_backward, aten.gelu, aten.gelu_backward, aten.silu, aten.silu_backward, aten.softplus,
  aten.softplus_backward, aten.tanh_backward, aten.sigmoid_backward, act.swiglu, act.swiglu_backward, act.geglu,
  act.geglu_backward]
profiles:
  torch:
    meaning: The PyTorch 2.10 documented functions; relu'(0) = 0 (autograd minimum-norm sub-gradient); softplus includes
      the documented reversion to the linear function where beta*x > threshold; gelu per its approximate argument;
      GLU composites as the GLU-variants paper and Liger define them.
    task_choice_required: false
  softplus_formula:
    meaning: As `torch`, except that softplus and its VJP are the displayed formula (1/beta) log(1 + exp(beta x)) for
      every x, the reversion sentence being read as a numerical device of the implementation (decision
      ACT.SOFTPLUS_THRESHOLD).
    task_choice_required: true
outputs:
  out:
    shape: the operation's result (the input's shape); the GLU VJPs give the list [da, db]
    guarantee: rigorous_enclosure
comparison:
  input_binding: Tensor values are the exact values received (a binary float is its exact rational value); the
    documented decimal constants (0.044715) are exact decimals, not their binary roundings (decision ACT.GELU_FORMS).
  quality: No tolerance; exact results compare exactly, transcendental results as rigorous enclosures.
  test_evidence: Enclosure containment of hand / sympy derived closed forms.
  error_handling: Invalid arguments are invalid_input; infinite inputs are unsupported (decision ACT.FINITE).
decisions:
- id: ACT.RELU0
  status: drafted
  statement: The VJP of relu is threshold_backward(g, x, 0) = g where x > 0 and 0 where x <= 0, so relu'(0) = 0.
    Basis - the autograd notes take, at a non-differentiable point of a locally convex function, the sub-gradient of
    minimum norm (the sub-differential of max(0, x) at 0 is [0, 1], minimum norm 0), and torch's threshold_backward
    is where(x <= threshold, 0, g). Alternatives - (a) any element of the sub-differential, the v2.4 'math' profile
    (an interval of answers, not a single VJP; not adopted because the notes fix the value for torch's VJP, recorded
    here for a task that wants it); (b) the v1 set {0, upstream} (no source; rejected, SPECIFICATION_v2 section 3);
    (c) relu'(0) = 1 (no source; mutant ACT.M1).
  basis: [ACT_AUTOGRAD.NONDIFF, ACT_DECOMP.THRESHOLD_BWD]
- id: ACT.PHI
  status: drafted
  statement: Phi in GELU(x) = x Phi(x) is the standard Gaussian CDF, Phi(x) = (1 + erf(x / sqrt 2)) / 2 (identity of
    the normal distribution; erf as torch.special documents it). The page does not state mean 0 / variance 1;
    'the Cumulative Distribution Function for Gaussian Distribution' is read as the standard one, as in the GELU paper
    cited there and in torch's own decomposition. No other reading found.
  basis: [T_GELU.DEF, T_SPECIAL.ERF, ACT_DECOMP.GELU_BWD]
- id: ACT.GELU_FORMS
  status: drafted
  statement: approximate='tanh' selects its own declared function 0.5 x (1 + tanh(sqrt(2/pi) (x + 0.044715 x^3)))
    with the exact constants 44715/1000000 and sqrt(2/pi); it is compared with that function only, not with the erf
    form plus a tolerance. Alternatives - (a) treat 'tanh' as an approximation of x Phi(x) with an undeclared
    tolerance (rejected, no tolerance is documented); (b) use the binary constants of an implementation (rejected,
    the document gives decimals). An approximate value other than 'none' / 'tanh' is invalid_input.
  basis: [T_GELU.TANH, T_GELU_F.TANH]
- id: ACT.SOFTPLUS_THRESHOLD
  status: drafted
  statement: 'The pages display Softplus(x) = (1/beta) log(1 + exp(beta x)) and add "for numerical stability the
    implementation reverts to the linear function when input x beta > threshold". Two legal readings - (a) profile
    torch: the reversion is part of the operator (output x for beta x > threshold, strictly greater; VJP 1 there,
    as torch''s decomposition does); (b) profile softplus_formula: the displayed function for every x (VJP
    sigma(beta x)). Neither is forced by the text; torch is the default because the page states what the API returns,
    softplus_formula needs an explicit task binding. beta = 0 makes 1/beta undefined (domain_undefined).'
  basis: [T_SOFTPLUS.DEF, T_SOFTPLUS.THRESH, T_SOFTPLUS_F.THRESH, ACT_DECOMP.SOFTPLUS_BWD]
- id: ACT.VJP
  status: drafted
  statement: 'A VJP is the derivative of the declared function times the explicit upstream g (element-wise): gelu
    none g (Phi(x) + x phi(x)), phi the standard normal density; gelu tanh g (0.5 (1 + tanh u) + 0.5 x (1 - tanh^2 u)
    sqrt(2/pi) (1 + 3 0.044715 x^2)), u = sqrt(2/pi)(x + 0.044715 x^3); silu g sigma(x) (1 + x (1 - sigma(x))). These
    follow by differentiation and agree with torch''s decompositions. tanh_backward and sigmoid_backward take the
    forward output y (ATen convention): g (1 - y^2) and g y (1 - y).'
  basis: [ACT_DECOMP.GELU_BWD, ACT_DECOMP.SILU_BWD, ACT_DECOMP.TANH_BWD, ACT_DECOMP.SIGMOID_BWD, T_TANH.DEF,
    T_SPECIAL.EXPIT]
- id: ACT.GEGLU_FORM
  status: drafted
  statement: GEGLU uses GELU(x) = x Phi(x) in the GLU-variants paper; Liger's LigerGELUMulFunction uses the tanh form
    only; the phase-2b condition used F.gelu(a) * b (erf form). The GELU form is therefore an explicit argument
    approximate of act.geglu / act.geglu_backward, default 'none' (the paper's GELU); a binding to Liger passes
    'tanh'. Alternative (fix one form for geglu) rejected because the tested implementations differ.
  basis: [ACT_GLU_FULL.GLU, ACT_GLU_FULL.ACTS, ACT_LIGER_GEGLU.FWD]
- id: ACT.GLU_SHAPES
  status: drafted
  statement: act.swiglu(a, b) = silu(a) * b and act.geglu(a, b) = gelu(a) * b are component-wise products of operands
    of one shape (the paper's component-wise product of two projections; Liger views both as (-1, n_cols) without
    broadcasting). Operands of different shapes are invalid_input; broadcasting is not part of these composites.
    SwiGLU's Swish_beta is taken with beta = 1 (FFN_SwiGLU in the paper; silu in Liger).
  basis: [ACT_GLU_FULL.GLU, ACT_LIGER_SWIGLU.FWD, ACT_LIGER_GEGLU.FWD]
- id: ACT.FINITE
  status: drafted
  statement: The profiles cover finite real inputs. Infinite inputs are legal for the API but are outside the
    profiles (unsupported), because limits such as gelu(-inf) = 0 would need a limit convention the pages do not
    state; no tested condition has infinite inputs (phase-2b huge values are about 1e30, finite). NaN is not a real
    value and is invalid_input.
  basis: [T_GELU.DEF, T_SILU.DEF, T_SOFTPLUS.DEF]
clauses:
- {id: ACT.C1, basis: [T_RELU.DEF, T_RELU_F.DEF], statement: 'relu(x) = max(0, x) element-wise', observes: [out],
  evidence_kind: definition}
- {id: ACT.C2, basis: [ACT.RELU0, ACT_DECOMP.THRESHOLD_BWD], statement: 'threshold_backward(g, x, t) = g where x > t,
    0 where x <= t; with t = 0 it is the VJP of relu (relu''(0) = 0)', observes: [out], evidence_kind: definition}
- {id: ACT.C3, basis: [T_GELU.DEF, T_GELU_F.DEF, ACT.PHI], statement: 'gelu(x, none) = x (1 + erf(x / sqrt 2)) / 2',
  observes: [out], evidence_kind: definition}
- {id: ACT.C4, basis: [T_GELU.TANH, T_GELU_F.TANH, ACT.GELU_FORMS], statement: 'gelu(x, tanh) = 0.5 x (1 +
    tanh(sqrt(2/pi) (x + 0.044715 x^3))); any other approximate value is invalid_input', observes: [out],
  evidence_kind: definition}
- {id: ACT.C5, basis: [ACT.VJP, ACT.PHI, ACT.GELU_FORMS], statement: 'gelu_backward(g, x, approximate) is the VJP of
    the selected gelu form; finite for every finite x (|x| >= 2^64 included, bug B023)', observes: [out],
  evidence_kind: derived}
- {id: ACT.C6, basis: [T_SILU.DEF, T_SILU_F.DEF, T_SPECIAL.EXPIT, ACT.VJP], statement: 'silu(x) = x / (1 + exp(-x));
    silu_backward(g, x) = g sigma(x) (1 + x (1 - sigma(x)))', observes: [out], evidence_kind: definition}
- {id: ACT.C7, basis: [T_SOFTPLUS.DEF, T_SOFTPLUS.THRESH, ACT.SOFTPLUS_THRESHOLD], statement: 'profile torch -
    softplus(x, beta, threshold) = (1/beta) log(1 + exp(beta x)) if beta x <= threshold, x if beta x > threshold;
    softplus_backward = g sigma(beta x) resp. g', observes: [out], evidence_kind: definition}
- {id: ACT.C8, basis: [T_SOFTPLUS.DEF, ACT.SOFTPLUS_THRESHOLD], statement: 'profile softplus_formula - softplus =
    (1/beta) log(1 + exp(beta x)) and softplus_backward = g sigma(beta x) for every x', observes: [out],
  evidence_kind: definition}
- {id: ACT.C9, basis: [ACT.VJP, ACT_DECOMP.TANH_BWD, ACT_DECOMP.SIGMOID_BWD], statement: 'tanh_backward(g, y) = g (1 -
    y^2), sigmoid_backward(g, y) = g y (1 - y), y the forward output', observes: [out], evidence_kind: derived}
- {id: ACT.C10, basis: [ACT_GLU_FULL.GLU, ACT_LIGER_SWIGLU.FWD, ACT_LIGER_SWIGLU.BWD, ACT.GLU_SHAPES, ACT.VJP],
  statement: 'act.swiglu(a, b) = silu(a) b; act.swiglu_backward(g, a, b) = [g b silu''(a), g silu(a)]',
  observes: [out], evidence_kind: definition}
- {id: ACT.C11, basis: [ACT_GLU_FULL.GLU, ACT_LIGER_GEGLU.FWD, ACT_LIGER_GEGLU.BWD, ACT.GEGLU_FORM, ACT.GLU_SHAPES],
  statement: 'act.geglu(a, b, approximate) = gelu(a, approximate) b; act.geglu_backward(g, a, b, approximate) =
    [g b gelu''(a), g gelu(a)]', observes: [out], evidence_kind: definition}
- {id: ACT.C12, basis: [ACT.GLU_SHAPES, ACT.GELU_FORMS], statement: 'GLU operands of different shapes and unknown
    approximate values are invalid_input', observes: [out], evidence_kind: definition}
examples:
- {id: ACT.E1, profile: torch, clauses: [ACT.C1], input: {op: aten.relu, args: [{t: f32, v: [-2, 0, '1/2', 3]}]},
  expected: {outcome: value, fields: {out: [0, 0, '1/2', 3]}}}
- {id: ACT.E2, profile: torch, clauses: [ACT.C2], input: {op: aten.threshold_backward, args: [{t: f32, v: [5, 7, -3]},
      {t: f32, v: [-1, 0, 2]}, 0]}, expected: {outcome: value, fields: {out: [0, 0, -3]}},
  note: relu'(0) = 0 at the middle element (phase-2b relu x zeros condition)}
- {id: ACT.E3, profile: torch, clauses: [ACT.C2], input: {op: aten.threshold_backward, args: [{t: f32, v: [2, 2]}, {t: f32,
        v: ['1/2', 1]}, '1/2']}, expected: {outcome: value, fields: {out: [0, 2]}}}
- {id: ACT.E4, profile: torch, clauses: [ACT.C1, ACT.C2], input: {op: aten.threshold_backward, args: [{t: f32, v: [1, 1]},
      {t: f32, v: ['1/1000000000000000000000000000000', -1000000000000000000000000000000]}, 0]}, expected: {outcome: value,
    fields: {out: [1, 0]}}, note: phase-2b tiny / huge magnitudes}
- {id: ACT.E5, profile: torch, clauses: [ACT.C3], input: {op: aten.gelu, args: [{t: f32, v: [0, 1, -1]}]}, expected: {
    outcome: value, fields: {out: [0, '(1+erf(1/sqrt(2)))/2', '-(1-erf(1/sqrt(2)))/2']}}}
- {id: ACT.E6, profile: torch, clauses: [ACT.C4], input: {op: aten.gelu, args: [{t: f32, v: [0, 1]}], kwargs: {approximate: tanh}},
  expected: {outcome: value, fields: {out: [0, '(1+tanh(sqrt(2/pi)*(1+44715/1000000)))/2']}}}
- {id: ACT.E7, profile: torch, clauses: [ACT.C3], input: {op: aten.gelu, args: [{t: f32, v: [1000000000000000000000000000000,
          -1000000000000000000000000000000, '1/1000000000000000000000000000000']}]}, expected: {outcome: value, fields: {
      out: ['1000000000000000000000000000000*(1+erf(1000000000000000000000000000000/sqrt(2)))/2',
        '-1000000000000000000000000000000*(1+erf(-1000000000000000000000000000000/sqrt(2)))/2',
        '(1+erf(1/(1000000000000000000000000000000*sqrt(2))))/2000000000000000000000000000000']}}, note: phase-2b huge /
    tiny}
- {id: ACT.E8, profile: torch, clauses: [ACT.C5], input: {op: aten.gelu_backward, args: [{t: f32, v: [2]}, {t: f32, v: [1]}]},
  expected: {outcome: value, fields: {out: ['2*((1+erf(1/sqrt(2)))/2+exp(-1/2)/sqrt(2*pi))']}}}
- {id: ACT.E9, profile: torch, clauses: [ACT.C5], input: {op: aten.gelu_backward, args: [{t: f32, v: [1]}, {t: f32, v: [1]}],
    kwargs: {approximate: tanh}}, expected: {outcome: value, fields: {out: ['(1+tanh(sqrt(2/pi)*(1+44715/1000000)))/2+(1-tanh(sqrt(2/pi)*(1+44715/1000000))*tanh(sqrt(2/pi)*(1+44715/1000000)))*sqrt(2/pi)*(1+3*44715/1000000)/2']}}}
- id: ACT.E10
  profile: torch
  clauses: [ACT.C5]
  input: {op: aten.gelu_backward, args: [{t: f32, v: [1, 1]}, {t: f32, v: [18446744073709551616, -18446744073709551616]}],
    kwargs: {approximate: tanh}}
  expected:
    outcome: value
    fields:
      out:
      - (1+tanh(sqrt(2/pi)*(18446744073709551616+44715/1000000*18446744073709551616**3)))/2+18446744073709551616*(1-tanh(sqrt(2/pi)*(18446744073709551616+44715/1000000*18446744073709551616**3))*tanh(sqrt(2/pi)*(18446744073709551616+44715/1000000*18446744073709551616**3)))*sqrt(2/pi)*(1+3*44715/1000000*18446744073709551616**2)/2
      - (1+tanh(sqrt(2/pi)*(-18446744073709551616-44715/1000000*18446744073709551616**3)))/2-18446744073709551616*(1-tanh(sqrt(2/pi)*(-18446744073709551616-44715/1000000*18446744073709551616**3))*tanh(sqrt(2/pi)*(-18446744073709551616-44715/1000000*18446744073709551616**3)))*sqrt(2/pi)*(1+3*44715/1000000*18446744073709551616**2)/2
  note: Bug B023 - at |x| = 2^64 the real derivative of the tanh form is finite (about 1 and about 0); float32 x*x
    overflows and the device returns NaN.
- {id: ACT.E11, profile: torch, clauses: [ACT.C6], input: {op: aten.silu, args: [{t: f32, v: [0, 1, -1]}]}, expected: {
    outcome: value, fields: {out: [0, '1/(1+exp(-1))', '-1/(1+exp(1))']}}}
- {id: ACT.E12, profile: torch, clauses: [ACT.C6], input: {op: aten.silu, args: [{t: f32, v: [1000000000000000000000000000000,
          -1000]}]}, expected: {outcome: value, fields: {out: ['1000000000000000000000000000000/(1+exp(-1000000000000000000000000000000))',
        '-1000/(1+exp(1000))']}}, note: 'large magnitudes; silu(-1e30) is about -1e30 exp(-1e30), whose enclosure endpoints
    cannot be converted to exact fractions by kernel_spec.num.ends (shared-code limitation reported), so the negative
    side uses -1000'}
- {id: ACT.E13, profile: torch, clauses: [ACT.C6], input: {op: aten.silu_backward, args: [{t: f32, v: [3, 4]}, {t: f32,
        v: [1, 0]}]}, expected: {outcome: value, fields: {out: ['3*(2-1/(1+exp(-1)))/(1+exp(-1))', 2]}}}
- {id: ACT.E14, profile: torch, clauses: [ACT.C7], input: {op: aten.softplus, args: [{t: f32, v: [0, 1, 21, 20]}], kwargs: {
