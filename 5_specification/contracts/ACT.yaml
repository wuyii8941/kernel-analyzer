- {id: ACT.E30, profile: torch, clauses: [ACT.C12, ACT.C5], input: {op: aten.gelu_backward, args: [{t: f32, v: [1]}, {t: f32,
        v: [1]}], kwargs: {approximate: fast}}, expected: {outcome: invalid_input}}
signature:
  inputs: ['op: one of the covered names', 'args / kwargs as ATen: gelu(x, approximate), gelu_backward(g, x, approximate),
      silu_backward(g, x), softplus(x, beta, threshold), softplus_backward(g, x, beta, threshold), threshold_backward(g,
      x, threshold), tanh_backward(g, y), sigmoid_backward(g, y); act.swiglu(a, b), act.swiglu_backward(g, a, b),
      act.geglu(a, b, approximate), act.geglu_backward(g, a, b, approximate)', 'tensors {t: dtype, v: values}']
  pre_state: []
  post_state: []
  observation_unit: the result tensor of one operation (the GLU VJPs - both gradients)
domain:
  valid: [finite real values, any shape; the GLU operands of one shape]
  domain_undefined: [softplus with beta = 0]
  invalid_input: [NaN, unknown approximate value, GLU operands of different shapes, non-broadcastable shapes]
  unsupported: [infinite input values (decision ACT.FINITE), complex dtypes]
mutation_requirements:
- {id: ACT.M1, misreading: 'relu''(0) = 1 (gradient passed where x >= 0)', witnesses: [ACT.E2]}
- {id: ACT.M2, misreading: 'v1 zero point - the set {0, upstream} at x = 0', witnesses: [ACT.E2]}
- {id: ACT.M3, misreading: approximate ignored (erf form always), witnesses: [ACT.E6]}
- {id: ACT.M4, misreading: tanh form used for approximate='none', witnesses: [ACT.E5]}
- {id: ACT.M5, misreading: gelu_backward without the x * pdf term, witnesses: [ACT.E8, ACT.E9]}
- {id: ACT.M6, misreading: 'silu'' taken as sigmoid', witnesses: [ACT.E13]}
- {id: ACT.M7, misreading: softplus beta ignored, witnesses: [ACT.E15]}
- {id: ACT.M8, misreading: softplus reversion tested on x instead of beta * x, witnesses: [ACT.E16]}
