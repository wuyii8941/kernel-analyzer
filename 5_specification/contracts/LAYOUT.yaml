- {id: LY.E27, profile: real, clauses: [LY.C9], input: {op: aten.tril, args: [{t: f32, v: [[1, 2, 3], [4, 5, 6], [7, 8, 9]]}, -1]}, expected: {outcome: value, fields: {out: [[0, 0, 0], [4, 0, 0], [7, 8, 0]]}}}
- {id: LY.E28, profile: real, clauses: [LY.C10], input: {op: aten.clone, args: [{t: f16, v: ['1/3']}]}, expected: {outcome: invalid_input}}
