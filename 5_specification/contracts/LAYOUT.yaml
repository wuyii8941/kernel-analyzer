- {id: LY.E31, profile: real, clauses: [LY.C10], input: {op: aten.copy, args: [{t: f32, v: [0]}, {t: f32, v: [1]}]}, expected: {outcome: unsupported}}
- {id: LY.E32, profile: real, clauses: [LY.C10], input: {op: aten.clone, args: [{t: f32, v: [1]}], kwargs: {memory_format: contiguous_format}}, expected: {outcome: unsupported}}
- {id: LY.E33, profile: real, clauses: [LY.C10], input: {op: aten.triu, args: [{t: f32, v: [1, 2]}]}, expected: {outcome: invalid_input}}
