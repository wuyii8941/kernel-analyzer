- {id: LY.E21, profile: real, clauses: [LY.C6], input: {op: aten.constant_pad_nd, args: [{t: f32, v: [[1, 2]]}, [1, 0, 0, 1], '1/2']}, expected: {outcome: value, fields: {out: [['1/2', 1, 2], ['1/2', '1/2', '1/2']]}}}
- {id: LY.E22, profile: real, clauses: [LY.C7], input: {op: aten.select_scatter, args: [{t: f32, v: [[0, 0], [0, 0]]}, {t: f32, v: [5, 6]}, 0, 1]}, expected: {outcome: value, fields: {out: [[0, 0], [5, 6]]}}}
