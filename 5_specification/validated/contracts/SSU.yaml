- id: SS.E9
  profile: mamba232_real
  clauses: [SS.C6]
  input:
    state: [[[10]], [[20]]]
    x: [[1], [2]]
    dt: [[1], [1]]
    A: [[0]]
    B: [[1], [1]]
    C: [[1], [1]]
