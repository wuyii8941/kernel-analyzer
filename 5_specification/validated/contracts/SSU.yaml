- id: SS.E11
  profile: mamba232_real
  clauses: [SS.C7]
  input: {<<: *full, dtype: f64}
  expected: {outcome: unsupported}
- id: SS.E12
  profile: mamba232_real
  clauses: [SS.C7]
  input: {<<: *full, x: [[['1/3']]]}
