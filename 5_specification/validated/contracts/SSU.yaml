- id: SS.E16
  profile: mamba232_real
  clauses: [SS.C7]
  input: {<<: *full, q: [[[1]]]}
  expected: {outcome: invalid_input}
- id: SS.E17
  profile: mamba232_real
  clauses: [SS.C7]
  input: {<<: *full, D: null}
  expected: {outcome: unsupported}
- id: SS.E18
  profile: mamba232_real
  clauses: [SS.C7]
