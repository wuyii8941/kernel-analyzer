schema_version: '1.2'
id: SSU
role: SSM_STATE_UPDATE
title: mamba-ssm 2.3.2.post1 selective state update, complete value and state
review:
  status: reviewed_for_implementation
  author: OpenAI Codex, independent implementation review
  date: '2026-10-19'
  scope: Finite physical float32 tensors for one selective_state_update call; complete y and state post-state
activation:
  implementation_status: validated
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers:
- The value and complete state transition of mamba-ssm 2.3.2.post1 selective_state_update
profiles:
  mamba232_real:
    meaning: >-
      Add the supplied dt_bias, optionally apply torch softplus with threshold 20, update state with
      exp(dt*A)*state + dt*B*x, then return the C projection plus D*x and an optional SiLU(z) gate.
      B and C groups are assigned to contiguous head groups. The complete state after the call is part of the result.
    task_choice_required: false
    basis: [SS.TASK, SS.DELTA, SS.STATE, SS.GROUPS]
outputs:
  out:
    shape: '{y: input batch/head/channel shape, state: complete state-pool shape}'
    guarantee: rigorous_enclosure
comparison:
  input_binding: >-
    Every tensor value is the exact physical float32 value received. D and dt_bias are present tensors. Optional z
    and state_batch_indices are explicit nulls when absent; dt_softplus and dtype are explicit.
  complete_output: The complete y tensor and every state-pool coordinate after the call are required.
  quality: Exponential, softplus and sigmoid use rigorous enclosures; rational operations are exact. No tolerance.
  test_evidence: >-
    Independent 768-bit Arb element loops, public PyTorch formulas, six installed mamba-ssm 2.3.2.post1 Triton versus
    reference calls, complete-output checks and rejected state-slot collisions.
  error_handling: >-
    Missing fields, malformed shapes, nonphysical float32 values and out-of-range indices are invalid_input.
    Special values, other dtypes, or absent D/dt_bias are unsupported. Duplicate active state slots are
    not_established because the Triton programs have no declared serial order.
decisions:
- id: SS.TASK
  status: reviewed
  statement: >-
    The selected task is the complete state transition and y value of the installed mamba-ssm 2.3.2.post1
    selective_state_update function. It is the library formula dA=exp(dt*A), dB=dt*B. The paper's full ZOH B-bar
    formula is a different task and remains only in the archived draft. The reviewed executable range requires D and
    dt_bias: although the function signature declares them optional, this version's wrapper raises before launch when
    either is absent.
  basis: [MAMBA232_SSU.FORMULA, MAMBA_PAPER.REC, MAMBA_PAPER.ZOH]
- id: SS.DELTA
  status: reviewed
  statement: >-
    dt_bias is added before softplus. With dt_softplus=true, torch's beta=1 threshold=20 rule uses
    log(1+exp(dt)) at dt <= 20 and the exact linear value at dt > 20.
  basis: [MAMBA232_SSU.FORMULA, T_SOFTPLUS_F.DEF, T_SOFTPLUS_F.THRESH]
- id: SS.STATE
  status: reviewed
  statement: >-
    State is a public in-place post-state and is never omitted from the specification result. A negative mapped slot
    is padding and leaves all state unchanged; distinct nonnegative mappings update their selected pre-state slots.
    Duplicate active slots are not assigned an invented row order.
  basis: [MAMBA232_SSU.STATE]
- id: SS.GROUPS
  status: reviewed
  statement: >-
    B and C group g serves the contiguous heads g*(H/G) through (g+1)*(H/G)-1. H must be divisible by G.
  basis: [MAMBA232_SSU.GROUPS, MAMBA232_SSU.SHAPES]
- id: SS.DTYPE
  status: reviewed
  statement: >-
    This profile accepts only finite physical float32 inputs. Float32 device rounding, exponential approximation,
    reduction order and stores are execution effects measured separately from the exact-real task formula.
  basis: [MAMBA232_SSU.DTYPES]
clauses:
- {id: SS.C1, basis: [SS.TASK], statement: 'state_next = exp(dt*A)*state + dt*B*x at every selected state coordinate.', observes: [out], evidence_kind: definition}
- {id: SS.C2, basis: [SS.TASK], statement: 'y uses the updated state: sum_n C_n*state_next_n plus D*x, followed by optional SiLU(z) multiplication.', observes: [out], evidence_kind: definition}
- {id: SS.C3, basis: [SS.DELTA], statement: 'dt_bias precedes the strict-threshold torch softplus transformation.', observes: [out], evidence_kind: definition}
- {id: SS.C4, basis: [SS.GROUPS], statement: 'Each head uses its contiguous B/C group and H is divisible by G.', observes: [out], evidence_kind: definition}
- {id: SS.C5, basis: [SS.STATE], statement: 'The complete state pool after the call is returned; padding and mapped slots preserve the declared effects.', observes: [out], evidence_kind: definition}
- {id: SS.C6, basis: [SS.STATE], statement: 'Duplicate active state slots return not_established instead of a serial result.', observes: [out], evidence_kind: derived}
- {id: SS.C7, basis: [SS.DTYPE, MAMBA232_SSU.SHAPES, MAMBA232_SSU.WRAPPER], statement: 'Inputs have the complete reviewed logical shapes and physical float32 values; D and dt_bias are present and every field is explicit.', observes: [out], evidence_kind: definition}
examples:
- id: SS.E1
  profile: mamba232_real
  clauses: [SS.C1, SS.C2, SS.C3, SS.C5]
  input: &full
    state: [[[[2]]]]
    x: [[[3]]]
    dt: [[['3/2']]]
    A: [[[-1]]]
    B: [[[4]]]
    C: [[[5]]]
    D: [[1]]
    z: null
    dt_bias: [['1/2']]
    dt_softplus: false
    state_batch_indices: null
    dtype: f32
  expected: {outcome: value, fields: {out: {y: [[[123 + 10*exp(-2)]]], state: [[[[24 + 2*exp(-2)]]]]}}}
- id: SS.E2
  profile: mamba232_real
  clauses: [SS.C3]
  input:
    state: [[[[1]]]]
    x: [[[1]]]
    dt: [[[0]]]
    A: [[[0]]]
    B: [[[1]]]
    C: [[[1]]]
    D: [[0]]
    z: null
    dt_bias: [[0]]
    dt_softplus: true
    state_batch_indices: null
    dtype: f32
  expected: {outcome: value, fields: {out: {y: [[[1 + log(2)]]], state: [[[[1 + log(2)]]]]}}}
- id: SS.E3
  profile: mamba232_real
  clauses: [SS.C3]
  input:
    state: [[[[0]]]]
    x: [[[1]]]
    dt: [[[21]]]
    A: [[[0]]]
    B: [[[1]]]
    C: [[[1]]]
    D: [[0]]
    z: null
    dt_bias: [[0]]
    dt_softplus: true
    state_batch_indices: null
    dtype: f32
  expected: {outcome: value, fields: {out: {y: [[[21]]], state: [[[[21]]]]}}}
- id: SS.E4
  profile: mamba232_real
  clauses: [SS.C2]
  input:
    state: [[[[0]]]]
    x: [[[2]]]
    dt: [[[1]]]
    A: [[[0]]]
    B: [[[1]]]
    C: [[[1]]]
    D: [[1]]
    z: [[[1]]]
    dt_bias: [[0]]
    dt_softplus: false
    state_batch_indices: null
    dtype: f32
  expected: {outcome: value, fields: {out: {y: [[[4/(1 + exp(-1))]]], state: [[[[2]]]]}}}
- id: SS.E5
  profile: mamba232_real
  clauses: [SS.C4]
  input:
    state: [[[[0]], [[0]], [[0]], [[0]]]]
    x: [[[1], [1], [1], [1]]]
    dt: [[[1], [1], [1], [1]]]
    A: [[[0]], [[0]], [[0]], [[0]]]
    B: [[[1], [2]]]
    C: [[[1], [1]]]
    D: [[0], [0], [0], [0]]
    z: null
    dt_bias: [[0], [0], [0], [0]]
    dt_softplus: false
    state_batch_indices: null
    dtype: f32
  expected: {outcome: value, fields: {out: {y: [[[1], [1], [2], [2]]], state: [[[[1]], [[1]], [[2]], [[2]]]]}}}
- id: SS.E6
  profile: mamba232_real
  clauses: [SS.C4, SS.C7]
  input:
    state: [[[[0]], [[0]], [[0]]]]
    x: [[[1], [1], [1]]]
    dt: [[[1], [1], [1]]]
    A: [[[0]], [[0]], [[0]]]
    B: [[[1], [2]]]
    C: [[[1], [1]]]
    D: [[0], [0], [0]]
    z: null
    dt_bias: [[0], [0], [0]]
    dt_softplus: false
    state_batch_indices: null
    dtype: f32
  expected: {outcome: invalid_input}
- id: SS.E7
  profile: mamba232_real
  clauses: [SS.C5]
  input:
    state: [[[[5]]], [[[7]]]]
    x: [[[1]], [[1]]]
    dt: [[[1]], [[1]]]
    A: [[[0]]]
    B: [[[1]], [[1]]]
    C: [[[1]], [[1]]]
    D: [[0]]
    z: null
    dt_bias: [[0]]
    dt_softplus: false
    state_batch_indices: [1, -1]
    dtype: f32
  expected: {outcome: value, fields: {out: {y: [[[8]], [[0]]], state: [[[[5]]], [[[8]]]]}}}
- id: SS.E8
  profile: mamba232_real
  clauses: [SS.C7]
  input:
    state: [[[1]]]
    x: [[2]]
    dt: [[1]]
    A: [[0]]
    B: [[3]]
    C: [[1]]
    D: [1]
