signature:
  inputs:
  - 'state: physical f32 [slots,H,D,N] or [slots,D,N]; x and dt: [B,H,D] or [B,D]'
  - 'A: [H,D,N] or [D,N]; B and C: [B,G,N] or [B,N]; required D and dt_bias plus optional z with corresponding shapes'
  - 'explicit dt_softplus, state_batch_indices null or [B], and dtype=f32'
  pre_state: [complete state pool and every other tensor]
  post_state: [complete y, complete updated state pool, every other tensor unchanged]
  observation_unit: Every y and state coordinate together with shape and dtype
domain:
  valid:
  - Finite physical float32 tensors with positive dimensions and the documented shapes
  - D and dt_bias are present tensors; z may be null
  - H divisible by G; absent state mapping requires slots=B
  - Distinct nonnegative mapped state slots; any negative value is a padding row
  invalid_input: [missing or extra fields, malformed shapes, nonphysical values, nonboolean dt_softplus, out-of-range indices]
  unsupported: [absent D or dt_bias, other dtypes, special values, gradients, layout and alias effects]
  not_established: [two or more active rows mapped to the same state slot]
mutation_requirements:
- {id: SS.M1, misreading: omit dt_bias, witnesses: [SS.E1]}
- {id: SS.M2, misreading: omit D*x, witnesses: [SS.E1]}
- {id: SS.M3, misreading: form y from the state before its update, witnesses: [SS.E1]}
- {id: SS.M4, misreading: use exp(A) instead of exp(dt*A), witnesses: [SS.E1]}
- {id: SS.M5, misreading: use B*x instead of dt*B*x, witnesses: [SS.E1]}
- {id: SS.M6, misreading: ignore dt_softplus, witnesses: [SS.E2]}
- {id: SS.M7, misreading: gate with z instead of SiLU(z), witnesses: [SS.E4]}
- {id: SS.M8, misreading: apply the z gate before adding D*x, witnesses: [SS.E4]}
- {id: SS.M9, misreading: map heads to B/C groups by h modulo G, witnesses: [SS.E5]}
- {id: SS.M10, misreading: process a negative padding row through state slot zero, witnesses: [SS.E7]}
- {id: SS.M11, misreading: omit the complete state writeback, witnesses: [SS.E1]}
nonclaims:
- The profile is the installed mamba-ssm operator's dB=dt*B task. It does not claim the paper's full ZOH discretisation.
- The installed 2.3.2.post1 signature describes D and dt_bias as optional, but its wrapper does not launch when either
  is absent. Those calls are refused rather than assigning the reference helper's intended result to a failed call.
- Duplicate active state slots, other dtypes, mixed-dtype accumulation, layout, aliasing, gradients and sequence scans are outside this profile.
- Float32 execution and stores remain measurable K-G effects; the task formula itself is exact real arithmetic.
changes:
- date: '2026-10-19'
  change: >-
    Replace the combined unverified-main/library and paper-ZOH draft with one installed mamba-ssm 2.3.2.post1 task;
    require physical float32 inputs, executable D/dt_bias arguments and complete y/state output checks, and preserve
    the former contract under draft.
  trigger: >-
    The old contract mixed two different discretisations and had no contract-specific complete-output checker, so it
    could not certify that a kernel returned every promised state coordinate.
