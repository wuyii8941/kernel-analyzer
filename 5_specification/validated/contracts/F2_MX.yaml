signature:
  inputs:
  - 'x: contiguous logical tensor of exact physical finite f32 or bf16 values; final dimension is a positive multiple of32'
  - 'input_dtype: f32 or bf16; elem_format: e4m3 or e5m2'
  - 'block_size=32, scaling_mode=floor, is_swizzled_scales=false'
  pre_state: [complete read-only x]
  post_state: [complete scale_codes and elements; x unchanged]
  observation_unit: Every E8M0 code and every numerical FP8 element with dtype and shape
domain:
  valid:
  - Finite physical f32/bf16 values in a rectangular tensor with at least one dimension
  - Final dimension is a positive multiple of32; E4M3 or E5M2; ordinary scale layout
  invalid_input: [missing or extra fields, ragged or scalar x, nonphysical values, Boolean metadata, nonmultiple final dimension]
  unsupported: [special values, other input or element dtypes, RCEIL/CEIL/EVEN, FP4/FP6, partial blocks, arbitrary axes, swizzled scales, strides, aliasing and gradients]
mutation_requirements:
- {id: MX.M1, misreading: replace every scale code by the unit-scale code127, witnesses: [MX.E2, MX.E3]}
- {id: MX.M2, misreading: drop the last element coordinate, witnesses: [MX.E1]}
- {id: MX.M3, misreading: use the first block scale for every block, witnesses: [MX.E3]}
- {id: MX.M4, misreading: use the other MXFP8 element format, witnesses: [MX.E1, MX.E2]}
nonclaims:
- This profile specifies torchao 0.16.0 FLOOR behavior. It does not declare RCEIL, CEIL or EVEN incorrect and does not certify every OCP MX implementation.
- Numerical FP8 values are observed; signed-zero payload distinctions, NaN payloads, byte packing, swizzled layouts and device storage effects are outside this profile.
- A real kernel still requires a complete binding of input dtype, block membership, scale mode, returned codes and every element coordinate before this reference can support a semantic verdict.
changes:
- date: '2026-10-19'
  change: Replace the broad unverified two-formula draft with one versioned torchao 0.16.0 default FLOOR interface and its exact released code-0 boundary behavior.
  trigger: The previous contract mixed logical extensions with two legal scale choices and lacked a retained versioned task interface.
