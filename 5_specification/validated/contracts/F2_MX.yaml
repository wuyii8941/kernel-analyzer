schema_version: '1.2'
id: F2_MX
role: MX_BLOCK_QUANTIZATION
title: torchao 0.16.0 finite MXFP8 FLOOR conversion
review:
  status: reviewed_for_implementation
  author: OpenAI Codex, independent implementation review
  date: '2026-10-19'
  scope: Finite physical f32/bf16 input, last-axis blocks of32, E4M3/E5M2 elements, non-swizzled E8M0 scales
activation:
  implementation_status: validated
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers:
- The complete numerical scale codes and element values returned by torchao 0.16.0 to_mx with its default FLOOR mode in the reviewed finite MXFP8 subset
profiles:
  torchao016_mxfp8_floor:
    meaning: >-
      Split the final input dimension into blocks of32. For each block use torchao 0.16.0 FLOOR scale calculation,
      return the E8M0 byte code, divide by the implementation's reconstructed scale and convert every element to
      E4M3 or E5M2 with finite saturation and nearest-even rounding.
    task_choice_required: false
    basis: [MX16.TASK, MX16.SCALE, MX16.FORMAT, MX16.SHAPE]
outputs:
  scale_codes: {shape: 'input shape with the last dimension divided by32', guarantee: exact}
  elements: {shape: 'input shape', guarantee: exact}
comparison:
  input_binding: >-
    x contains exact physical finite f32 or bf16 values; elem_format, block_size, scaling_mode and scale layout are
    all explicit. This profile fixes block_size=32, scaling_mode=floor and is_swizzled_scales=false.
  complete_output: Every E8M0 byte code and every numerical FP8 element coordinate is required with dtype and shape.
  quality: Exact equality. No tolerance and no replacement of the released code-0 divisor behavior by ideal real arithmetic.
  test_evidence: >-
    Independent bit-field scale derivation and integer format enumeration; comparison with installed torchao 0.16.0
    on normal, zero, subnormal, two-block, f32 and bf16 inputs; complete-output and rejection checks.
  error_handling: >-
    Malformed shape, nonphysical finite values and Boolean metadata are invalid_input. Special values, other dtypes,
    other scale modes, FP4/FP6, nonstandard block sizes and swizzled scale storage are unsupported.
decisions:
- id: MX16.TASK
  status: reviewed
  statement: >-
    The correctness target is the installed torchao 0.16.0 to_mx interface in its default FLOOR mode. This is a
    versioned framework task, not a claim that FLOOR is the only legal OCP conversion and not an automatic target for
    every kernel whose name contains MX.
  basis: [TORCHAO016_MX_TENSOR.INTERFACE, TORCHAO016_MX_CONFIG.MODES, TORCHAO016_MX_CONFIG.SCOPE]
- id: MX16.SCALE
  status: reviewed
  statement: >-
    For each block, torchao reads the float32 exponent field of amax, subtracts the element format's maximum-power
    exponent and clamps the E8M0 exponent. The returned byte is exponent+127. Its released implementation uses
    2^-126 as the conversion divisor when the returned code is0, although E8M0 code0 denotes2^-127; the reference
    preserves this observable version-specific boundary behavior.
  basis: [TORCHAO016_MX_TENSOR.FLOOR, TORCHAO016_MX_TENSOR.ZERO_BOUNDARY,
    TORCHAO016_MX_CONSTANTS.E8M0]
- id: MX16.FORMAT
  status: reviewed
  statement: >-
    The reviewed element formats are E4M3 with maximum448 and maximum-power exponent8, and E5M2 with maximum57344
    and maximum-power exponent15. The normalized value is clamped to the finite range and rounded to nearest even.
  basis: [TORCHAO016_MX_TENSOR.FORMATS, TORCHAO016_MX_CONSTANTS.MXFP8,
    OCP_OFP8.E4M3, OCP_OFP8.E5M2, OCP_OFP8.CONVERT]
- id: MX16.SHAPE
  status: reviewed
  statement: >-
    This profile fixes the MX block size at32, groups only the final logical dimension, requires an exact multiple,
    and returns ordinary non-swizzled scales. Arbitrary axes, partial blocks and physical swizzles require separate
    profiles and bindings.
  basis: [TORCHAO016_MX_TENSOR.OUTPUT, TORCHAO016_MX_CONSTANTS.BLOCK]
clauses:
- {id: MX.C1, basis: [MX16.SCALE], statement: 'Every block scale code is the complete torchao 0.16 FLOOR result, including exponent clamping and code-0 boundary behavior.', observes: [scale_codes], evidence_kind: definition}
- {id: MX.C2, basis: [MX16.FORMAT], statement: 'Every normalized input coordinate is finitely saturated and converted to the selected MXFP8 element format with nearest-even rounding.', observes: [elements], evidence_kind: definition}
- {id: MX.C3, basis: [MX16.SHAPE], statement: 'Consecutive final-dimension groups of32 determine each scale; every block and element coordinate is returned.', observes: [scale_codes, elements], evidence_kind: definition}
- {id: MX.C4, basis: [MX16.TASK, MX16.SHAPE], statement: 'The complete reviewed public parameters and physical input constraints are checked before evaluation.', observes: [scale_codes, elements], evidence_kind: derived}
