signature:
  inputs:
  - gradient [d] or None
  - lr
  - beta1
  - beta2
  - eps
  - weight_decay
  - optional explicit profile assertions decoupled=True and differentiable=False
  pre_state:
  - theta [d]
  - m [d]
  - v [d]
  - t nonnegative integer
  post_state:
  - theta [d]
  - m [d]
  - v [d]
  - t
  observation_unit: one parameter tensor, one optimizer step; explicit step sequence is composition, not g-vector-as-time
domain:
  valid:
  - d >= 1; theta,m,v,gradient have equal dimensions when gradient is not None
  - finite rational theta,m,v and hyperparameters; each v_i >= 0
  - t is a nonnegative integer, not bool; 0 <= beta1,beta2 < 1
  - lr,weight_decay,eps >= 0
  domain_undefined:
  - gradient is not None and at least one sqrt(v_new_i/(1-beta2**(t+1))) + eps == 0
  unsupported:
  - amsgrad=True
  - explicitly coupled weight decay or input fields outside this profile
  - maximize=True for this pilot
  - sparse gradients
  - differentiating through the optimizer
  - unverified interval-valued external prestate
  not_established:
  - the interval backend cannot enclose a mathematically defined result within its precision or exponent range
  invalid_input:
  - missing declared input fields or non-mapping input
  - wrong shapes
  - negative second moment
  - nonintegral or negative step counter
  - NaN/Inf in this finite-real profile
  - hyperparameters outside the stated range
mutation_requirements:
- id: AW.M1
  misreading: decay updated rather than old theta
  witnesses:
  - AW.E1
  - AW.E3
- id: AW.M2
  misreading: coupled L2 rather than AdamW
  witnesses:
  - AW.E1
- id: AW.M3
  misreading: omit bias correction or use t_old
  witnesses:
  - AW.E2
  - AW.E3
- id: AW.M4
  misreading: eps inside sqrt
  witnesses:
  - AW.E2
- id: AW.M5
  misreading: ignore supplied warm state
  witnesses:
  - AW.E3
- id: AW.M6
  misreading: theta correct but post-state not returned or corrupted
  witnesses:
  - AW.E1
  - AW.E3
- id: AW.M7
  misreading: None treated as zero gradient
  witnesses:
  - AW.E4
  - AW.E5
nonclaims:
- No automatic coverage of coupled Adam under the ADAMW contract; map this as a profile under the existing ADAM
  role.
- No device rounding or actual parameter writeback certification merely from this ideal-state contract.
- A rejected mutant witnesses a particular error; killing all listed mutants does not prove completeness.

changes:
- date: '2026-10-18'
  change: Complete scoped implementation review; check explicit profile assertions and classify interval-valued prestate as unsupported.
  trigger: evidence/adamw_implementation.md; tests/test_adamw_independent.py and tests/test_training_output_membership.py.
- date: '2026-10-18'
  change: Require all declared inputs before evaluation; preserve typed interval-backend refusals and exponent limits as not_established, while leaving unexpected errors as implementation_error.
  trigger: tests/test_adamw_independent.py and the retained PyTorch 2.10 algorithm; independent rational sqrt enclosures and controlled backend exponent limits.
