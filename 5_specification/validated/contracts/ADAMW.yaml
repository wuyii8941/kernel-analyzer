schema_version: '1.1'
id: ADAMW
role: ADAM
title: Dense AdamW state transition, PyTorch 2.10 mathematical profile
review:
  status: reviewed_for_implementation
  date: '2026-10-15'
  reviewer: ChatGPT review of uploaded contract draft
  scope: Contract content and explicit profiles, not all-domain oracle certification
activation:
  implementation_status: validated
  runtime_binding_status: pending
  requires:
  - source_profile_matched
  - input_contract_validated
  - all_required_outputs_bound
  - reference_semantics_and_guarantees_validated
  - no_unresolved_contradiction
  - reviewed_contract_and_adapter_match_current
profiles:
  base:
    meaning: One step, dense vector, maximize=False, amsgrad=False; arbitrary supplied finite rational pre-state.
    must_match:
      maximize: false
      amsgrad: false
      decoupled: true
    task_choice_required: false
outputs:
  theta:
    shape: '[d]'
    guarantee: rigorous_enclosure
  m:
    shape: '[d]'
    guarantee: exact
  v:
    shape: '[d]'
    guarantee: exact
  t:
    shape: scalar integer
    guarantee: exact
comparison:
  input_binding: All arithmetic values are the exactly received rational values; published decimal constants are
    a separate interface query, not silently substituted.
  quality: No default semantic tolerance is inferred from these examples. Numerical resolution and application delta
    are separate declarations.
  test_evidence: Exact rational equality or certified relation when available; numerical enclosure compatibility
    is not a proof of equality.
  error_handling: No dropped outputs, silently truncated lists, coerced counts, or exceptions converted by message
    text.
decisions: []
clauses:
- id: AW.C1
  basis:
  - PAW.DECAY
  statement: theta_decay_i = theta_old_i * (1-lr*weight_decay); adaptive step then subtracted from this value
  observes:
  - theta
  evidence_kind: definition
- id: AW.C2
  basis:
  - PAW.MOMENTS
  - PAW.DECAY
  statement: m_new_i=beta1*m_old_i+(1-beta1)*g_i; v_new_i=beta2*v_old_i+(1-beta2)*g_i**2; no weight decay contribution
    in g
  observes:
  - m
  - v
  evidence_kind: definition
- id: AW.C3
  basis:
  - PAW.CORRECTION
  statement: t_new=t_old+1; m_hat=m_new/(1-beta1**t_new), v_hat=v_new/(1-beta2**t_new)
  observes:
  - theta
  - t
  evidence_kind: definition
- id: AW.C4
  basis:
  - PAW.UPDATE
  statement: theta_new_i=theta_decay_i-lr*m_hat_i/(sqrt(v_hat_i)+eps)
  observes:
  - theta
  evidence_kind: definition
- id: AW.C5
  basis:
  - PAW.NONE
  statement: gradient=None leaves theta,m,v,t unchanged; gradient=0 still executes the transition
  observes:
  - theta
  - m
  - v
  - t
  evidence_kind: definition
