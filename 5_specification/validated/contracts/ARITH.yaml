  profile: torch210_masked_fill_scalar_autograd
  clauses: [AR.C10]
  input: {op: torch.Tensor.masked_fill, input: {t: f32, shape: [2], v: [1, 2]}, mask: {t: b8, shape: [2], v: [true, false]}, value: {t: f32, shape: [], v: 0}, upstream: {t: f32, shape: [2], v: [1, 1]}}
