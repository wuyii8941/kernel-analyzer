- {id: AR.E33, profile: real, clauses: [AR.C9], input: {op: aten.clamp, args: [{t: f32, v: [1]}]}, expected: {outcome: invalid_input}}
- {id: AR.E34, profile: real, clauses: [AR.C9], input: {op: aten.add, args: [{t: f32, v: [1]}, 2], kwargs: {out: {t: f32, v: [0]}}}, expected: {outcome: unsupported}}
- id: AR.E35
  profile: torch210_masked_fill_scalar_autograd
  clauses: [AR.C10, AR.C11]
  input:
    op: torch.Tensor.masked_fill
    input: {t: f32, shape: [1, 3], v: [[1, 2, 3]]}
    mask: {t: b8, shape: [2, 3], v: [[true, false, true], [false, true, false]]}
    value: -2
    upstream: {t: f32, shape: [2, 3], v: [[1, 2, 3], [4, 5, 6]]}
  expected: {outcome: value, fields: {out: [[-2, 2, -2], [1, -2, 3]], grad: [[4, 2, 6]]}}
- id: AR.E36
  profile: torch210_masked_fill_scalar_autograd
  clauses: [AR.C10, AR.C11]
  input:
    op: torch.Tensor.masked_fill
    input: {t: f64, shape: [2, 3], v: [[1, 2, 3], [4, 5, 6]]}
    mask: {t: b8, shape: [2, 1], v: [[true], [false]]}
    value: '1/2'
    upstream: {t: f64, shape: [2, 3], v: [[1, 2, 3], [4, 5, 6]]}
  expected: {outcome: value, fields: {out: [['1/2', '1/2', '1/2'], [4, 5, 6]], grad: [[0, 0, 0], [4, 5, 6]]}}
