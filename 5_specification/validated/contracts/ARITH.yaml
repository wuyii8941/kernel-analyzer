- {id: AR.E23, profile: real, clauses: [AR.C7], input: {op: aten.maximum, args: [{t: f32, v: [[1], [-2]]}, {t: f32, v: [0, 3]}]}, expected: {outcome: value, fields: {out: [[1, 3], [0, 3]]}}}
