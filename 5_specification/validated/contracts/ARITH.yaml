- {id: AR.E19, profile: real, clauses: [AR.C6], input: {op: aten.clamp, args: [{t: f32, v: [-2, 0, 5]}], kwargs: {min: -1, max: 3}}, expected: {outcome: value, fields: {out: [-1, 0, 3]}}}
- {id: AR.E20, profile: real, clauses: [AR.C6], input: {op: aten.clamp, args: [{t: f32, v: [0, 5]}], kwargs: {min: 3, max: 1}}, expected: {outcome: value, fields: {out: [1, 1]}}}
