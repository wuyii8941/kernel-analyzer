- {id: AR.E16, profile: real, clauses: [AR.C4], input: {op: prims.fma, args: [{t: f32, v: [2, '1/2']}, {t: f32, v: [3, 4]}, {t: f32, v: ['1/2', -1]}]}, expected: {outcome: value, fields: {out: ['13/2', 1]}}}
