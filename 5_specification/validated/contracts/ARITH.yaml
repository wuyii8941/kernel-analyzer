  input: {op: torch.Tensor.masked_fill_, input: {t: f32, shape: [2], v: [1, 2]}, mask: {t: b8, shape: [2], v: [true, false]}, value: 0, upstream: {t: f32, shape: [2], v: [1, 1]}}
