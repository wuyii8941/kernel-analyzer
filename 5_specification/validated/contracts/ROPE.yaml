schema_version: '1.2'
id: ROPE
role: ROPE
title: Exact Transformers 4.57.3 Llama rotate-half application and q/k VJP
review:
  status: reviewed_for_implementation
  author: OpenAI Codex, independent implementation review
  date: '2026-10-19'
  scope: Versioned Llama apply_rotary_pos_emb on complete rank-4 q/k tensors with supplied tables and q/k VJPs
activation:
  implementation_status: validated
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers: [transformers.models.llama.modeling_llama.apply_rotary_pos_emb]
profiles:
  hf4573_llama_tables_real:
    meaning: >-
      Transformers 4.57.3 Llama apply_rotary_pos_emb for finite nonempty q [B,Hq,L,D] and k [B,Hk,L,D], supplied
      finite cos/sin [B,L,D], unsqueeze_dim=1 and deprecated position_ids=null, together with the complete VJP with
      respect to q and k for explicit same-shape upstream tensors. D is even and all tensors share one of
      f16, bf16, f32 or f64. The tables are received inputs and need not have equal halves or lie on the unit circle.
    task_choice_required: false
    basis: [RO.TASK, RO.FORWARD, RO.VJP]
outputs:
  q_out: {shape: 'complete q shape [B,Hq,L,D]', guarantee: exact}
  k_out: {shape: 'complete k shape [B,Hk,L,D]', guarantee: exact}
  dq: {shape: 'complete q shape [B,Hq,L,D]', guarantee: exact}
  dk: {shape: 'complete k shape [B,Hk,L,D]', guarantee: exact}
comparison:
  input_binding: >-
    q, k, cos, sin and both upstream tensors are the exact finite physical values received in their declared common
    dtype. The selected public arguments position_ids=null and unsqueeze_dim=1 are explicit.
  complete_output: Both complete returned tensors and both complete q/k VJPs are required.
  quality: Exact real products and sums on supplied table values; no tolerance and no trigonometric reconstruction.
  test_evidence: >-
    Independent coordinate construction, PyTorch autograd checks and the installed Transformers 4.57.6 implementation
    cover all four dtypes, different q/k head counts, multiple batches and tokens, unequal table halves and complete
    output checking. The retained 4.57.3 and installed 4.57.6 function bodies are the same for this selected task.
  error_handling: >-
    Malformed records, odd width and incompatible shapes are invalid_input. Other RoPE layouts, table generation,
    partial rotation and other broadcast axes receive no answer.
decisions:
- id: RO.TASK
  status: reviewed
  statement: >-
    Select only the versioned Llama apply_rotary_pos_emb function with supplied tables, rank-4 [B,H,L,D] q/k and
    unsqueeze_dim=1. RoPE table generation, position-id lookup, partial rotation, interleaved layouts, other model
    families and optimized implementations with extra table assumptions are separate tasks.
  basis: [HF_LLAMA.APPLY, HF_LLAMA.ROTATE_HALF]
- id: RO.FORWARD
  status: reviewed
  statement: >-
    Split the last dimension into equal first and second halves. For each pair p=i and s=i+D/2, the source formula
    gives out[p]=x[p]*cos[p]-x[s]*sin[p] and out[s]=x[s]*cos[s]+x[p]*sin[s]. Tables [B,L,D] broadcast across every
    q or k head after unsqueeze at dimension 1. The same rule is applied independently to q and k.
  basis: [HF_LLAMA.ROTATE_HALF, HF_LLAMA.APPLY]
- id: RO.TABLES
  status: reviewed
  statement: >-
    apply_rotary_pos_emb consumes the supplied cos and sin tensors directly. Equal table halves follow from the
    usual LlamaRotaryEmbedding producer, but are not a precondition of this function. The selected task therefore
    preserves every received table coordinate and does not replace the second half by the first.
  basis: [HF_LLAMA.APPLY, HF_LLAMA.TABLES]
- id: RO.VJP
  status: reviewed
  statement: >-
    Tables are constants in this selected VJP. For each pair, dq[p]=g[p]*cos[p]+g[s]*sin[s] and
    dq[s]=-g[p]*sin[p]+g[s]*cos[s], with the same formula for dk. This is the transpose of the exact linear map even
    when the received table halves differ.
  basis: [HF_LLAMA.ROTATE_HALF, HF_LLAMA.APPLY]
clauses:
- {id: RO.C1, basis: [RO.TASK], statement: 'The task receives complete finite same-dtype q, k, cos, sin and q/k upstream tensors, position_ids=null and unsqueeze_dim=1.', observes: [q_out, k_out, dq, dk], evidence_kind: definition}
- {id: RO.C2, basis: [RO.FORWARD], statement: 'rotate_half pairs i with i+D/2 and q_out=q*cos+rotate_half(q)*sin at every complete coordinate.', observes: [q_out], evidence_kind: definition}
- {id: RO.C3, basis: [RO.FORWARD], statement: 'The same complete formula is applied independently to k, including when Hk differs from Hq.', observes: [k_out], evidence_kind: definition}
- {id: RO.C4, basis: [RO.FORWARD], statement: 'cos/sin [B,L,D] use the corresponding batch and token and broadcast across every head.', observes: [q_out, k_out], evidence_kind: definition}
- {id: RO.C5, basis: [RO.TABLES], statement: 'Every supplied table coordinate is used; unequal first and second table halves remain valid and observable.', observes: [q_out, k_out, dq, dk], evidence_kind: definition}
- {id: RO.C6, basis: [RO.VJP], statement: 'dq and dk are the complete transpose-map VJPs for the explicit upstream_q and upstream_k, with cos/sin treated as constants.', observes: [dq, dk], evidence_kind: derived}
- {id: RO.C7, basis: [RO.TASK], statement: 'All six tensor inputs are read-only and all four promised outputs are complete.', observes: [q_out, k_out, dq, dk], evidence_kind: definition}
examples:
