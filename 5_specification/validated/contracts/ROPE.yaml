  expected: {outcome: value, fields: {q_out: [[[[1, 2]]], [[[-4, 3]]]], k_out: [[[[5, 6]]], [[[-8, 7]]]], dq: [[[[5, 6]]], [[[8, -7]]]], dk: [[[[9, 10]]], [[[12, -11]]]]}}
