  profile: hf4573_llama_tables_real
  clauses: [RO.C1]
  input: {<<: *base, q: [[[[1/2, -1/4]]]], k: [[[[1/4, 1/2]]]], cos: [[[1/2, 1/4]]], sin: [[[1/4, 1/2]]], upstream_q: [[[[1/2, 1/4]]]], upstream_k: [[[[1/4, 1/2]]]], dtype: f16}
  expected: {outcome: value, fields: {q_out: [[[[5/16, 3/16]]]], k_out: [[[[0, 1/4]]]], dq: [[[[3/8, -1/16]]]], dk: [[[[3/8, 1/16]]]]}}
