signature:
  inputs: [complete physical q, k, cos, sin, upstream_q and upstream_k, common dtype, null position_ids, unsqueeze_dim 1]
  pre_state: [all six tensor inputs are unchanged]
  post_state: [complete q_out, k_out, dq and dk]
  observation_unit: every coordinate of all four outputs together with dtype and shape
domain:
  valid: [finite physical f16/bf16/f32/f64 tensors, positive rank-4 dimensions, even head dimension, compatible q/k and table shapes, null position_ids, unsqueeze_dim 1]
  invalid_input: [malformed records, ragged or incompatible shapes, odd head dimension, values not exactly represented by the declared dtype]
  unsupported: [table generation, nonnull position_ids, another broadcast axis, partial rotation, interleaved or other model layouts, special or complex values, integer tensors, gradients for cos/sin, layout and alias effects]
mutation_requirements:
- {id: RO.M1, misreading: use adjacent interleaved pairs instead of first-half to second-half pairs, witnesses: [RO.E1]}
- {id: RO.M2, misreading: replace the received second table half by the first half, witnesses: [RO.E1]}
- {id: RO.M3, misreading: apply the forward map instead of its transpose in the q/k VJP, witnesses: [RO.E2]}
- {id: RO.M4, misreading: use the opposite sine sign in the forward map, witnesses: [RO.E2]}
- {id: RO.M5, misreading: rotate q but leave k and its gradient unchanged, witnesses: [RO.E2]}
- {id: RO.M6, misreading: broadcast batch zero tables to every batch, witnesses: [RO.E4]}
nonclaims:
- The profile defines exactly the retained Transformers 4.57.3 Llama table-application function, not every operation called RoPE.
- It makes no claim about how cos/sin were generated, their numerical accuracy, partial dimensions, cache positions, interleaved layouts or optimized kernels with stricter table assumptions.
- Exact real arithmetic is the task target; device rounding and fused multiply-add behavior are measured separately.
changes:
- date: '2026-10-19'
  change: >-
    Replace five mixed model, layout and table-generation profiles with one reviewed versioned Llama supplied-table
    application and complete q/k VJP. Preserve the broader former contract and adapter under contracts/draft.
  trigger: >-
    The former draft treated an optimized implementation's equal-half table requirement as if it were a precondition
    of the Transformers function and combined several different tasks under one role name.
