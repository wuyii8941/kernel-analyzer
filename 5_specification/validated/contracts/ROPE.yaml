  clauses: [RO.C1, RO.C2, RO.C3, RO.C5, RO.C6, RO.C7]
  input: &base
    q: [[[[1, 2, 3, 4]]]]
    k: [[[[5, 6, 7, 8]]]]
    cos: [[[1, 2, 3, 4]]]
    sin: [[[5, 6, 7, 8]]]
    upstream_q: [[[[1, 2, 3, 4]]]]
    upstream_k: [[[[4, 3, 2, 1]]]]
    dtype: f64
    position_ids: null
    unsqueeze_dim: 1
  expected:
    outcome: value
    fields:
      q_out: [[[[-14, -20, 16, 32]]]]
      k_out: [[[[-30, -36, 56, 80]]]]
      dq: [[[[22, 36, 4, 4]]]]
      dk: [[[[18, 14, -14, -14]]]]
- id: RO.E2
  profile: hf4573_llama_tables_real
  clauses: [RO.C2, RO.C3, RO.C6]
  input: {<<: *base, cos: [[[0, 0, 0, 0]]], sin: [[[1, 1, 1, 1]]]}
  expected: {outcome: value, fields: {q_out: [[[[-3, -4, 1, 2]]]], k_out: [[[[-7, -8, 5, 6]]]], dq: [[[[3, 4, -1, -2]]]], dk: [[[[2, 1, -4, -3]]]]}}
