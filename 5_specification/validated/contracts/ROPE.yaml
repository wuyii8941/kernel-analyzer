  profile: hf4573_llama_tables_real
  clauses: [RO.C3, RO.C4]
  input:
    <<: *base
    q: [[[[1, 2]], [[3, 4]]]]
    k: [[[[5, 6]]]]
    cos: [[[1, 1]]]
    sin: [[[0, 0]]]
    upstream_q: [[[[7, 8]], [[9, 10]]]]
    upstream_k: [[[[11, 12]]]]
  expected: {outcome: value, fields: {q_out: [[[[1, 2]], [[3, 4]]]], k_out: [[[[5, 6]]]], dq: [[[[7, 8]], [[9, 10]]]], dk: [[[[11, 12]]]]}}
- id: RO.E4
  profile: hf4573_llama_tables_real
  clauses: [RO.C4]
  input:
    <<: *base
    q: [[[[1, 2]]], [[[3, 4]]]]
    k: [[[[5, 6]]], [[[7, 8]]]]
    cos: [[[1, 1]], [[0, 0]]]
    sin: [[[0, 0]], [[1, 1]]]
    upstream_q: [[[[5, 6]]], [[[7, 8]]]]
