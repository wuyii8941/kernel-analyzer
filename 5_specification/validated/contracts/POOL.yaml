signature:
  inputs: [selected pooling profile and exact parameters, one rank-3 or rank-4 physical finite f16/bf16/f32/f64 tensor, complete same-dtype upstream for either autograd profile]
  pre_state: [the input tensor and any upstream are unchanged]
  post_state: [complete newly returned values tensor, complete input gradient for either autograd profile, complete int64 indices for unique-max autograd]
  observation_unit: every returned coordinate together with dtype and shape
domain:
  valid: [ATen avg_pool2d / avg_pool2d_backward calls in the schema argument order under the selected divisor, positive rank-3 or rank-4 physical finite f16/bf16/f32/f64 tensors, profile-specific kernel stride padding dilation and output choices, complete upstream for autograd, explicit divisor or versioned-index task selection where required]
  invalid_input: [malformed record, unrepresentable value, nonpositive or malformed kernel stride or dilation, output dimension below one, nonboolean options]
  unsupported: [tied maxima or return_indices=false under unique-max autograd, max padding ceil indices or backward under the older values-only profile, adaptive pooling, special values, signed-zero distinctions, integer or complex data, other ranks or overloads]
mutation_requirements:
- {id: PM.M1, misreading: use floor output shape when ceil mode is selected, witnesses: [PM.E2]}
- {id: PM.M2, misreading: ignore explicit padding when constructing windows, witnesses: [PM.E3]}
- {id: PM.M3, misreading: encode indices with column-major spatial order, witnesses: [PM.E3]}
- {id: PM.M4, misreading: overwrite rather than sum gradients from overlapping windows, witnesses: [PM.E1]}
- {id: PM.M5, misreading: ignore dilation, witnesses: [PM.E4]}
- {id: PM.M6, misreading: omit the complete indices result, witnesses: [PM.E1]}
- {id: PA.M1, misreading: use full kernel divisor on ceil overhang, witnesses: [PA.E1]}
- {id: PA.M2, misreading: only backward uses the full kernel divisor on ceil overhang, witnesses: [PA.E1]}
- {id: PA.M3, misreading: ignore explicit divisor_override, witnesses: [PA.E2]}
- {id: PA.M4, misreading: include padding when count_include_pad is false, witnesses: [PA.E3]}
- {id: PA.M5, misreading: omit the entire input gradient, witnesses: [PA.E1]}
- {id: PA.M6, misreading: the ATen overloads divide every ceil-overhang window by the full kernel size, witnesses: [PA.E8, PA.E9]}
- {id: PA.M7, misreading: aten.avg_pool2d_backward ignores divisor_override, witnesses: [PA.E10]}
- {id: PA.M8, misreading: aten.avg_pool2d_backward takes its first tensor as the forward input and its second as the upstream, witnesses: [PA.E9]}
- {id: P2.M1, misreading: take the minimum of every window, witnesses: [P2.E1]}
- {id: P2.M2, misreading: take the first value of every window, witnesses: [P2.E1]}
- {id: P2.M3, misreading: ignore dilation, witnesses: [P2.E3]}
- {id: P2.M4, misreading: default stride is one instead of kernel size, witnesses: [P2.E5]}
- {id: P2.M5, misreading: swap the two kernel dimensions, witnesses: [P2.E2]}
- {id: P2.M6, misreading: omit the final sample in every window, witnesses: [P2.E1]}
nonclaims:
- Max indices and VJP are certified only for the explicitly selected PyTorch 2.10 unique-maximum profile. Tied maxima, adaptive pooling, special values, empty dimensions, layouts, aliasing, device placement and other overloads remain outside scope. Average pooling only uses its explicitly selected divisor convention.
- Exact selected values do not claim a particular device comparison instruction. The versioned flattened index is a declared public-task convention, not a universal tie-breaking or encoding rule.
changes:
- date: '2026-10-21'
  change: PA.ATEN notes that the functional avg_pool2d page calls kernel_size the size of the pooling region (textual support for the full-kernel divisor) while the ceil-overhang divisor stays the task choice.
  trigger: Independent review of package C (A2_package_C_review.md, non-blocking POOL remark).
- date: '2026-10-20'
  change: >-
    Add aten.avg_pool2d and aten.avg_pool2d_backward to covers with an ATen-call profile torch210_aten_avg2d
    (decision PA.ATEN, clause PA.C3, examples PA.E8-E14, mutants PA.M6-M8). The forward returns the out field and
    the backward the grad field of finite_avg2d_autograd under the same divisor; the PA.DIVISOR task choice is kept
    because no retained PyTorch document fixes the ceil-overhang divisor. Public-record profiles refuse ATen-call
    records as unsupported, and finite_max2d_values evaluates only max-pooling names. Status returned to
    drafted/pending for independent review.
  trigger: >-
    Path A closure (G6): recorded trigger D8 calls aten.avg_pool2d and aten.avg_pool2d_backward had no contract
    with these covers names and no ATen interface.
- date: '2026-10-19'
  change: Add a separate PyTorch 2.10 unique-max max_pool2d profile with complete values, int64 flattened spatial indices and input VJP over padding, dilation and ceil-mode geometry.
  trigger: Real public training calls already observed all three results, but the former admitted profile could judge only forward values; ties remain unsupported rather than assigned an undocumented universal derivative.
- date: '2026-10-19'
  change: Add explicitly selected finite two-dimensional average-pooling forward and full input VJP; reuse the exact window evaluator after strict physical-input validation.
  trigger: Real public training calls exposed missing average-pooling reference capability and inconsistent ceil-tail divisors in generated forward/backward implementations.
- date: '2026-10-19'
  change: >-
    Replace the broad average/max/adaptive forward-and-backward draft with a reviewed forward-values max_pool2d profile
    on physical finite tensors, zero padding and floor output shape. Preserve the former contract and adapter under
    contracts/draft.
  trigger: >-
    The broad draft combined disputed average-pooling tail divisors, undocumented NaN behavior, tied-index choices and
    backward routing. None of those choices is needed to give an exact ground truth for ordinary max-pooling values.
