schema_version: '1.2'
id: POOL
role: POOL
title: Exact two-dimensional pooling values and explicitly selected complete pooling VJPs
review:
  status: reviewed_for_implementation
  reviewer: 'independent review 2026-10-21 (reviews/2026-10-20/A2_package_C_review.md)'
  author: OpenAI Codex, independent implementation review (2026-10-19); Claude, path A closure package C ATen average-pooling interface (2026-10-20)
  date: '2026-10-21'
  scope: Finite max_pool2d forward values; separately selected unique-max PyTorch 2.10 max_pool2d values, indices and input VJP; finite avg_pool2d forward and input VJP with explicit padding-domain divisor semantics; the ATen avg_pool2d and avg_pool2d_backward overloads on the same selected divisor
activation:
  implementation_status: validated
  implementation_evidence: evidence/layout_pool_interp_aten.md
  runtime_binding_status: pending
  requires: [source_profile_matched, input_contract_validated, all_required_outputs_bound,
    reference_semantics_and_guarantees_validated, no_unresolved_contradiction,
    reviewed_contract_and_adapter_match_current]
covers: [aten.max_pool2d, torch.nn.functional.max_pool2d, torch.nn.functional.avg_pool2d, aten.avg_pool2d,
  aten.avg_pool2d_backward]
profiles:
  finite_max2d_values:
    outputs: [out]
    meaning: >-
      Complete forward values of two-dimensional max pooling on rank-3 or rank-4 physical finite f16, bf16, f32 or
      f64 tensors. Padding is zero, ceil_mode is false, and only the values result is selected. Kernel, stride and
      dilation may be positive integers or pairs.
    task_choice_required: false
    basis: [P2.SCHEMA, P2.PHYSICAL, P2.WINDOW]
  torch210_unique_max2d_autograd:
    outputs: [out, indices, grad]
    meaning: >-
      Complete public PyTorch 2.10 functional max_pool2d with return_indices=true and its input VJP on finite
      rank-3/rank-4 physical floating tensors. Every effective output window has one unique maximum. Parameters,
      complete upstream, flattened spatial indices and all overlapping gradient contributions are explicit.
    task_choice_required: true
    basis: [PM.SCHEMA, PM.WINDOW, PM.UNIQUE, PM.INDEX, PM.GRAD]
  finite_avg2d_autograd:
    outputs: [out, grad]
    meaning: >-
      Real arithmetic of finite rank-3/rank-4 avg_pool2d and its complete input VJP. All public options and physical
      input/upstream records are explicit. The chosen divisor counts explicit padding when count_include_pad=true,
      but excludes ceil overhang beyond the explicit padding domain. A nonzero integer divisor_override takes precedence.
    task_choice_required: true
    basis: [PA.SCHEMA, PA.DIVISOR, PA.GRAD]
  torch210_aten_avg2d:
    outputs: [out]
    meaning: >-
      The PyTorch 2.10 ATen overloads avg_pool2d(self, kernel_size, stride=[], padding=0, ceil_mode=False,
      count_include_pad=True, divisor_override=None) and avg_pool2d_backward(grad_output, self, kernel_size, stride,
      padding, ceil_mode, count_include_pad, divisor_override) as ATen calls. The forward returns exactly the out
      field, and the backward exactly the grad field with upstream=grad_output, of finite_avg2d_autograd under the
      same explicitly chosen divisor (PA.DIVISOR). The single returned tensor is the out output of this profile.
    task_choice_required: true
    basis: [PA.SCHEMA, PA.DIVISOR, PA.GRAD, PA.ATEN]
outputs:
  out:
    shape: input leading dimensions followed by the two output dimensions of the selected profile
    guarantee: exact
  grad:
    shape: complete input shape, for either autograd profile
    guarantee: exact
  indices:
    shape: complete output shape, for the unique-max autograd profile
    dtype: i64
    guarantee: exact
comparison:
  input_binding: >-
    The tensor record contains the exact physical values received in its declared dtype. Kernel size, stride,
    dilation, padding, ceil mode and the values-only choice are explicit call arguments.
  complete_output: >-
    The values-only profile observes its complete returned tensor. The autograd profiles require every declared
    forward value and input-gradient coordinate; unique-max max pooling additionally requires every int64 index.
  quality: Exact selected input values, dtype and shape; no tolerance and no partial output.
  test_evidence: Independent coordinate loops and PyTorch 2.10 comparisons over all selected dtypes and parameter forms.
  error_handling: Profile-specific limits apply; malformed inputs and inconsistent upstream are invalid_input. No implicit profile change or fallback to the old broad pooling draft.
decisions:
- id: PM.SCHEMA
  status: reviewed
  statement: >-
    Select PyTorch 2.10 torch.nn.functional.max_pool2d with return_indices=true, followed by the complete input VJP
    for an explicit upstream. Input and upstream are finite same-dtype rank-3 or rank-4 physical f16/bf16/f32/f64
    tensors. Kernel, stride, padding, dilation and ceil mode are explicit; stride None selects kernel size. All
    inputs remain unchanged and the complete values, int64 indices and input gradient are returned.
  basis: [T_F_MAX_POOL2D.CEIL_PARAM, T_MAXPOOL2D.PARAMS, T_MAXPOOL2D.RETURN_INDICES,
    TS_NATIVE_FUNCTIONS.POOL_SCHEMAS, P2.PHYSICAL]
- id: PM.WINDOW
  status: reviewed
  statement: >-
    Output shape follows the documented floor or ceil formula, including removal of a final window that starts in
    right or bottom padding. Window starts are output*stride-padding; dilation selects kernel positions and only real
    input coordinates participate because padding is negative infinity. Padding is nonnegative and at most half the
    corresponding kernel size, as required by the selected public interface.
  basis: [T_MAXPOOL2D.DEF, T_MAXPOOL2D.PARAMS, T_MAXPOOL2D.SHAPE,
    T_F_MAX_POOL2D.CEIL_PARAM]
- id: PM.UNIQUE
  status: reviewed
  statement: >-
    Every effective output window must have exactly one maximum among real input coordinates. Tied maxima are
    unsupported because the public pages identify an argmax but do not establish one universal tie choice, and the
    derivative at a tie is not uniquely determined by the maximum function alone.
  basis: [T_MAXPOOL2D.DEF, T_MAXPOOL2D.RETURN_INDICES]
- id: PM.INDEX
  status: needs_binding
  statement: >-
    For this versioned PyTorch 2.10 task, the returned int64 index of unique maximum (h,w) is h*input_width+w within
    its channel plane. This implementation convention is selected explicitly and checked against public CPU and CUDA
    calls and max-unpool use; it is not claimed as an implementation-independent encoding for every pooling system.
  basis: [T_MAXPOOL2D.RETURN_INDICES, T_F_MAX_POOL2D.CEIL_PARAM, TS_NATIVE_FUNCTIONS.POOL_SCHEMAS]
- id: PM.GRAD
  status: reviewed
  statement: >-
    With a unique maximum, each output is locally the selected input coordinate. Its VJP adds that output's upstream
    to the selected input coordinate and zero elsewhere; overlapping windows selecting the same input accumulate all
    contributions. This is the ordinary derivative of the selected unique-max function.
  basis: [PM.WINDOW, PM.UNIQUE]
- id: PA.SCHEMA
  status: reviewed
  statement: >-
    avg_pool2d uses finite positive rank-3 or rank-4 physical f16/bf16/f32/f64 inputs; the upstream has the same dtype
    and complete output shape. Integer kernel, stride and padding accept scalar, single-component or two-component
    forms. None or empty stride selects kernel_size. Padding is at most half kernel size; output shape uses the
    documented floor/ceil rule with right/bottom-start correction. Options and upstream are all explicit, including
    None defaults. No dilation, indices, adaptive pooling or other dimensions are silently accepted.
  basis: [T_AVGPOOL2D.PARAMS, T_AVGPOOL2D.SHAPE, T_F_AVG_POOL2D.DIVISOR, P2.PHYSICAL]
- id: PA.DIVISOR
  status: needs_binding
  statement: >-
    The task explicitly chooses the window intersected with the explicit padded input domain as the divisor region
    when count_include_pad=true; false counts only real input positions. A supplied nonzero integer divisor_override,
    including a negative one, takes precedence. Sum only real inputs; implicit padding contributes zero. This chooses
    the retained R2 task convention, checked against native PyTorch 2.10 CPU/CUDA, and does not declare all other
    pooling conventions mathematically wrong. The reference is its exact real idealization, not rounded PyTorch output.
  basis: [T_AVGPOOL2D.DEF, T_AVGPOOL2D.DIVISOR, PH1_DECISIONS.POOL_A1]
- id: PA.GRAD
  status: reviewed
  statement: >-
    For fixed geometry and the selected divisor, y_o=sum_i A_oi*x_i with A_oi=1/divisor_o for real inputs in window o
    and zero otherwise. Differentiation gives grad_i=sum_o A_oi*upstream_o, including every overlapping window.
    This is the ordinary derivative of a linear map; no tie or subgradient convention is needed. Forward and backward
    must use the same divisor. All inputs are unchanged; return every forward and input-gradient coordinate.
  basis: [PA.SCHEMA, PA.DIVISOR]
- id: PA.ATEN
  status: reviewed
  statement: >-
    The ATen schemas take the same options as the public task (avg_pool2d defaults stride=[] meaning kernel_size,
    padding 0, ceil_mode false, count_include_pad true, divisor_override None; avg_pool2d_backward takes every option
    positionally). PyTorch 2.10's derivative table defines the self-derivative of avg_pool2d as avg_pool2d_backward
    with the same options, so avg_pool2d_backward(grad_output, self, ...) is the input VJP of avg_pool2d at self for
    upstream grad_output. Mapping: forward result = finite_avg2d_autograd.out; backward result =
    finite_avg2d_autograd.grad with upstream grad_output, which must have the dtype of self and the complete forward
    output shape (otherwise invalid input). Forward and backward use one divisor, so the PA.DIVISOR task choice
    remains required: the AvgPool2d and avg_pool2d pages say only that the default divisor is the size of the
    pooling region, which does not fix the region of a ceil-mode window extending past the input (POOL_A1 records
    the AvgPool3d page calling it kernel_size). The functional avg_pool2d page also describes kernel_size itself as
    the "size of the pooling region", which textually supports dividing by the full kernel size (the R1 reading);
    it still does not say whether a ceil-mode window extending past the padded input keeps that size, so the
    overhang divisor remains the task choice. No retained PyTorch document resolves it; agreement of native
    kernels or compilers is not used as the definition. The out and grad_input forms are separate tasks.
  basis: [LPI_NATIVE_FUNCTIONS.AVG_POOL2D, LPI_DERIVATIVES.AVG_POOL2D, T_AVGPOOL2D.DIVISOR, T_F_AVG_POOL2D.DIVISOR,
    T_F_AVG_POOL2D.KERNEL_SIZE, PH1_DECISIONS.POOL_A1, PA.SCHEMA, PA.DIVISOR, PA.GRAD]
- id: P2.SCHEMA
  status: reviewed
  statement: >-
    Select only functional max_pool2d forward values. The ATen max_pool2d task returns one values tensor. The public
    functional task is selected only with return_indices=false. The with-indices, out, backward, average, adaptive,
    one-dimensional and three-dimensional schemas are different tasks. Padding is fixed to zero and ceil_mode to
    false in this reviewed profile.
  basis: [TS_NATIVE_FUNCTIONS.POOL_SCHEMAS, T_MAXPOOL2D.RETURN_INDICES, T_F_MAX_POOL2D.CEIL_PARAM]
- id: P2.PHYSICAL
  status: reviewed
  statement: >-
    Inputs are rank-3 (C,H,W) or rank-4 (N,C,H,W) physical finite f16, bf16, f32 or f64 tensors whose listed values
    are exactly representable in the declared dtype. All dimensions are positive. Special values, signed-zero
    distinctions, integer or complex data and unrepresentable mathematical literals are outside this profile.
  basis: [T_MAXPOOL2D.DEF]
- id: P2.WINDOW
  status: reviewed
  statement: >-
    For output coordinate (h,w), inspect input positions (stride_h*h + dilation_h*m,
    stride_w*w + dilation_w*n) for 0 <= m < kernel_h and 0 <= n < kernel_w and return their maximum. With zero padding
    and floor mode, H_out=floor((H-dilation_h*(kernel_h-1)-1)/stride_h)+1 and likewise for W. Stride defaults to the
    kernel size. Ties do not change the forward value.
  basis: [T_MAXPOOL2D.DEF, T_MAXPOOL2D.PARAMS, T_MAXPOOL2D.SHAPE]
clauses:
- id: PM.C1
  basis: [PM.SCHEMA, PM.WINDOW]
  statement: Every selected public parameter, complete physical input and complete same-dtype upstream is validated before evaluation.
  observes: [out, indices, grad]
  evidence_kind: definition
- id: PM.C2
  basis: [PM.WINDOW, PM.UNIQUE]
  statement: Every output is the unique maximum of the real coordinates in its padded, dilated window; tied windows are unsupported.
  observes: [out]
  evidence_kind: definition
- id: PM.C3
  basis: [PM.INDEX]
  statement: Every returned int64 index is the selected maximum's row-major spatial index h*input_width+w within its plane.
  observes: [indices]
  evidence_kind: definition
- id: PM.C4
  basis: [PM.GRAD]
  statement: The complete input VJP sums upstream from every output window selecting each input coordinate.
  observes: [grad]
  evidence_kind: derived
- id: PM.C5
  basis: [PM.SCHEMA, PM.UNIQUE]
  statement: Missing outputs, malformed options, wrong upstream shape or dtype, ties and undeclared pooling variants cannot receive a value under this profile.
  observes: [out, indices, grad]
  evidence_kind: definition
- id: PA.C1
  basis: [PA.SCHEMA]
  statement: Every average-pooling query validates all physical inputs, options, output shape and upstream before returning a result.
  observes: [out, grad]
  evidence_kind: definition
- id: PA.C2
  basis: [PA.DIVISOR, PA.GRAD]
  statement: Complete exact forward and VJP use the same explicitly chosen divisor, with all overlapping contributions accumulated.
  observes: [out, grad]
  evidence_kind: definition
- id: PA.C3
  basis: [PA.ATEN]
  statement: The ATen avg_pool2d call returns the selected task's complete forward values and avg_pool2d_backward returns its complete input VJP for upstream grad_output, with the same divisor choice and argument order of the PyTorch 2.10 schemas.
  observes: [out]
  evidence_kind: derived
- id: P2.C1
  basis: [P2.SCHEMA, P2.PHYSICAL]
  statement: In finite_max2d_values, every call has one rank-3 or rank-4 finite physical floating tensor, positive one- or two-component kernel, stride and dilation, zero padding, floor mode and values-only output.
  observes: [out]
  evidence_kind: definition
- id: P2.C2
  basis: [T_MAXPOOL2D.DEF, P2.WINDOW]
  statement: Every output coordinate is the exact maximum of all input coordinates in its dilated two-dimensional window; equal maxima still determine the same value.
  observes: [out]
  evidence_kind: definition
- id: P2.C3
  basis: [T_MAXPOOL2D.PARAMS, T_MAXPOOL2D.SHAPE, P2.WINDOW]
  statement: Stride defaults to kernel size and the two output lengths use the documented floor formula; a nonpositive output length is invalid input.
  observes: [out]
  evidence_kind: definition
- id: P2.C4
  basis: [P2.SCHEMA, P2.PHYSICAL]
  statement: The finite_max2d_values profile rejects padding, ceil mode, indices, backward, average or adaptive pooling, special values, signed-zero distinctions, rank outside three or four and unselected dtypes.
  observes: [out]
  evidence_kind: definition
