signature:
  inputs: [complete q, complete k, complete v, common dtype, complete optional mask and mask dtype,
    is_causal, scale, enable_gqa, dropout_p, and complete upstream for the VJP profile]
  pre_state: []
  post_state: [complete public output; the VJP profile additionally returns complete dq, dk and dv]
  observation_unit: one complete public scaled_dot_product_attention forward call, optionally followed by its q/k/v VJP;
    or one complete fused SDPA ATen overload call (ATen profile)
domain:
  valid: [rank-3 or rank-4 nonempty positive dense tensors, f16/bf16/f32/f64 common dtype,
    finite exactly represented q/k/v values and, for VJP, same-dtype finite exactly represented upstream values,
    compatible query/key dimensions and key/value lengths,
    equal batch sizes, documented equal/broadcast/GQA head relation, dropout_p=0,
    no mask or broadcastable Boolean/same-dtype finite-or-negative-infinity additive mask,
    every row has a finite participating score]
  domain_undefined: []
  invalid_input: [missing required field, ragged tensor, incompatible shape, mixed or mismatched mask dtype,
    VJP upstream shape or dtype different from the complete public output, attn_mask together with is_causal,
    invalid Boolean or probability]
  unsupported: [empty effective row, nonfinite q/k/v, positive-infinity mask, dtype outside f16/bf16/f32/f64,
    dropout, rank outside three or four, arbitrary batch broadcasting, softcap, window, LSE or backend gradient buffers,
    sparse or complex data, layout and backend-specific device rounding]
  aten_profile_valid:
  - 'rank-4 dense finite exactly represented query, key, value, grad_out and out of one dtype (flash f16/bf16, efficient f16/bf16/f32)'
  - 'float32 finite logsumexp of shape (B, Hq, L); for the efficient backward also the 32-aligned padded width with +inf padding'
  - 'dropout_p = 0; is_causal only with L = S; scale null or finite'
  - 'flash: Hq divisible by Hkv, return_debug_mask false, cum_seq_q / cum_seq_k null, max_q = L, max_k = S'
  - 'efficient backward: Hq = Hkv, attn_bias null, grad_input_mask (true, true, true, false)'
  aten_profile_invalid_input:
  - 'non-rank-4 tensors; mismatched batch, head dimension or key/value lengths'
  - 'flash Hq not divisible by Hkv; grad_out or out shape different from the forward output'
  - 'malformed booleans or integers; grad_input_mask not four booleans; dropout_p outside [0, 1]'
  - 'values not representable in the declared dtype'
  aten_profile_unsupported:
  - 'dropout_p > 0 (AT.ATEN_RNG); is_causal with L != S (AT.ATEN_CAUSAL)'
  - 'return_debug_mask true; attention bias; bias gradient requested; unrequested query/key/value gradient'
  - 'efficient Hq != Hkv; packed cum_seq inputs; max_q / max_k different from L / S'
  - 'nonfinite inputs; logsumexp padding other than +inf; dtypes outside the overload set; empty dimensions'
mutation_requirements:
- {id: AT.M1, misreading: use 1/E instead of 1/sqrt(E) for default scale, witnesses: [AT.E1]}
- {id: AT.M2, misreading: ignore an explicit scale and use the default, witnesses: [AT.E2]}
- {id: AT.M3, misreading: invert the Boolean mask convention, witnesses: [AT.E3]}
- {id: AT.M4, misreading: interpret a numeric additive mask as a Boolean keep mask, witnesses: [AT.E4]}
- {id: AT.M5, misreading: use bottom-right rather than upper-left causal alignment, witnesses: [AT.E6]}
- {id: AT.M6, misreading: assign GQA heads round-robin rather than in contiguous groups, witnesses: [AT.E7]}
- {id: AT.M7, misreading: manufacture a uniform result for a row without a participating score, witnesses: [AT.E10]}
- {id: AT.M8, misreading: accept an explicit mask together with is_causal and silently combine them, witnesses: [AT.E11]}
- {id: AT.M9, misreading: ignore the explicit scale keyword of the ATen call and use 1/sqrt(E), witnesses: [AT.E22]}
- {id: AT.M10, misreading: causal off-by-one (key j allowed only for j < i), witnesses: [AT.E22, AT.E34]}
- {id: AT.M11, misreading: return the logsumexp in base 2 instead of the natural logarithm, witnesses: [AT.E22, AT.E24]}
- {id: AT.M12, misreading: map query heads to key/value heads round-robin instead of contiguous groups, witnesses: [AT.E23]}
- {id: AT.M13, misreading: do not sum grad_key / grad_value over all query heads of a group, witnesses: [AT.E33]}
- {id: AT.M14, misreading: recompute the logsumexp from q and k instead of using the supplied logsumexp, witnesses: [AT.E31]}
- {id: AT.M15, misreading: recompute the output for D instead of using the supplied out, witnesses: [AT.E32]}
- {id: AT.M16, misreading: treat dropout_p > 0 as if it were 0, witnesses: [AT.E37]}
- {id: AT.M17, misreading: accept non-square causal calls with the flash kernel's bottom-right alignment, witnesses: [AT.E29]}
- {id: AT.M18, misreading: ignore the GQA head mapping (every query head uses key/value head 0), witnesses: [AT.E23]}
- {id: AT.M19, misreading: accept a flash value head dimension different from the query head dimension, witnesses: [AT.E41]}
readings:
  recompute_saved:
    meaning: >-
      Diagnostic reading for the backward overloads: the exact VJP of the forward at (q, k, v), recomputing the
      probabilities and the output instead of using the supplied out and logsumexp. It coincides with the profile
      when the supplied values equal the exact forward results; it is not the task definition (AT.ATEN_SAVED).
    basis: [AT.VJP, TS_AUTOGRAD_DERIVATIVES.SDPA_FUSED]
nonclaims:
- These profiles do not define FlashAttention bottom-right alignment, window or softcap options, FlexAttention score modifications, Triton tutorial LSE storage, or backend-specific backward interfaces.
- The VJP profile defines derivatives of the selected public result for an explicit upstream. It does not claim that every backend stores the same probabilities or LSE internally.
- The defined-row restriction avoids claiming that one backend's all-masked-row convention is universal public SDPA behavior.
- Rigorous real arithmetic defines f. Device dtype rounding and backend selection are measured separately as K-f.
- Rejected mutants witness listed mistakes only and do not prove completeness.
- The ATen profile defines no dropout_p > 0 result. The mask stream exists only in the CUDA kernel source (cuRAND Philox with a kernel-specific offset layout) and is not specified by PyTorch documentation; no RNG model is assumed.
- The ATen profile does not compare RNG bookkeeping (philox seed/offset), cum_seq positions or the debug mask, and makes no claim about their values.
- The ATen backward profile is conditional on the supplied out and logsumexp; it does not establish that the forward call produced them correctly (that is the forward call's own check).
- PyTorch's own fused kernels are the conventions' cross-check (evidence/attn_aten_interface.md), not their definition.
changes:
- date: '2026-10-20'
  change: >-
    Added the ATen-call profile torch210_aten_sdpa_fused_dropout0 covering aten._scaled_dot_product_flash_attention,
    aten._scaled_dot_product_flash_attention_backward and aten._scaled_dot_product_efficient_attention_backward with
    dropout_p = 0, decisions AT.ATEN_TASK, AT.ATEN_HEADS, AT.ATEN_CAUSAL, AT.ATEN_SAVED, AT.ATEN_AUX, AT.ATEN_RNG and
    AT.ATEN_DOMAIN, clauses AT.C11-AT.C18, examples AT.E22-AT.E42, mutants AT.M9-AT.M19 and the diagnostic reading
    recompute_saved. The public profiles are unchanged. Review status reset to drafted and implementation status to
    pending. After independent review (reviews/2026-10-20/A2_package_B_review.md): flash overloads refuse a value
    head dimension different from the query head dimension (invalid_input, example AT.E41, mutant AT.M19);
    efficient backward keeps Ev != E (AT.E42); AT.ATEN_DOMAIN states the dtype-only domain and the unpadded
    logsumexp choice; AT.ATEN_RNG lists conditioning on an observed mask as an impossible alternative.
  trigger: >-
    Path A closure (G6): recorded qwen2.5 bf16 flash forward/backward calls and bert-tiny / gpt2 f32 efficient
    backward calls had no contract with an ATen-call interface.
- date: '2026-10-19'
  change: >-
    Added a separate complete VJP profile for the already reviewed public SDPA task. It requires explicit upstream and
    returns out, dq, dk and dv; GQA gradients are summed back to the original key/value head shapes. The forward-only
    profile and its interface remain unchanged.
  trigger: >-
    Real training calls need all three operand gradients. The derivative is obtained from the reviewed forward formula
    and is checked independently; the broader draft combining FlashAttention, FlexAttention, LSE, window and softcap
    remains unadmitted.
