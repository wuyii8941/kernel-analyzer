<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">三个案例在算子输出、梯度和 SGD 有效更新阶段的方向性</title>
  <desc id="desc">Liger 为 2.984、2.931、2.931；Phi 为 2.074、4.701、4.701；Qwen 为 1.008、1.698、1.698。</desc>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">方向性第一次在哪里出现？</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5b6475">同一三阶段测量；第三阶段为 stateless SGD，不是 AdamW</text>
  <g stroke="#d9dee8" stroke-width="1">
    <line x1="120" y1="460" x2="920" y2="460"/><line x1="120" y1="384" x2="920" y2="384"/>
    <line x1="120" y1="308" x2="920" y2="308"/><line x1="120" y1="232" x2="920" y2="232"/>
    <line x1="120" y1="156" x2="920" y2="156"/><line x1="120" y1="80" x2="920" y2="80"/>
  </g>
  <g font-family="sans-serif" font-size="14" fill="#536070" text-anchor="end">
    <text x="105" y="465">0</text><text x="105" y="389">1</text><text x="105" y="313">2</text>
    <text x="105" y="237">3</text><text x="105" y="161">4</text><text x="105" y="85">5</text>
  </g>
  <g font-family="sans-serif" font-size="17" fill="#253047" text-anchor="middle">
    <text x="260" y="500">算子输出</text><text x="520" y="500">参数梯度</text><text x="780" y="500">SGD 有效更新</text>
  </g>
  <polyline points="260,233.2 520,237.2 780,237.2" fill="none" stroke="#1665d8" stroke-width="5"/>
  <polyline points="260,302.4 520,102.7 780,102.7" fill="none" stroke="#d33f49" stroke-width="5"/>
  <polyline points="260,383.4 520,331.0 780,331.0" fill="none" stroke="#18845b" stroke-width="5"/>
  <g>
    <g fill="#1665d8"><circle cx="260" cy="233.2" r="7"/><circle cx="520" cy="237.2" r="7"/><circle cx="780" cy="237.2" r="7"/></g>
    <g fill="#d33f49"><circle cx="260" cy="302.4" r="7"/><circle cx="520" cy="102.7" r="7"/><circle cx="780" cy="102.7" r="7"/></g>
    <g fill="#18845b"><circle cx="260" cy="383.4" r="7"/><circle cx="520" cy="331.0" r="7"/><circle cx="780" cy="331.0" r="7"/></g>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="700">
    <g fill="#1665d8"><text x="260" y="217" text-anchor="middle">2.984</text><text x="520" y="221" text-anchor="middle">2.931</text><text x="780" y="221" text-anchor="middle">2.931</text></g>
    <g fill="#d33f49"><text x="260" y="286" text-anchor="middle">2.074</text><text x="520" y="87" text-anchor="middle">4.701</text><text x="780" y="87" text-anchor="middle">4.701</text></g>
    <g fill="#18845b"><text x="260" y="408" text-anchor="middle">1.008</text><text x="520" y="355" text-anchor="middle">1.698</text><text x="780" y="355" text-anchor="middle">1.698</text></g>
  </g>
  <g font-family="sans-serif" font-size="15">
    <circle cx="250" cy="535" r="6" fill="#1665d8"/><text x="265" y="540" fill="#253047">Liger：局部形成</text>
    <circle cx="470" cy="535" r="6" fill="#d33f49"/><text x="485" y="540" fill="#253047">Phi：backward 放大</text>
    <circle cx="715" cy="535" r="6" fill="#18845b"/><text x="730" y="540" fill="#253047">Qwen：backward 形成</text>
  </g>
</svg>
