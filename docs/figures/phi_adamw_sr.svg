<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
  <title id="title">Phi cold-start AdamW 下 deterministic BF16 和 stochastic rounding 的方向持续性</title>
  <desc id="desc">Natural 和 sham 的 A 减一为 0.02959；四个随机舍入重复分别为 0.00045、0.00004、0.00005、0.00182，均低于自身 null 上界。</desc>
  <rect width="1000" height="550" fill="#fff"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">同一 AdamW 协议：随机舍入消除方向持续性</text>
  <text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#5b6475">纵轴为 A−1；短横线是每个实验臂自己的随机抵消 95% 上界</text>
  <g stroke="#d9dee8"><line x1="100" y1="450" x2="940" y2="450"/><line x1="100" y1="330" x2="940" y2="330"/><line x1="100" y1="210" x2="940" y2="210"/><line x1="100" y1="90" x2="940" y2="90"/></g>
  <g font-family="sans-serif" font-size="14" fill="#536070" text-anchor="end">
    <text x="88" y="455">0.00</text><text x="88" y="335">0.01</text><text x="88" y="215">0.02</text><text x="88" y="95">0.03</text>
  </g>
  <g>
    <rect x="130" y="94.9" width="90" height="355.1" rx="5" fill="#d33f49"/>
    <rect x="265" y="94.9" width="90" height="355.1" rx="5" fill="#d9822b"/>
    <rect x="400" y="444.6" width="90" height="5.4" rx="3" fill="#18845b"/>
    <rect x="535" y="449.5" width="90" height="0.5" rx="2" fill="#18845b"/>
    <rect x="670" y="449.4" width="90" height="0.6" rx="2" fill="#18845b"/>
    <rect x="805" y="428.2" width="90" height="21.8" rx="3" fill="#18845b"/>
  </g>
  <g stroke="#1f2937" stroke-width="4">
    <line x1="125" y1="404.9" x2="225" y2="404.9"/><line x1="260" y1="405.0" x2="360" y2="405.0"/>
    <line x1="395" y1="429.9" x2="495" y2="429.9"/><line x1="530" y1="432.3" x2="630" y2="432.3"/>
    <line x1="665" y1="423.6" x2="765" y2="423.6"/><line x1="800" y1="405.5" x2="900" y2="405.5"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g font-size="14" font-weight="700" fill="#253047">
      <text x="175" y="84">0.02959</text><text x="310" y="84">0.02959</text>
      <text x="445" y="425">0.00045</text><text x="580" y="415">0.00004</text>
      <text x="715" y="405">0.00005</text><text x="850" y="416">0.00182</text>
    </g>
    <g font-size="15" fill="#253047">
      <text x="175" y="485">natural</text><text x="310" y="485">sham</text>
      <text x="445" y="485">SR-0</text><text x="580" y="485">SR-1</text>
      <text x="715" y="485">SR-2</text><text x="850" y="485">SR-3</text>
    </g>
  </g>
  <text x="500" y="525" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7a3e00">natural 显著；四个 SR 重复全部低于各自 null，sham 精确复现 natural</text>
</svg>
