<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">从训练调用到深度因果实验的证据漏斗</title>
  <desc id="desc">466419 次 eager 调用，70171 次编译实现调用，186807 个前后向数学单元，1562 个首轮检查位置，少数进入深度因果实验。</desc>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#172033">Coverage 与深度证据是两条不同的门槛</text>
  <g font-family="sans-serif" text-anchor="middle">
    <path d="M90 78 H910 L850 142 H150 Z" fill="#dce9ff" stroke="#3b6fb6" stroke-width="2"/>
    <text x="500" y="108" font-size="25" font-weight="700" fill="#17365d">466,419</text>
    <text x="500" y="132" font-size="15" fill="#17365d">训练执行中记录到的调用</text>

    <path d="M150 154 H850 L790 218 H210 Z" fill="#c9defd" stroke="#3b6fb6" stroke-width="2"/>
    <text x="500" y="184" font-size="25" font-weight="700" fill="#17365d">70,171</text>
    <text x="500" y="208" font-size="15" fill="#17365d">被测编译实现调用</text>

    <path d="M210 230 H790 L730 294 H270 Z" fill="#afd0fb" stroke="#3b6fb6" stroke-width="2"/>
    <text x="500" y="260" font-size="25" font-weight="700" fill="#17365d">186,807</text>
    <text x="500" y="284" font-size="15" fill="#17365d">绑定真实 forward 与 backward 的数学单元</text>

    <path d="M270 306 H730 L670 370 H330 Z" fill="#88b8f5" stroke="#3b6fb6" stroke-width="2"/>
    <text x="500" y="336" font-size="25" font-weight="700" fill="#17365d">1,562 / 1,562</text>
    <text x="500" y="360" font-size="15" fill="#17365d">具体输出位置完成首轮数值处置</text>
  </g>
  <text x="500" y="406" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7a3e00">只有满足 repair、参数可达与数据完整门槛的少数位置进入 16/32 步深测</text>
</svg>
