model:
  model_name_or_path: Qwen/Qwen3-0.6B
  dtype: bfloat16
  attention_backend: sdpa
dataset:
  name: openai/gsm8k
  config: main
  split: train
  max_prompts: 64
  fallback_builtin: true
training:
  max_steps: 300
  learning_rate: 1.0e-6
  per_device_train_batch_size: 4
  num_generations: 4
  num_iterations: 3
  max_completion_length: 128
  generation_kwargs:
    min_new_tokens: 128
  epsilon: 0.2
  save_steps: 30
  seed: 0
