[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-analyzer"
version = "3.1.0"
description = "Automated forward/backward numerical-bias analysis"
requires-python = ">=3.8"

[project.optional-dependencies]
dev = ["pytest>=8"]
statistics = ["numpy", "scipy"]
reference = ["gmpy2>=2.2", "python-flint"]

[project.scripts]
kernel-analyzer = "kernel_analyzer.cli:main"

[tool.setuptools]
packages = ["kernel_analyzer", "kernel_analyzer.reference_eval", "scripts"]
package-dir = {kernel_analyzer = "src/kernel_analyzer", scripts = "scripts"}

[tool.setuptools.package-data]
"kernel_analyzer.reference_eval" = ["data/*.json"]
scripts = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
