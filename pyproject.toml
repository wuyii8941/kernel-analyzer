[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkcert"
version = "0.1.0"
description = "ForkCert: numerical stability certificates for training decisions"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = [
  "torch",
  "transformers",
]
rl = [
  "datasets",
  "accelerate",
  "trl",
]
report = [
  "matplotlib",
  "pandas",
]
test = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", "cache", "results", "reports", "logs", ".git"]
